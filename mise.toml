min_version = "2026.10.18"
monorepo_root = true

[monorepo]
config_roots = ["."]

[tools]
go = "1.27.3"
golangci-lint = "2.14.0"

[tasks.lint]
alias = "lint-run"
description = "Run all Go lint checks"
depends = ["vanity-import:check", "lint:dependency-policy", "lint:collectt", "lint:preempt-guard", "lint:go"]

[tasks."lint:go"]
hide = true
wait_for = ["vanity-import:check", "lint:dependency-policy", "lint:collectt", "lint:preempt-guard"]
run = [
  "golangci-lint run ./... --timeout=6m",
  "cd collector && golangci-lint run ./... --timeout=6m",
]

[tasks."lint:fix"]
alias = "lint-fix"
description = "Apply available Go lint fixes"
run = [
  { task = "vanity-import:fix-check" },
  { task = "lint:dependency-policy" },
  { task = "lint:collectt:fix" },
  { task = "lint:preempt-guard" },
  "golangci-lint run ./... --timeout=6m --fix",
  "cd collector && golangci-lint run ./... --timeout=6m --fix",
]

[tasks."lint:clean-cache"]
alias = "lint-clean-cache"
description = "Clean the golangci-lint cache"
run = "golangci-lint cache clean"

[tasks.fmt]
description = "Format Go code and imports"
run = "golangci-lint fmt"

[tasks."lint:dependency-policy"]
alias = "lint-dependency-policy"
description = "Check dependency policy in container definitions"
run = "if [ -n \"${CI:-}\" ]; then ./scripts/lint-dependency-policy.sh --verbose; else ./scripts/lint-dependency-policy.sh; fi"

[tasks."lint:preempt-guard"]
alias = "lint-preempt-guard"
description = "Check BPF uprobe programs are preemption-guarded"
run = "./scripts/lint-preempt-guard.sh"

[tasks."lint:collectt"]
alias = "lint-collectt"
description = "Lint collectt usage in Go tests"
run = "go run ./internal/test/analyzer/collectt/cmd/collecttlint ./..."

[tasks."lint:collectt:fix"]
alias = "lint-collectt-fix"
description = "Fix and lint collectt usage in Go tests"
run = [
  "go run ./internal/test/analyzer/collectt/cmd/collecttlint -fix ./...",
  "go run ./internal/test/analyzer/collectt/cmd/collecttlint ./...",
]

[tasks."vanity-import:check"]
alias = "vanity-import-check"
description = "Check Go import paths for vanity-import conventions"
run = "go tool -modfile=internal/tools/go.mod porto --include-internal --skip-dirs '^NOTICES$' -l . || { echo '(run: make vanity-import-fix)' >&2; exit 1; }"

[tasks."vanity-import:fix-check"]
alias = "vanity-import-fix-check"
hide = true
run = [
  { task = "vanity-import:fix" },
  { task = "vanity-import:check" },
]

[tasks."vanity-import:fix"]
alias = "vanity-import-fix"
description = "Rewrite Go imports to vanity paths"
run = "go tool -modfile=internal/tools/go.mod porto --include-internal --skip-dirs '^NOTICES$' -w ."
