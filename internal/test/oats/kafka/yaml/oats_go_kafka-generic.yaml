name: oats go kafka generic
interval: 500ms
fixture:
  compose:
    files:
      - ../docker-compose-obi-go-kafka-generic.yml
      - ../../weaver/docker-compose-weaver.yml
seed:
  type: app
input:
  - path: /produce
expected:
  traces:
    - traceql: '{ .messaging.operation.type = "publish" && .messaging.destination.name="my-topic"}'
      match_spans:
        - name: publish my-topic
          attributes:
            - key: messaging.destination.name
              value: my-topic
            - key: messaging.operation.type
              value: publish
            - key: messaging.system
              value: kafka
            - key: server.port
              value: "9093"
    - traceql: '{ .http.route = "/produce" }'
      match_spans:
        - name: GET /produce
          attributes:
            - key: server.port
              value: "8080"
            - key: url.path
              value: /produce
