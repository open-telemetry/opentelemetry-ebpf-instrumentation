oats-schema-version: 2
docker-compose:
  files:
  - ../docker-compose-obi-go-kafka-generic.yml
  - ../../weaver/docker-compose-weaver.yml
input:
- path: /produce
interval: 500ms
expected:
  traces:
  - traceql: '{ .messaging.operation.type = "send" && .messaging.destination.name="my-topic"}'
    equals: send my-topic
    attributes:
      messaging.destination.name: my-topic
      messaging.operation.type: send
      messaging.operation.name: send
      messaging.system: kafka
      server.port: '9093'
  - traceql: '{ .http.route = "/produce" }'
    equals: GET /produce
    attributes:
      server.port: '8080'
      url.path: /produce
