[tasks."test:debug"]
description = "Run the OATS Kafka suite in manual debug mode"
depends = ["prereqs"]
dir = "kafka"
run = [
  'mkdir -p "${TEST_OUTPUT:-testoutput}/run"',
  'TESTCASE_BASE_PATH=./yaml TESTCASE_MANUAL_DEBUG=true TESTCASE_TIMEOUT=1h "$MISE_MONOREPO_ROOT/.mise/scripts/go-tool" ginkgo -v -r',
]

[tasks.test]
description = "Run the OATS component suites in parallel"
depends = ["prereqs"]
run = [
  { tasks = ["test:sql", "test:mongo", "test:redis", "test:kafka", "test:http", "test:memcached", "test:ai", "test:nats", "test:amqp"] },
  { task = "//:itest-coverage-data" },
]
