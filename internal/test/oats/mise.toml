[tasks."integration-test-matrix-json"]
hide = true
run = 'cd "$MISE_MONOREPO_ROOT" && ./scripts/generate-dir-matrix.sh internal/test/oats /harness/'

[tasks.prereqs]
hide = true
depends = ["//:generate", "//:fetch-upstream-semconv"]
run = 'mkdir -p "${TEST_OUTPUT:-$MISE_MONOREPO_ROOT/testoutput}/run"'

[tasks."test:sql"]
description = "Run OATS tests for SQL databases"
depends = ["prereqs"]
dir = "sql"
run = [
  'mkdir -p "${TEST_OUTPUT:-testoutput}/run"',
  'TESTCASE_TIMEOUT=5m TESTCASE_BASE_PATH=./yaml "$MISE_MONOREPO_ROOT/.mise/scripts/go-tool" ginkgo -v -r',
]

