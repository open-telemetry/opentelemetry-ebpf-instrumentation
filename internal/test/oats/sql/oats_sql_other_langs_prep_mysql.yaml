name: "sql other langs prep mysql"
fixture:
  compose:
    template: lgtm
    files:
      - "docker-compose-obi-mysql.yml"
      - ../weaver/docker-compose-weaver.yml
    env:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /argquery
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
interval: 500ms
expected:
  traces:
  - traceql: '{ .db.operation.name = "SELECT" && .db.system.name = "mysql"}'
    match_spans:
      - match_type: strict
        name: "SELECT actor"
        attributes:
          - key: db.operation.name
            value: "SELECT"
          - key: db.collection.name
            value: "actor"
          - key: db.system.name
            value: "mysql"
  metrics:
  - promql: db_client_operation_duration_seconds_sum{db_system_name="mysql"}
    value: '> 0'
  - promql: db_client_operation_duration_seconds_bucket{le="0", db_system_name="mysql"}
    value: == 0
  - promql: db_client_operation_duration_seconds_bucket{le="10", db_system_name="mysql"}
    value: '> 0'
  - promql: db_client_operation_duration_seconds_count{db_system_name="mysql"}
    value: '> 0'
