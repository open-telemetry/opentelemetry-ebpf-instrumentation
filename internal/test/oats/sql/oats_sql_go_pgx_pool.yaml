name: oats sql go pgx pool
interval: 500ms
fixture:
  compose:
    files:
      - docker-compose-obi-gopgx-pool.yml
      - ../weaver/docker-compose-weaver.yml
seed:
  type: app
input:
  - path: /pgxpooltest
expected:
  traces:
    - traceql: '{ name = "SELECT accounting.contacts" }'
      match_spans:
        - name: SELECT accounting.contacts
          attributes:
            - key: db.collection.name
              value: accounting.contacts
            - key: db.operation.name
              value: SELECT
            - key: db.system.name
              value: postgresql
  metrics:
    - promql: db_client_operation_duration_seconds_sum{db_operation_name="SELECT", db_system_name="postgresql", server_address="sqlserver"}
      value: '> 0'
    - promql: db_client_operation_duration_seconds_count{db_operation_name="SELECT", db_system_name="postgresql", server_address="sqlserver"}
      value: '> 0'
