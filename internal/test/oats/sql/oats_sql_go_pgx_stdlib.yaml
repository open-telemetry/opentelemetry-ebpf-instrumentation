name: "sql go pgx stdlib"
fixture:
  compose:
    template: lgtm
    files:
      - "docker-compose-obi-gopgx-stdlib.yml"
      - ../weaver/docker-compose-weaver.yml
    env:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /pgxstdlibtest
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
interval: 500ms
expected:
  traces:
  - traceql: '{ name = "SELECT accounting.contacts" }'
    match_spans:
      - match_type: strict
        name: "SELECT accounting.contacts"
        attributes:
          - key: db.operation.name
            value: "SELECT"
          - key: db.collection.name
            value: "accounting.contacts"
          - key: db.system.name
            value: "postgresql"
  metrics:
  - promql: db_client_operation_duration_seconds_sum{db_operation_name="SELECT", db_system_name="postgresql", server_address="sqlserver"}
    value: '> 0'
  - promql: db_client_operation_duration_seconds_count{db_operation_name="SELECT", db_system_name="postgresql", server_address="sqlserver"}
    value: '> 0'
