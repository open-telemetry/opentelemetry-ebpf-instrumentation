name: oats sql other langs
interval: 500ms
fixture:
  compose:
    files:
      - ../docker-compose-obi-sql.yml
      - ../../weaver/docker-compose-weaver.yml
seed:
  type: app
input:
  - path: /query
expected:
  traces:
    - traceql: '{ .db.operation.name = "SELECT" && .db.system.name = "postgresql"}'
      match_spans:
        - name: SELECT accounting.contacts
          attributes:
            - key: db.collection.name
              value: accounting.contacts
            - key: db.operation.name
              value: SELECT
            - key: db.query.text
              value: SELECT * FROM accounting.contacts WHERE id = 1
            - key: db.system.name
              value: postgresql
            - key: service.peer.name
              value: sqlserver
  metrics:
    - promql: db_client_operation_duration_seconds_sum{db_system_name="postgresql"}
      value: '> 0'
    - promql: db_client_operation_duration_seconds_bucket{le="0", db_system_name="postgresql"}
      value: == 0
    - promql: db_client_operation_duration_seconds_bucket{le="10", db_system_name="postgresql"}
      value: '> 0'
    - promql: db_client_operation_duration_seconds_count{db_system_name="postgresql", server_address="sqlserver"}
      value: '> 0'
