name: "sql go pgx"
fixture:
  compose:
    template: lgtm
    files:
      - "docker-compose-obi-gopgxclient.yml"
      - ../weaver/docker-compose-weaver.yml
    env:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /pgxquery
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /pgxupdate
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /pgxerror
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
interval: 500ms
expected:
  traces:
  # Successful SELECT
  - traceql: '{ name = "SELECT accounting.contacts" }'
    match_spans:
      - match_type: strict
        name: "SELECT accounting.contacts"
        attributes:
          - key: db.operation.name
            value: "SELECT"
          - key: db.collection.name
            value: "accounting.contacts"
          - key: db.system.name
            value: "postgresql"
  # Successful UPDATE
  - traceql: '{ name = "UPDATE accounting.contacts" }'
    match_spans:
      - match_type: strict
        name: "UPDATE accounting.contacts"
        attributes:
          - key: db.operation.name
            value: "UPDATE"
          - key: db.collection.name
            value: "accounting.contacts"
          - key: db.system.name
            value: "postgresql"
  # Error query
  - traceql: '{ .db.operation.name = "SELECT" && status = error }'
    match_spans:
      - match_type: strict
        name: "SELECT nonexistent_table"
        attributes:
          - key: db.operation.name
            value: "SELECT"
          - key: db.collection.name
            value: "nonexistent_table"
          - key: db.system.name
            value: "postgresql"
  metrics:
  # SELECT metrics
  - promql: db_client_operation_duration_seconds_sum{db_operation_name="SELECT", db_system_name="postgresql", server_address="sqlserver"}
    value: '> 0'
  - promql: db_client_operation_duration_seconds_bucket{le="0",db_operation_name="SELECT", db_system_name="postgresql", server_address="sqlserver"}
    value: == 0
  - promql: db_client_operation_duration_seconds_bucket{le="10",db_operation_name="SELECT", db_system_name="postgresql", server_address="sqlserver"}
    value: '> 0'
  - promql: db_client_operation_duration_seconds_count{db_operation_name="SELECT", db_system_name="postgresql", server_address="sqlserver"}
    value: '> 0'
  # UPDATE metrics
  - promql: db_client_operation_duration_seconds_sum{db_operation_name="UPDATE", db_system_name="postgresql", server_address="sqlserver"}
    value: '> 0'
  - promql: db_client_operation_duration_seconds_count{db_operation_name="UPDATE", db_system_name="postgresql", server_address="sqlserver"}
    value: '> 0'
