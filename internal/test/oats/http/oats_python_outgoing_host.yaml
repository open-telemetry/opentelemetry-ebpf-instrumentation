name: python outgoing host
fixture:
  compose:
    files:
    - docker-compose-python-unresolved.yml
    - ../weaver/docker-compose-weaver.yml
    env:
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /with_name
  headers:
    X-Forwarded-Host: public.example
  retry:
    # Each request can block for 10s in the handler; allow enough requests for the counter assertion.
    timeout: 90s
    interval: 500ms
    continue_after_success: true
expected:
  traces:
  - traceql: '{kind=client && name="GET /" && span.service.peer.name="www.google.com"}'
    match_spans:
    - name: GET /
  # server.address comes from the Host header, not X-Forwarded-Host.
  - traceql: '{kind=server && span.url.path="/with_name"}'
    match_spans:
    - match_type: regexp
      name: ^GET
      attributes:
      - key: server.address
        value: localhost
  metrics:
  - promql: traces_service_graph_request_client_seconds_count{client="testserver",
      server="www.google.com"}
    value: '> 5'
