name: oats python outgoing unknown
interval: 500ms
fixture:
  compose:
    files:
      - docker-compose-python-unknown.yml
      - ../weaver/docker-compose-weaver.yml
seed:
  type: app
input:
  - path: /unknown
expected:
  traces:
    - traceql: '{ name="CONNECT" && status = error }'
      match_spans:
        - name: CONNECT
          attributes:
            - key: client.address
              value: testserver
            - key: server.address
              value: 8.8.8.9
            - key: server.port
              value: "80"
  metrics:
    - promql: traces_spanmetrics_latency_count{service_name="testserver", span_name="CONNECT", status_code="STATUS_CODE_ERROR", span_kind="SPAN_KIND_CLIENT" }
      value: '> 1'
    - promql: traces_service_graph_request_failed_total{client="testserver", server="outgoing"}
      value: '> 1'
