routes:
  patterns:
    - /create-trace
    - /smoke
  unmatched: path
attributes:
  select:
    traces:
      # An include list replaces the default set, so the defaults are listed
      # alongside the opt-in attribute this suite needs.
      include:
        - obi.http.response.observed
        - error.type
        - http.request.method_original
        - url.query
        - user_agent.original
        - network.peer.address
        - network.peer.port
        - network.protocol.version
        - dns.question.name
        - db.query.summary
