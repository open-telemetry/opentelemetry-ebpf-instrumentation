name: java tls wildfly
fixture:
  compose:
    files:
    - docker-compose-java-tls-wildfly.yml
    - ../weaver/docker-compose-weaver.yml
    env:
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /api/test-s3
  retry:
    # The container starts before WildFly finishes booting and serving the app.
    timeout: 60s
    interval: 2s
    continue_after_success: true
  headers:
    Accept: text/plain
expected:
  traces:
  - traceql: '{ .url.full = "https://minio/test-bucket/test-file.txt" && .server.address
      = "minio" }'
    match_spans:
    - name: GET /test-bucket/test-file.txt
      attributes:
      - key: server.address
        value: minio
      - key: server.port
        value: '9000'
      - key: url.full
        value: https://minio/test-bucket/test-file.txt
  - traceql: '{ .url.full = "https://minio/test-bucket/test-file.txt" && .obi.http.response.observed
      = false }'
    absent: true
