oats-schema-version: 2
docker-compose:
  files:
  - ../docker-compose-java-tls-netty.yml
  - ../../weaver/docker-compose-weaver.yml
input:
- path: /api/request?url=https://httpbin.org/get
interval: 500ms
expected:
  traces:
  # Netty sends a lowercase host header, so the client span carries the full URL.
  - traceql: '{ .url.full = "https://httpbin.org/get" }'
    equals: GET /get
    attributes:
      server.address: httpbin.org
      server.port: '443'
