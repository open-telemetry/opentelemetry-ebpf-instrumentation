name: oats java routes custom
interval: 500ms
fixture:
  compose:
    files:
      - ../docker-compose-java-routes-custom.yml
      - ../../weaver/docker-compose-weaver.yml
seed:
  type: app
input:
  - path: /greeting123/obitest
expected:
  traces:
    - traceql: '{ .http.route = "/greeting123/{bla}" }'
      match_spans:
        - name: GET /greeting123/{bla}
          attributes:
            - key: server.port
              value: "8085"
            - key: url.path
              value: /greeting123/obitest
