name: python jsonrpc client
fixture:
  compose:
    files:
    - docker-compose-python-jsonrpc-client.yml
    - ../weaver/docker-compose-weaver.yml
    env:
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /call
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
expected:
  traces:
  - traceql: '{ kind = client && .rpc.system.name = "jsonrpc" }'
    match_spans:
    - name: tools/list
      attributes:
      - key: rpc.system.name
        value: jsonrpc
      - key: rpc.method
        value: tools/list
      - key: jsonrpc.protocol.version
        value: '2.0'
      - key: server.port
        value: '8080'
  metrics:
  - promql: rpc_client_call_duration_seconds_count{rpc_system_name="jsonrpc",rpc_method="tools/list"}
    value: '> 0'
