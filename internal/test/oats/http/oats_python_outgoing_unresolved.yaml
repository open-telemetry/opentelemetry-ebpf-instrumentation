name: python outgoing unresolved
fixture:
  compose:
    files:
    - docker-compose-python-unresolved.yml
    - ../weaver/docker-compose-weaver.yml
    env:
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /without_name
  # The handler waits up to 10s per outbound request; 90s allows multiple completions for the >5 counter.
  retry:
    timeout: 90s
    interval: 500ms
    continue_after_success: true
expected:
  metrics:
  - promql: traces_service_graph_request_client_seconds_count{client="testserver",
      server="outgoing"}
    value: '> 5'
