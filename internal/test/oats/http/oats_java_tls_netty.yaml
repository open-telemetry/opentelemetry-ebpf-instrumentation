name: java tls netty
fixture:
  compose:
    files:
    - docker-compose-java-tls-netty.yml
    - ../weaver/docker-compose-weaver.yml
    env:
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /api/request?url=https://httpbin.org/get
  retry:
    # Continue traffic beyond the Java-agent attach deadline to cover late attachment.
    timeout: 120s
    interval: 500ms
    continue_after_success: true
expected:
  traces:
  - traceql: '{ .url.full = "https://httpbin.org/get" }'
    match_spans:
    - name: GET /get
      attributes:
      - key: server.address
        value: httpbin.org
      - key: server.port
        value: '443'
