# Host-networking variant of the weaver-tapping collector (the amqp group runs
# its whole stack on network_mode: host so the client<->broker connection works
# without NAT). lgtm already owns host ports 4317/4318, so this collector
# receives OBI's OTLP on 4319 and fans out to lgtm (127.0.0.1:4317) and the
# weaver container (127.0.0.1:4327, set via weaver's --otlp-grpc-port).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4319

exporters:
  otlp/lgtm:
    endpoint: 127.0.0.1:4317
    tls:
      insecure: true
  otlp/weaver:
    endpoint: 127.0.0.1:4327
    # weaver's OTLP receiver rejects gzip-compressed payloads (Unimplemented).
    compression: none
    tls:
      insecure: true

processors:
  # Weaver validates what OBI emits against OBI's registry. A test application
  # instrumented with its own OpenTelemetry SDK exports through this collector
  # too, and its telemetry follows upstream semconv rather than OBI's
  # definitions, so only resources OBI stamped with its distro name reach
  # weaver.
  filter/obi-only:
    error_mode: ignore
    metrics:
      metric:
        - 'resource.attributes["telemetry.distro.name"] != "opentelemetry-ebpf-instrumentation"'
    traces:
      span:
        - 'resource.attributes["telemetry.distro.name"] != "opentelemetry-ebpf-instrumentation"'

service:
  # On network_mode:host the collector's default self-metrics endpoint
  # (localhost:8888) can collide with other services, so it moves to 18888,
  # where the OATS harness reads the weaver tap's exporter counters.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 18888
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/lgtm]
    metrics:
      receivers: [otlp]
      exporters: [otlp/lgtm]
    traces/weaver:
      receivers: [otlp]
      processors: [filter/obi-only]
      exporters: [otlp/weaver]
    metrics/weaver:
      receivers: [otlp]
      processors: [filter/obi-only]
      exporters: [otlp/weaver]
    logs:
      receivers: [otlp]
      exporters: [otlp/lgtm]
