name: python amqp
fixture:
  compose:
    template: none
    files:
    - docker-compose-lgtm.yml
    - docker-compose-obi-python-amqp.yml
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
  - path: /message
    retry:
      timeout: 10s
      interval: 500ms
      continue_after_success: true
expected:
  traces:
    - traceql: '{ kind=producer && .messaging.system = "amqp" && .messaging.operation.type = "send" }'
      match_spans:
        - name: publish
          attributes:
            - key: messaging.operation.name
              value: publish
            - key: messaging.operation.type
              value: send
            - key: messaging.system
              value: amqp
            - key: server.port
              value: "5672"
    - traceql: '{ kind=consumer && .messaging.system = "amqp" && .messaging.operation.type = "process" }'
      match_spans:
        - name: process
          attributes:
            - key: messaging.operation.name
              value: process
            - key: messaging.operation.type
              value: process
            - key: messaging.system
              value: amqp
            - key: server.port
              value: "5672"
  metrics:
    - promql: messaging_client_operation_duration_seconds_count{messaging_system="amqp"}
      value: '> 0'
    - promql: messaging_client_operation_duration_seconds_bucket{le="0"}
      value: == 0
    - promql: messaging_client_operation_duration_seconds_bucket{le="10"}
      value: '> 0'
    - promql: messaging_process_duration_seconds_count{messaging_system="amqp"}
      value: '> 0'
    - promql: messaging_process_duration_seconds_bucket{le="0"}
      value: == 0
    - promql: messaging_process_duration_seconds_bucket{le="10"}
      value: '> 0'
