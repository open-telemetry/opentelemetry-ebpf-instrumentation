services:
  artemis:
    image: apache/activemq-artemis:2.44.0@sha256:0305c26f19eda00c0506d0953cfe265600a72ac1b17f7934412120c01a595cff
    network_mode: host
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8161/ > /dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  testserver:
    build:
      context: ../../../..
      dockerfile: ./internal/test/integration/components/javaamqp/Dockerfile
    image: javaamqp
    network_mode: host
    environment:
      AMQP_URL: amqp://127.0.0.1:5672?jms.connectTimeout=5000&jms.requestTimeout=5000&jms.sendTimeout=5000&jms.prefetchPolicy.all=0
      AMQP_USERNAME: artemis
      AMQP_PASSWORD: artemis
      AMQP_QUEUE: oats-java-amqp
    depends_on:
      artemis:
        condition: service_healthy

  autoinstrumenter:
    image: hatest-obi
    command:
      - --config=/configs/instrumenter-config-traces.yml
    volumes:
      - ./configs:/configs
      - ./testoutput/run:/var/run/obi
      - ../../../../testoutput:/coverage
    privileged: true
    network_mode: "service:testserver"
    pid: "service:testserver"
    environment:
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_TRACE_PRINTER: "text"
      OTEL_EBPF_OPEN_PORT: "8080"
      OTEL_EBPF_SERVICE_NAMESPACE: "integration-test"
      OTEL_EBPF_METRICS_INTERVAL: "1s"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_BPF_CONTEXT_PROPAGATION: "disabled"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
      OTEL_EBPF_BPF_DEBUG: "true"
      # Export through the weaver-tapping collector (host port 4319) instead of
      # straight to lgtm (4318), so weaver validates the emitted telemetry.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://127.0.0.1:4319"
    depends_on:
      testserver:
        condition: service_started

  # Collector in front of lgtm (host networking): receives OBI's OTLP on 4319
  # and fans out to lgtm (127.0.0.1:4317) and weaver (127.0.0.1:4327).
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    network_mode: host
    volumes:
      - ./configs:/configs
    command: ["--config=/configs/otelcol-weaver-host.yaml"]
    labels:
      io.opentelemetry.obi.weaver-tap.telemetry-url: "http://127.0.0.1:18888/metrics"
    depends_on:
      weaver:
        condition: service_healthy

  # Weaver semantic-convention live-check (host networking). lgtm owns 4317, so
  # weaver's OTLP listener is moved to 4327; the admin API stays on 4320. The OATS
  # harness stops it after the checks and fails the test on any actionable advisory.
  weaver:
    image: otel/weaver:v0.28.0@sha256:5857bb81d8cc7ed608cdcae37c4b459eb020f21dd4acade35f7933cd6762fbcc
    network_mode: host
    user: "0:0"
    working_dir: /obi-registry
    command:
      - registry
      - live-check
      - --registry
      - /obi-registry
      - --otlp-grpc-port
      - "4327"
      - --admin-port
      - "4320"
      - --format
      - compact
      - --templates
      - /obi-registry/.live_check_templates
      - --diagnostic-format
      - json
      - --output
      - http
    volumes:
      - ../../../../schemas/obi:/obi-registry:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=1 -q -O /dev/null http://127.0.0.1:4320/health"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 90s
