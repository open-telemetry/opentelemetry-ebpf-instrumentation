name: open ai test go http2
fixture:
  compose:
    files:
    - docker-compose-open-ai-go-http2.yml
    - ../weaver/docker-compose-weaver.yml
    env:
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /messages
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /error
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /chat
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /conversations
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /embeddings
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /decisions
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
expected:
  traces:
  # Messages API call
  - traceql: '{ .gen_ai.provider.name = "openai" && .gen_ai.request.model = "gpt-5-mini" && .gen_ai.response.id = "resp_09687a288637e2be006998ad7af05481a2bb0938f77da5a9db"}'
    match_spans:
    - name: response gpt-5-mini
      attributes:
      - key: gen_ai.input.messages
        value: '[{"role":"user","parts":[{"type":"text","content":"How do I check if a Python object is an instance of a class?"}]}]'
      - key: gen_ai.operation.name
        value: response
      - key: gen_ai.system_instructions
        value: '[{"type":"text","content":"You are a coding assistant that talks like a pirate."}]'
      - key: gen_ai.response.model
        value: gpt-5-mini-2025-08-07
  # Error returned by OpenAI
  - traceql: '{ .error.type = "insufficient_quota" && .gen_ai.request.model = "gpt-5-mini"}'
    match_spans:
    - name: response gpt-5-mini
      attributes:
      - key: gen_ai.input.messages
        value: '[{"role":"user","parts":[{"type":"text","content":"How do I check if a Python object is an instance of a class?"}]}]'
      - key: gen_ai.system_instructions
        value: '[{"type":"text","content":"You are a coding assistant that talks like a pirate."}]'
      - key: gen_ai.provider.name
        value: openai
      - key: gen_ai.operation.name
        value: response
  # Chat completion
  - traceql: '{ .gen_ai.provider.name = "openai" && .gen_ai.request.model = "gpt-4o-mini"}'
    match_spans:
    - name: chat gpt-4o-mini
      attributes:
      - key: gen_ai.operation.name
        value: chat
      - key: gen_ai.response.model
        value: gpt-4o-mini-2024-07-18
      - key: gen_ai.usage.output_tokens
        value: 816
  # Conversations
  - traceql: '{ .gen_ai.provider.name = "openai" && .gen_ai.request.model = "gpt-5-mini" && .gen_ai.response.id = "conv_699c949418b08194ba11beed9ba85d9607f4edeb470fde91"}'
    match_spans:
    - name: conversation gpt-5-mini
      attributes:
      - key: gen_ai.operation.name
        value: conversation
      - key: gen_ai.conversation.id
        value: conv_699c949418b08194ba11beed9ba85d9607f4edeb470fde91
  # OpenAI embeddings API (client span via OpenAISpan + /v1/embeddings)
  - traceql: '{ .gen_ai.provider.name = "openai" && .gen_ai.operation.name = "embeddings" && .gen_ai.request.model = "text-embedding-3-small"}'
    match_spans:
    - name: embeddings text-embedding-3-small
      attributes:
      - key: gen_ai.operation.name
        value: embeddings
      - key: gen_ai.input.messages
        value: '[{"role":"user","parts":[{"type":"text","content":"The food was delicious"}]}]'
      - key: gen_ai.response.model
        value: text-embedding-3-small
      - key: gen_ai.usage.input_tokens
        value: 5
  # Decisions API
  - traceql: '{ .gen_ai.provider.name = "openai" && .gen_ai.request.model = "gpt-6-luna" }'
    match_spans:
    - name: decision gpt-6-luna
      attributes:
      - key: gen_ai.operation.name
        value: decision
      - key: gen_ai.input.messages
        value: '[{"role":"developer","parts":[{"type":"text","content":"Assess the customer report."}]},{"role":"user","parts":[{"type":"text","content":"The package arrived with a broken screen."},{"type":"text","content":"The screen does not turn on."}]}]'
      - key: openai.api.type
        value: decisions
      - key: openai.request.questions
        value: '[{"type":"predicate","name":"damaged","instructions":[{"type":"input_text","text":"Does the customer report a damaged item?"},{"type":"input_json","data":{"policy":"returns"}}]},{"type":"choice","name":"priority","instructions":"Choose the handling priority.","choices":[{"value":"urgent","description":"Immediate handling"},{"value":true,"description":"Flag for manual review"}]},{"type":"score","name":"severity","instructions":"Rate the damage severity.","levels":[{"label":"minor","description":"Cosmetic damage"},{"label":"major","description":"Item is unusable"}]}]'
  metrics:
  - promql: gen_ai_client_token_usage_count{gen_ai_operation_name="response",gen_ai_provider_name="openai",gen_ai_token_type="input",gen_ai_request_model="gpt-5-mini",gen_ai_response_model="gpt-5-mini-2025-08-07"}
    value: '> 0'
  - promql: gen_ai_client_token_usage_count{gen_ai_operation_name="response",gen_ai_provider_name="openai",gen_ai_token_type="output",gen_ai_request_model="gpt-5-mini",gen_ai_response_model="gpt-5-mini-2025-08-07"}
    value: '> 0'
  - promql: gen_ai_client_operation_duration_seconds_count{gen_ai_operation_name="response",gen_ai_provider_name="openai",gen_ai_request_model="gpt-5-mini",gen_ai_response_model="gpt-5-mini-2025-08-07"}
    value: '> 0'
  - promql: gen_ai_client_token_usage_count{gen_ai_operation_name="embeddings",gen_ai_provider_name="openai",gen_ai_token_type="input",gen_ai_request_model="text-embedding-3-small",gen_ai_response_model="text-embedding-3-small"}
    value: '> 0'
  - promql: gen_ai_client_operation_duration_seconds_count{gen_ai_operation_name="embeddings",gen_ai_provider_name="openai",gen_ai_request_model="text-embedding-3-small",gen_ai_response_model="text-embedding-3-small"}
    value: '> 0'
