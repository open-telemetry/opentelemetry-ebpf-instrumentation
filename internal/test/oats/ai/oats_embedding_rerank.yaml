name: embedding rerank
fixture:
  compose:
    files:
    - docker-compose-embedding-rerank.yml
    - ../weaver/docker-compose-weaver.yml
    env:
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /embeddings/cohere
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /embeddings/voyage
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /rerank
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
expected:
  traces:
  # Embedding-only providers, matched on the vendor host and API path
  - traceql: '{ .gen_ai.provider.name = "cohere" && .gen_ai.operation.name = "embeddings" }'
    match_spans:
    - name: embeddings embed-v4.0
      attributes:
      - key: gen_ai.request.model
        value: embed-v4.0
      - key: gen_ai.response.model
        value: embed-v4.0
      - key: gen_ai.usage.input_tokens
        value: 5
  - traceql: '{ .gen_ai.provider.name = "voyage" && .gen_ai.operation.name = "embeddings" }'
    match_spans:
    - name: embeddings voyage-3.5
      attributes:
      - key: gen_ai.request.model
        value: voyage-3.5
      - key: gen_ai.usage.input_tokens
        value: 5
  - traceql: '{ .gen_ai.provider.name = "cohere" && .gen_ai.operation.name = "rerank" }'
    match_spans:
    - name: rerank rerank-v3.5
      attributes:
      - key: gen_ai.request.model
        value: rerank-v3.5
      - key: gen_ai.response.model
        value: rerank-v3.5
      - key: gen_ai.response.id
        value: rerank-1
      - key: gen_ai.usage.input_tokens
        value: 23
  metrics:
  - promql: gen_ai_client_operation_duration_seconds_count{gen_ai_operation_name="embeddings",gen_ai_provider_name="cohere",gen_ai_request_model="embed-v4.0"}
    value: '> 0'
  - promql: gen_ai_client_token_usage_count{gen_ai_operation_name="embeddings",gen_ai_provider_name="cohere",gen_ai_token_type="input",gen_ai_request_model="embed-v4.0"}
    value: '> 0'
  - promql: gen_ai_client_operation_duration_seconds_count{gen_ai_operation_name="embeddings",gen_ai_provider_name="voyage",gen_ai_request_model="voyage-3.5"}
    value: '> 0'
  - promql: gen_ai_client_token_usage_count{gen_ai_operation_name="embeddings",gen_ai_provider_name="voyage",gen_ai_token_type="input",gen_ai_request_model="voyage-3.5"}
    value: '> 0'
  - promql: gen_ai_client_operation_duration_seconds_count{gen_ai_operation_name="rerank",gen_ai_provider_name="cohere",gen_ai_request_model="rerank-v3.5"}
    value: '> 0'
  - promql: gen_ai_client_token_usage_count{gen_ai_operation_name="rerank",gen_ai_provider_name="cohere",gen_ai_token_type="input",gen_ai_request_model="rerank-v3.5"}
    value: '> 0'
