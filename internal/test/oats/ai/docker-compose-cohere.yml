version: "3.9"
services:
  vendor:
    build:
      context: ../../integration/components/ai/openai/mock-server
      dockerfile: Dockerfile
    image: openai
    networks:
      default:
        aliases:
          - api.cohere.com
  testserver:
    build:
      context: ../../integration/components/ai/openai/go
      dockerfile: Dockerfile
    image: testserver
    ports:
      - "8080:8080"
    environment:
      COHERE_BASE_URL: "http://api.cohere.com:8081"
    depends_on:
      vendor:
        condition: service_started
  # eBPF auto instrumenter
  autoinstrumenter:
    build:
      context: ../../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    command:
      # Cohere chat is a Config v2 only payload extractor; v2 reads its
      # settings from the file, not from OTEL_EBPF_* environment variables.
      - --config=/configs/instrumenter-config-traces-genai-v2.yml
    volumes:
      - ./configs:/configs
      - ./testoutput/run:/var/run/obi
      - ../../../../testoutput:/coverage
    cap_add:
      - SYS_ADMIN
    privileged: true # in some environments (not GH Pull Requests) you can set it to false and then cap_add: [ SYS_ADMIN ]
    network_mode: "service:testserver"
    pid: "service:testserver"
    environment:
      GOCOVERDIR: "/coverage"
    depends_on:
      testserver:
        condition: service_started
