name: cohere
fixture:
  compose:
    files:
    - docker-compose-cohere.yml
    - ../weaver/docker-compose-weaver.yml
    env:
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /cohere/chat
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /cohere/chat/stream
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /cohere/chat/error
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
expected:
  traces:
  # Chat with a tool result: the document block must reach gen_ai.input.messages
  - traceql: '{ .gen_ai.provider.name = "cohere" && .gen_ai.request.model = "command-a-03-2025" && .gen_ai.response.id = "c14c80c3-18eb-4519-9460-6c92edd8cfb4"}'
    match_spans:
    - name: chat command-a-03-2025
      attributes:
      - key: gen_ai.operation.name
        value: chat
      - key: gen_ai.response.model
        value: command-a-03-2025
      - key: gen_ai.request.max_tokens
        value: 256
      - key: gen_ai.request.temperature
        value: 0.3
      - key: gen_ai.request.top_k
        value: 40
      - key: gen_ai.usage.input_tokens
        value: 512
      - key: gen_ai.usage.output_tokens
        value: 12
      - key: gen_ai.input.messages
        value: '[{"role":"system","parts":[{"type":"text","content":"You are a sales assistant."}]},{"role":"user","parts":[{"type":"text","content":"What were the sales on 2023-09-29?"}]},{"role":"assistant","parts":[{"type":"tool_call","id":"query_daily_sales_report_0","name":"query_daily_sales_report","arguments":"{\"day\":\"2023-09-29\"}"}]},{"role":"tool","parts":[{"type":"tool_call_response","result":"{\"total_sales_amount\":10000}","id":"query_daily_sales_report_0"}]}]'
      - key: gen_ai.output.messages
        value: '[{"role":"assistant","parts":[{"type":"text","content":"Total sales on 2023-09-29 were $10,000."}],"finish_reason":"COMPLETE"}]'
  # Streaming (SSE) chat
  - traceql: '{ .gen_ai.provider.name = "cohere" && .gen_ai.request.model = "command-a-03-2025" && .gen_ai.response.id = "29f14a5a-11de-4cae-9800-25e4747408ea"}'
    match_spans:
    - name: chat command-a-03-2025
      attributes:
      - key: gen_ai.operation.name
        value: chat
      - key: gen_ai.request.stream
        value: true
      - key: gen_ai.usage.input_tokens
        value: 71
      - key: gen_ai.usage.output_tokens
        value: 2
      - key: gen_ai.output.messages
        value: '[{"role":"assistant","parts":[{"type":"text","content":"Hello!"}],"finish_reason":"COMPLETE"}]'
  # Error response: Cohere reports no error type, so error.type is the HTTP status
  - traceql: '{ .error.type = "400" && .gen_ai.provider.name = "cohere" && .gen_ai.request.model = "command-unknown"}'
    match_spans:
    - name: chat command-unknown
      attributes:
      - key: gen_ai.operation.name
        value: chat
      - key: gen_ai.response.id
        value: 0a1b2c3d-4e5f-6789-abcd-ef0123456789
  metrics:
  - promql: gen_ai_client_token_usage_count{gen_ai_operation_name="chat",gen_ai_provider_name="cohere",gen_ai_token_type="input",gen_ai_request_model="command-a-03-2025",gen_ai_response_model="command-a-03-2025"}
    value: '> 0'
  - promql: gen_ai_client_operation_duration_seconds_count{gen_ai_operation_name="chat",gen_ai_provider_name="cohere",gen_ai_request_model="command-a-03-2025"}
    value: '> 0'
