name: retrieval
fixture:
  compose:
    files:
    - docker-compose-retrieval.yml
    - ../weaver/docker-compose-weaver.yml
    env:
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    app_service: testserver
    app_port: 8080
  finalize:
    command: ../finalize-weaver.sh
    timeout: 3m
input:
- path: /search
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
- path: /query
  retry:
    timeout: 10s
    interval: 500ms
    continue_after_success: true
expected:
  traces:
  # Qdrant similarity search, matched on the vendor host map
  - traceql: '{ .gen_ai.provider.name = "qdrant" && .gen_ai.operation.name = "retrieval" }'
    match_spans:
    - name: retrieval
      attributes:
      - key: gen_ai.provider.name
        value: qdrant
      - key: gen_ai.operation.name
        value: retrieval
  metrics:
  - promql: gen_ai_client_operation_duration_seconds_count{gen_ai_operation_name="retrieval",gen_ai_provider_name="qdrant"}
    value: '> 0'
