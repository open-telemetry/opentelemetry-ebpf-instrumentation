services:
  testserver:
    image: python:3.15.0-slim@sha256:ea4f1f290e071bf7d28199cfb3e09f5dbad31b50e9c32fd58f2f2d7be915f3ae
    volumes:
      - ./exchange.py:/exchange.py:ro
    command: ["python", "/exchange.py"]
    ports:
      - "127.0.0.1::8080"

  jpos:
    build:
      context: ../../../..
      dockerfile: ./internal/test/integration/components/javaiso8583/Dockerfile
    image: javaiso8583
    network_mode: "service:testserver"
    pid: "service:testserver"
    depends_on:
      testserver:
        condition: service_started

  autoinstrumenter:
    image: ${OBI_TEST_IMAGE:-hatest-obi}
    privileged: true
    network_mode: "service:testserver"
    pid: "service:testserver"
    environment:
      OTEL_EBPF_OPEN_PORT: "8080,8583,8584,8585"
      OTEL_EBPF_TRACES_INSTRUMENTATIONS: "iso8583,mqtt,http"
      OTEL_EBPF_METRICS_INSTRUMENTATIONS: "iso8583,mqtt"
      OTEL_EBPF_METRICS_INTERVAL: "1s"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4318"
    depends_on:
      testserver:
        condition: service_started
      jpos:
        condition: service_started
