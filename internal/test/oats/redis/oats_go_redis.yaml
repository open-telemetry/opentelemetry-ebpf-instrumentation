name: oats go redis
interval: 500ms
fixture:
  compose:
    files:
      - docker-compose-obi-go-redis.yml
      - ../weaver/docker-compose-weaver.yml
seed:
  type: app
input:
  - path: /query
expected:
  traces:
    - traceql: '{ .db.operation.name = "set" && .db.system.name = "redis" }'
      match_spans:
        - name: set
          attributes:
            - key: db.operation.name
              value: set
            - key: db.query.text
              value: set obi rocks
            - key: db.system.name
              value: redis
            - key: server.port
              value: "6379"
  metrics:
    - promql: db_client_operation_duration_seconds_sum{db_operation_name="get", db_system_name="redis"}
      value: '> 0'
    - promql: db_client_operation_duration_seconds_bucket{le="0", db_operation_name="get", db_system_name="redis"}
      value: == 0
    - promql: db_client_operation_duration_seconds_bucket{le="10", db_operation_name="get", db_system_name="redis"}
      value: '> 0'
    - promql: db_client_operation_duration_seconds_count{db_operation_name="get", db_system_name="redis"}
      value: '> 0'
    - promql: db_client_operation_duration_seconds_sum{db_operation_name="set", db_system_name="redis"}
      value: '> 0'
    - promql: db_client_operation_duration_seconds_bucket{le="0", db_operation_name="set", db_system_name="redis"}
      value: == 0
    - promql: db_client_operation_duration_seconds_bucket{le="10", db_operation_name="set", db_system_name="redis"}
      value: '> 0'
    - promql: db_client_operation_duration_seconds_count{db_operation_name="set", db_system_name="redis"}
      value: '> 0'
