services:
  server:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/peermetadata/Dockerfile
    image: hatest-peer-metadata-workload
    command: [server, "8080"]
    environment:
      OTEL_SERVICE_NAME: backend
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=backend-ns
    ports:
      - "18998:8998"
      - "18999:8999"

  idle-server:
    image: hatest-peer-metadata-workload
    command: [server, "8082"]
    network_mode: service:server
    pid: service:server
    environment:
      OTEL_SERVICE_NAME: idle-backend
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=backend-ns
    depends_on:
      - server

  client:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/peermetadata/Dockerfile
    image: hatest-peer-metadata-workload
    command: [client, server]
    environment:
      OTEL_SERVICE_NAME: frontend
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=frontend-ns
    ports:
      - "8081:8081"
      - "28998:8998"
      - "28999:8999"
    depends_on:
      - server

  second-caller:
    image: hatest-peer-metadata-workload
    profiles: [ambiguous]
    command: [caller, server]
    network_mode: service:client
    pid: service:client
    environment:
      OTEL_SERVICE_NAME: second-caller
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=frontend-ns
    depends_on:
      - client

  # Queries the client agent from the server's network namespace, so caller observations are scoped to the server.
  server-grpcurl:
    image: fullstorydev/grpcurl:v1.9.3@sha256:085e183ca334eb4e81ca81ee12cbb2b2737505d1d77f5e33dabc5d066593d998
    profiles: [tools]
    network_mode: service:server
    volumes:
      - ../../../proto:/proto:ro

  obi:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/obi/Dockerfile
    image: hatest-obi-peer-metadata-server
    command: ["--config=/configs/${PEER_METADATA_SERVER_CONFIG:-obi-config-peer-metadata-server-v2.yml}"]
    privileged: true
    network_mode: service:server
    pid: service:server
    environment:
      GOCOVERDIR: /coverage
    volumes:
      - ./configs:/configs:ro
      - ./system/sys/kernel/security:/sys/kernel/security
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-peer-metadata-server:/var/run/obi
    depends_on:
      - server
      - idle-server
      - jaeger
      - otelcol

  client-obi:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/obi/Dockerfile
    image: hatest-obi-peer-metadata-client
    command: ["--config=/configs/${PEER_METADATA_CLIENT_CONFIG:-obi-config-peer-metadata-client-v2.yml}"]
    privileged: true
    network_mode: service:client
    pid: service:client
    environment:
      GOCOVERDIR: /coverage
    volumes:
      - ./configs:/configs:ro
      - ./system/sys/kernel/security:/sys/kernel/security
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-peer-metadata-client:/var/run/obi
    depends_on:
      - client
      - jaeger
      - otelcol

  # Central metadata service, used by the agents in central mode.
  metadata-service:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/metadataservice/Dockerfile
    image: hatest-peer-metadata-service
    profiles: [central]

  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "16686:16686"

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol-config/otelcol-config.yml"]
    volumes:
      - ./configs:/etc/otelcol-config:ro
    ports:
      - "19464:9464"
    depends_on:
      - jaeger
