
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        server_name mock-imds;

        location /metadata/identity/oauth2/token {
            default_type application/json;
            return 200 '{"access_token":"azure-integration-token","expires_on":"9999999999","expires_in":"3600","token_type":"Bearer","resource":"https://management.azure.com/"}';
        }

        location /metadata/instance/compute {
            default_type application/json;
            alias /azure-metadata-mock.json;
        }
    }

}
