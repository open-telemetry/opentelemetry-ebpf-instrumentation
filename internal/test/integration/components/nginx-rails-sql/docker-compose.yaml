services:
  certgen:
    build:
      context: ./certgen
    image: rails-nginx-sql-certgen:latest
    volumes:
      - mysql_server_certs:/out/mysql-server
      - mysql_client_certs:/out/mysql-client
      - nginx_certs:/out/nginx

  app:
    build:
      context: ./testapi
    command: bash -c "sleep 10 && bundle exec rails db:create db:migrate db:seed && rails server -p 3040 -b 0.0.0.0"
    image: myapp:latest
    container_name: rails_app
    expose:
      - "3040" # Rails app listens on port 3040
    networks:
      - app_network
    volumes:
      - mysql_client_certs:/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
      db:
        condition: service_started

  nginx:
    image: nginx:1.31.3@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    container_name: nginx_server
    ports:
      - "443:443" # Expose TLS port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/tls:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
      app:
        condition: service_started
    networks:
      - app_network

  db:
    image: mysql:26.10.0@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5
    command:
      - --ssl-ca=/etc/mysql/certs/ca.pem
      - --ssl-cert=/etc/mysql/certs/server-cert.pem
      - --ssl-key=/etc/mysql/certs/server-key.pem
      - --bind-address=0.0.0.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: my_database
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - mysql_server_certs:/etc/mysql/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
    networks:
      - app_network

volumes:
  db_data:
  mysql_server_certs:
  mysql_client_certs:
  nginx_certs:

networks:
  app_network:
