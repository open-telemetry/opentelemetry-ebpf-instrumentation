worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        root /var/www/laravel/public;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_pass php-harvest-laravel:9000;
            internal;
        }
    }

    server {
        listen 81;
        root /var/www/symfony-harvest/public;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_pass php-harvest-symfony:9000;
            internal;
        }
    }

    server {
        listen 82;
        root /var/www/slim/public;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_pass php-harvest-slim:9000;
            internal;
        }
    }
}
