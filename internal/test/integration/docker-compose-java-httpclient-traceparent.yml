services:
  testserver:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/java_httpclient_traceparent/Dockerfile
      args:
        - JAVA_HTTPCLIENT_RUNTIME_IMAGE
    image: "${JAVA_HTTPCLIENT_FIXTURE_IMAGE:-hatest-java-httpclient-traceparent}"
    command: [service]
    environment:
      OTEL_SERVICE_NAME: java-httpclient
    ports:
      - "18080:8080"
      - "18081:8081"

  proxy:
    image: "${JAVA_HTTPCLIENT_FIXTURE_IMAGE:-hatest-java-httpclient-traceparent}"
    entrypoint: [/fixture/proxy]
    ports:
      - "18082:8082"
    depends_on:
      testserver:
        condition: service_started

  downstream:
    image: "${JAVA_HTTPCLIENT_FIXTURE_IMAGE:-hatest-java-httpclient-traceparent}"
    command: [downstream]
    environment:
      OTEL_SERVICE_NAME: java-downstream
      JAVA_TOOL_OPTIONS: "${JAVA_HTTPCLIENT_DOWNSTREAM_OPTIONS:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_BSP_SCHEDULE_DELAY: 100
    ports:
      - "18086:8086"
    depends_on:
      testserver:
        condition: service_started

  obi:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/obi/Dockerfile-with-javaagent
    image: "${JAVA_HTTPCLIENT_OBI_IMAGE:-hatest-obi-javaagent}"
    privileged: true
    pid: host
    network_mode: host
    command: ["--config=/configs/obi-config-java-httpclient-traceparent.yml"]
    environment:
      JAVA_HTTPCLIENT_PROPAGATION: "${JAVA_HTTPCLIENT_PROPAGATION:-headers}"
      JAVA_HTTPCLIENT_PORTS: "${JAVA_HTTPCLIENT_PORTS:-8080,8086}"
    volumes:
      - ./configs:/configs:ro
      - ./system/sys/kernel/security_none:/sys/kernel/security:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /sys/fs/cgroup:/sys/fs/cgroup
    depends_on:
      testserver:
        condition: service_started
      downstream:
        condition: service_started
      jaeger:
        condition: service_started

  jaeger:
    extends:
      file: docker-compose-java-dist.yml
      service: jaeger
