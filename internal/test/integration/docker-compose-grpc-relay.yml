services:
  # Go entry: HTTP on 8080, calls python-relay via gRPC
  go-entry:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/grpc_relay/go/Dockerfile
    image: hatest-grpc-relay-go-entry
    environment:
      HTTP_PORT: "8080"
      NEXT_HOP: "python-relay:50051"
    ports:
      - "8080:8080"
    depends_on:
      python-relay:
        condition: service_started

  # Python relay: gRPC on 50051, calls rust-relay via gRPC
  python-relay:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/grpc_relay/python/Dockerfile
    image: hatest-grpc-relay-python
    environment:
      GRPC_PORT: "50051"
      NEXT_HOP: "rust-relay:50052"
    depends_on:
      rust-relay:
        condition: service_started

  # Rust relay: gRPC on 50052, calls nodejs-relay via gRPC
  rust-relay:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/grpc_relay/rust/Dockerfile
    image: hatest-grpc-relay-rust
    environment:
      GRPC_PORT: "50052"
      NEXT_HOP: "nodejs-relay:50053"
    depends_on:
      nodejs-relay:
        condition: service_started

  # Node.js relay: gRPC on 50053, calls java-relay via gRPC
  nodejs-relay:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/grpc_relay/nodejs/Dockerfile
    image: hatest-grpc-relay-nodejs
    environment:
      GRPC_PORT: "50053"
      NEXT_HOP: "java-relay:50055"
      GRPC_DNS_RESOLVER: "native"
    depends_on:
      java-relay:
        condition: service_started

  # Java relay: gRPC on 50055, calls go-terminal via gRPC
  java-relay:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/grpc_relay/java/Dockerfile
    image: hatest-grpc-relay-java
    environment:
      GRPC_PORT: "50055"
      NEXT_HOP: "go-terminal:50054"
    depends_on:
      go-terminal:
        condition: service_started

  # Go terminal: gRPC on 50054, end of chain
  go-terminal:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/grpc_relay/go/Dockerfile
    image: hatest-grpc-relay-go-terminal
    environment:
      GRPC_PORT: "50054"
    depends_on:
      jaeger:
        condition: service_started

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    command:
      - --config=/configs/obi-config-grpc-relay.yml
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security:/sys/kernel/security
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-grpc-relay:/var/run/obi
    image: hatest-obi
    privileged: true
    pid: "host"
    environment:
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_TRACE_PRINTER: "text"
      OTEL_EBPF_METRICS_INTERVAL: "10ms"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EBPF_HOSTNAME: "beyla"
      OTEL_EBPF_BPF_CONTEXT_PROPAGATION: "${OTEL_EBPF_BPF_CONTEXT_PROPAGATION:-all}"
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: "100ms"
      OTEL_EBPF_SKIP_GO_SPECIFIC_TRACERS: "1"
      OTEL_EBPF_BPF_DEBUG: "true"
    depends_on:
      go-entry:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.60@sha256:4fd2d70fa347d6a47e79fcb06b1c177e6079f92cba88b083153d56263082135e
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug
