version: "3.8"

services:
  testserver:
    build:
      context: ../../../internal/test/integration/components/pythonmcp/
      dockerfile: Dockerfile
    image: hatest-testserver-python-mcp
    ports:
      - "${TEST_SERVICE_PORTS}"
      # obi shares this network namespace and serves its direct Prometheus
      # exporter on 8999; publish it here so the prometheus container can
      # scrape it via the host bridge address.
      - "8999:8999"
    environment:
      REMOTE_MCP_URL: "http://mcpremote:8080/mcp"
    depends_on:
      otelcol:
        condition: service_started
      mcpremote:
        condition: service_started

  # A second MCP server the instrumented one calls out to, so the same process
  # produces client-kind MCP spans as well as server-kind ones.
  mcpremote:
    build:
      context: ../../../internal/test/integration/components/pythonmcp/
      dockerfile: Dockerfile
    image: hatest-testserver-python-mcp

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security:/sys/kernel/security
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-python-mcp:/var/run/obi
    image: hatest-obi
    privileged: true
    network_mode: "service:testserver"
    pid: "service:testserver"
    environment:
      OTEL_EBPF_CONFIG_PATH: "/configs/obi-config.yml"
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_TRACE_PRINTER: "text"
      OTEL_EBPF_OPEN_PORT: "${OTEL_EBPF_OPEN_PORT}"
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_EXECUTABLE_PATH: "${OTEL_EBPF_EXECUTABLE_PATH}"
      OTEL_EBPF_SERVICE_NAMESPACE: "integration-test"
      OTEL_EBPF_METRICS_INTERVAL: "1s"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
      OTEL_EBPF_BPF_DEBUG: "TRUE"
      OTEL_EBPF_HOSTNAME: "obi"
      OTEL_EBPF_BPF_HTTP_REQUEST_TIMEOUT: "5s"
      OTEL_EBPF_PROCESSES_INTERVAL: "100ms"
      OTEL_EBPF_METRICS_FEATURES: "application"
      OTEL_EBPF_BPF_BUFFER_SIZE_HTTP: 1024
      OTEL_EBPF_HTTP_MCP_ENABLED: true
      OTEL_EBPF_METRICS_TTL: "5s"
      OTEL_EBPF_PROMETHEUS_PORT: "8999"
      OTEL_EBPF_PROMETHEUS_TTL: "5s"
    depends_on:
      testserver:
        condition: service_started

  # OpenTelemetry Collector
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    container_name: otel-col
    deploy:
      resources:
        limits:
          memory: 125M
    restart: unless-stopped
    command: ["--config=/etc/otelcol-config/otelcol-config-weaver.yml"]
    volumes:
      - ./configs/:/etc/otelcol-config
    ports:
      - "4317" # OTLP over gRPC receiver
      - "4318:4318" # OTLP over HTTP receiver
      - "9464" # Prometheus exporter
      - "8888" # metrics endpoint
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
      weaver:
        condition: service_healthy


  weaver:
    extends:
      file: components/weaver/service.yml
      service: weaver
    volumes:
      - ../../../schemas/obi:/obi-registry:ro
  prometheus:
    image: quay.io/prometheus/prometheus:v3.16.0@sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus-config-mcp.yml
      - --web.enable-lifecycle
      - --web.route-prefix=/
    volumes:
      - ./configs/:/etc/prometheus
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "16686:16686" # Query frontend
      - "4317" # OTEL GRPC traces collector
      - "4318" # OTEL HTTP traces collector
    command:
      - "--set=service.telemetry.logs.level=debug"
