# this file depends in the annotations and 00-kind-multi-node.yml to deploy a otherinstance
# and a client in different nodes.
# OBI will instrument both, but restricting the metadata only to the local node,
# so network flows between client and otherinstance would be incomplete
apiVersion: v1
kind: Pod
metadata:
  name: httppinger
  labels:
    component: httppinger
    # this label will trigger a deletion of OBI pods before tearing down
    # kind, to force OBI writing the coverage data
    teardown: delete
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: deployment/zone
                operator: In
                values:
                  - other-progs
  volumes:
    - name: configs
      persistentVolumeClaim:
        claimName: configs
    - name: testoutput
      persistentVolumeClaim:
        claimName: testoutput

  containers:
    - name: httppinger
      image: ghcr.io/open-telemetry/obi-testimg:go-http-client-0.1.2@sha256:e2f600e5cb7fadfb7d7be7b17fe29eee89ebe8f63e15a05ccbf943edf5044a25
      imagePullPolicy: IfNotPresent
      env:
        - name: TARGET_URL
          value: "http://otherinstance:8080"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment.name=test,service.version=3.2.1"
---
apiVersion: v1
kind: Service
metadata:
  name: otherinstance
spec:
  selector:
    app: otherinstance
  ports:
    - port: 8080
      name: http0
      targetPort: http0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otherinstance
  labels:
    app: otherinstance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otherinstance
  template:
    metadata:
      name: otherinstance
      labels:
        app: otherinstance
        # this label will trigger a deletion of OBI pods before tearing down
        # kind, to force OBI writing the coverage data
        teardown: delete
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: deployment/zone
                    operator: In
                    values:
                      - otel
      volumes:
        - name: configs
          persistentVolumeClaim:
            claimName: configs
        - name: testoutput
          persistentVolumeClaim:
            claimName: testoutput
      containers:
        - name: otherinstance
          image: ghcr.io/open-telemetry/obi-testimg:go-0.1.2@sha256:b3e65ac053586943bcfbba0af32a0ec1cfb3fa64add67f92a742d8431835be39
          imagePullPolicy: IfNotPresent
          ports:
            # exposing hostports to enable operation from tests
            - containerPort: 8080
              hostPort: 8080
              name: http0
            - containerPort: 8081
              hostPort: 8081
              name: http1
            - containerPort: 8082
              hostPort: 8082
              name: http2
            - containerPort: 8083
              hostPort: 8083
              name: http3
            - containerPort: 5051
              hostPort: 5051
              name: grpc
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=test,service.version=3.2.1"