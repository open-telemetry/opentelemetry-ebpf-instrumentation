# A DaemonSet with hostPID=true that serves HTTP traffic.
# Used to test that spans from this DaemonSet are correctly attributed to it
# (and not to other pods sharing the host PID namespace).
apiVersion: v1
kind: Service
metadata:
  name: hostpid-httpserver
spec:
  selector:
    app: hostpid-httpserver
  ports:
    - port: 8082
      name: http
      targetPort: http
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hostpid-httpserver
  labels:
    app: hostpid-httpserver
spec:
  selector:
    matchLabels:
      app: hostpid-httpserver
  template:
    metadata:
      name: hostpid-httpserver
      labels:
        app: hostpid-httpserver
    spec:
      hostPID: true
      containers:
        - name: hostpid-httpserver
          image: ghcr.io/open-telemetry/obi-testimg:go-0.1.2@sha256:b3e65ac053586943bcfbba0af32a0ec1cfb3fa64add67f92a742d8431835be39
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              hostPort: 8082
              name: http
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
