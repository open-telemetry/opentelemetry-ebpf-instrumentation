apiVersion: v1
kind: ConfigMap
metadata:
  name: obi-config
data:
  obi-config.yml: |
    log_level: debug
    metrics:
      features: ["stats"]
    otel_metrics_export:
      endpoint: http://otelcol.default:4317
    attributes:
      kubernetes:
        enable: true
        cluster_name: my-kube
        resource_labels:
          deployment.environment.name: ["${DEPLOYMENT_ENVIRONMENT:-deployment.environment.name}"]
      select:
        obi.stat.tcp.rtt:
          # assured cardinality explosion. Don't try in production!
          include: ["*"]
        obi.stat.tcp.io:
          include: ["*"]
        obi.stat.tcp.retransmits:
          include: ["*"]
        obi.stat.tcp.failed.connections:
          include: ["*"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: obi
spec:
  selector:
    matchLabels:
      instrumentation: obi
  template:
    metadata:
      labels:
        instrumentation: obi
        # this label will trigger a deletion of OBI pods before tearing down
        # kind, to force OBI writing the coverage data
        teardown: delete
    spec:
      hostPID: true  #important for appo11y!
      hostNetwork: true #important for neto11y!
      dnsPolicy: ClusterFirstWithHostNet # important to get connection to otelcollector from hostnetwork !!
      serviceAccountName: obi
      volumes:
        - name: obi-config
          configMap:
            name: obi-config
        - name: testoutput
          persistentVolumeClaim:
            claimName: testoutput
        # the stats tracer attaches sock/inet_sock_set_state, which needs tracefs
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
      containers:
        - name: obi
          image: obi:dev
          imagePullPolicy: Never # loaded into Kind from localhost
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - mountPath: /config
              name: obi-config
            - mountPath: /testoutput
              name: testoutput
            - mountPath: /sys/kernel/tracing
              name: tracefs
            - mountPath: /sys/kernel/debug
              name: debugfs
          env:
            - name: GOCOVERDIR
              value: "/testoutput"
            - name: OTEL_EBPF_CONFIG_PATH
              value: /config/obi-config.yml
            - name: OTEL_EBPF_METRICS_INTERVAL
              value: "1s"
            - name: OTEL_EBPF_BPF_BATCH_TIMEOUT
              value: "10ms"
