apiVersion: v1
kind: Service
metadata:
  name: statefulservice
spec:
  selector:
    app: statefulservice
  ports:
    - port: 8080
      name: http
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statefulservice
  labels:
    app: statefulservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statefulservice
  template:
    metadata:
      name: statefulservice
      labels:
        app: statefulservice
      annotations:
        resource.opentelemetry.io/deployment.environment.name: 'test'
        resource.opentelemetry.io/service.version: '3.2.1'
    spec:
      containers:
        - name: statefulservice
          image: ghcr.io/open-telemetry/obi-testimg:go-0.1.2@sha256:b3e65ac053586943bcfbba0af32a0ec1cfb3fa64add67f92a742d8431835be39
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              hostPort: 8080
              name: http
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
  serviceName: statefulservice
