# this file is actually a Go template that needs to be processed before deploying
# Mandatory variables are PodName and TargetURL
apiVersion: v1
kind: Pod
metadata:
  name: "{{.PodName}}"
  labels:
    component: pinger
  annotations:
    resource.opentelemetry.io/deployment.environment.name: 'development'
spec:
  shareProcessNamespace: true
  serviceAccountName: obi
  volumes:
    - name: configs
      persistentVolumeClaim:
        claimName: configs

  containers:
    - name: pinger
      image: ghcr.io/open-telemetry/obi-testimg:go-http-client-0.1.2@sha256:e2f600e5cb7fadfb7d7be7b17fe29eee89ebe8f63e15a05ccbf943edf5044a25
      env:
        - name: TARGET_URL
          value: "{{.TargetURL}}"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment.name=test,service.version=3.2.1"
