apiVersion: v1
kind: Service
metadata:
  name: cronjobservice
spec:
  selector:
    app: cronjobservice
  ports:
    - port: 8083
      name: http
      targetPort: http
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjobservice
  labels:
    app: cronjobservice
spec:
  concurrencyPolicy: Forbid 
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          name: cronjobservice
          labels:
            app: cronjobservice
          annotations:
            resource.opentelemetry.io/deployment.environment.name: 'test'
            resource.opentelemetry.io/service.version: '3.2.1'
        spec:
          restartPolicy: Never
          containers:
            - name: cronjobservice
              image: ghcr.io/open-telemetry/obi-testimg:go-0.1.2@sha256:b3e65ac053586943bcfbba0af32a0ec1cfb3fa64add67f92a742d8431835be39
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 8083
                  hostPort: 8083
                  name: http
              env:
                - name: LOG_LEVEL
                  value: "DEBUG"
