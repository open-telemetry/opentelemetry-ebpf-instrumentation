apiVersion: v1
kind: Service
metadata:
  name: jobservice
spec:
  selector:
    app: jobservice
  ports:
    - port: 8082
      name: http
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jobservice
  labels:
    app: jobservice
spec:
  template:
    metadata:
      name: jobservice
      labels:
        app: jobservice
      annotations:
        resource.opentelemetry.io/deployment.environment.name: 'test'
        resource.opentelemetry.io/service.version: '3.2.1'
    spec:
      restartPolicy: Never
      containers:
        - name: jobservice
          image: ghcr.io/open-telemetry/obi-testimg:go-0.1.2@sha256:b3e65ac053586943bcfbba0af32a0ec1cfb3fa64add67f92a742d8431835be39
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              hostPort: 8082
              name: http
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
