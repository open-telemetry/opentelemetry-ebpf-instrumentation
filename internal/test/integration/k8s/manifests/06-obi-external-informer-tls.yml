apiVersion: v1
kind: ConfigMap
metadata:
  name: obi-config
data:
  obi-config.yml: |
    file_format: "1.0"
    log_level: debug
    meter_provider:
      readers:
        - pull:
            exporter:
              prometheus/development:
                port: 8999
    extensions:
      obi:
        version: "2.0"
        capture:
          policy:
            default_action: exclude
          rules:
            - action: include
              match:
                kubernetes:
                  metadata_glob:
                    k8s_pod_name: ["*pinger*"]
            - action: include
              match:
                kubernetes:
                  metadata_glob:
                    k8s_deployment_name: [otherinstance, testserver]
          metrics:
            features: [application, network, application_span, application_service_graph]
          attributes:
            select:
              "*":
                include: ["*"]
              obi.network.flow:
                include: ["*"]
                exclude: [src_port]
          network:
            capture:
              enabled: true
              selection:
                protocols:
                  include: [TCP]
                cidrs:
                  - cidr: 10.244.0.0/16
                  - cidr: fd00:10:244::/56
                  - cidr: 10.96.0.0/16
                  - cidr: fd00:10:96::/112
        enrich:
          service_name:
            sources: [k8s, ecs]
          enrichers:
            kubernetes:
              mode: enabled
              cluster_name: my-kube
              resource_labels:
                deployment.environment.name: [deployment.environment.name]
                service.name: [app.kubernetes.io/instance, app.kubernetes.io/name]
                service.namespace: [app.kubernetes.io/part-of]
              metadata_cache:
                address: k8s-cache:50055
                tls:
                  ca_file: /etc/obi/tls/ca.crt
                  cert_file: /etc/obi/tls/client.crt
                  key_file: /etc/obi/tls/client.key
        daemon:
          logging:
            debug_trace_output: text
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: obi
spec:
  selector:
    matchLabels:
      instrumentation: obi
  template:
    metadata:
      labels:
        instrumentation: obi
        # this label will trigger a deletion of OBI pods before tearing down
        # kind, to force OBI writing the coverage data
        teardown: delete
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # we still need this for reading the HOST ID from the Kube Node
      serviceAccountName: obi
      volumes:
        - name: obi-config
          configMap:
            name: obi-config
        - name: testoutput
          persistentVolumeClaim:
            claimName: testoutput
        - name: obi-tls
          secret:
            secretName: k8s-cache-tls
      containers:
        - name: obi
          image: obi:dev
          imagePullPolicy: Never # loaded into Kind from localhost
          args: [ "--config=/config/obi-config.yml" ]
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - mountPath: /config
              name: obi-config
            - mountPath: /testoutput
              name: testoutput
            - mountPath: /etc/obi/tls
              name: obi-tls
              readOnly: true
          env:
            - name: GOCOVERDIR
              value: "/testoutput"
            - name: OTEL_EBPF_DISCOVERY_POLL_INTERVAL
              value: "500ms"
            - name: OTEL_EBPF_METRICS_INTERVAL
              value: "1s"
            - name: OTEL_EBPF_BPF_BATCH_TIMEOUT
              value: "10ms"
          ports:
            - containerPort: 8999
              name: prometheus
              protocol: TCP
---
kind: Service
apiVersion: v1
metadata:
  name: obi-promscrape
spec:
  selector:
    instrumentation: obi
  ports:
    - port: 8999
      name: prometheus
      protocol: TCP
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: k8s-cache
  namespace: default
  labels:
    app: k8s-cache
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-cache
  template:
    metadata:
      name: k8s-cache
      labels:
        app: k8s-cache
        # this label will trigger a deletion of OBI pods before tearing down
        # kind, to force OBI writing the coverage data
        teardown: delete
    spec:
      # required to let the service accessing the K8s API
      serviceAccountName: obi
      volumes:
        - name: testoutput
          persistentVolumeClaim:
            claimName: testoutput
        - name: cache-tls
          secret:
            secretName: k8s-cache-tls
      containers:
        - name: k8s-cache
          image: obi-k8s-cache:dev
          imagePullPolicy: Never # loaded into Kind from localhost
          env:
            - name: OTEL_EBPF_K8S_CACHE_PORT
              value: "50055"
            - name: OTEL_EBPF_K8S_CACHE_INTERNAL_METRICS_PROMETHEUS_PORT
              value: "8999"
            - name: GOCOVERDIR
              value: "/testoutput"
            - name: OTEL_EBPF_K8S_CACHE_TLS_CERT_FILE
              value: "/etc/k8s-cache/tls/server.crt"
            - name: OTEL_EBPF_K8S_CACHE_TLS_KEY_FILE
              value: "/etc/k8s-cache/tls/server.key"
            - name: OTEL_EBPF_K8S_CACHE_TLS_CLIENT_CA_FILE
              value: "/etc/k8s-cache/tls/ca.crt"
          volumeMounts:
            - mountPath: /testoutput
              name: testoutput
            - mountPath: /etc/k8s-cache/tls
              name: cache-tls
              readOnly: true
          ports:
            - containerPort: 50055
              name: grpc
            - containerPort: 8999
              name: internalprom
---
kind: Service
apiVersion: v1
metadata:
  name: k8s-cache
  namespace: default
spec:
  selector:
    app: k8s-cache
  ports:
    - port: 50055
      name: grpc
      protocol: TCP
    - name: internalprom
      port: 8999
      protocol: TCP
