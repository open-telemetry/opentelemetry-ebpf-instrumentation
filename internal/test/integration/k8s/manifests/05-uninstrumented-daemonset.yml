apiVersion: v1
kind: Service
metadata:
  name: dsservice
spec:
  selector:
    app: dsservice
  ports:
    - port: 8081
      name: http1
      targetPort: http1
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dsservice
  labels:
    app: dsservice
spec:
  selector:
    matchLabels:
      app: dsservice
  template:
    metadata:
      name: dsservice
      labels:
        app: dsservice
      annotations:
        resource.opentelemetry.io/deployment.environment.name: 'test'
        resource.opentelemetry.io/service.version: '3.2.1'
    spec:
      containers:
        - name: dsservice
          image: ghcr.io/open-telemetry/obi-testimg:go-0.1.2@sha256:b3e65ac053586943bcfbba0af32a0ec1cfb3fa64add67f92a742d8431835be39
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              hostPort: 8081
              name: http1
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
