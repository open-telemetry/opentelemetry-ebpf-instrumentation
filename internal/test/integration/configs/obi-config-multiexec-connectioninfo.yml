file_format: "1.0"
tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_grpc:
            endpoint: http://jaeger:4317
            tls:
              insecure: true
meter_provider:
  readers:
    - periodic:
        interval: 1000
        exporter:
          otlp_grpc:
            endpoint: http://otelcol:4017
            default_histogram_aggregation: explicit_bucket_histogram
            tls:
              insecure: true
extensions:
  obi:
    version: "2.0"
    capture:
      policy:
        default_action: exclude
        poll_interval: 500ms
      rules:
        - action: include
          match:
            process:
              open_ports: "8080,8088"
        - action: include
          match:
            process:
              open_ports: "7773"
      metrics:
        features: [application_service_graph_connection_info]
      instrumentation:
        http:
          enabled:
            traces: true
            metrics: true
    enrich:
      enrichers:
        kubernetes:
          mode: disabled
    daemon:
      logging:
        format: json
