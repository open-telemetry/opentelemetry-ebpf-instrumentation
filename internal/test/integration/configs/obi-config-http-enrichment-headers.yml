routes:
  patterns:
    - /basic/:rnd
    - /rolldice/:id
  unmatched: path
  ignored_patterns:
    - /metrics
  ignore_mode: traces
otel_metrics_export:
  endpoint: http://otelcol:4318
otel_traces_export:
  endpoint: http://jaeger:4318
attributes:
  select:
    "*":
      include: ["*"]
ebpf:
  payload_extraction:
    http:
      generic:
        enabled: true
        policy:
          default_action: exclude
          match_order: first_match_wins
          obfuscation_string: "***"
        rules:
          - action: obfuscate
            type: headers
            scope: both
            match:
              regex:
                - "^Authorization$"
              case_sensitive: false
          - action: include
            type: headers
            scope: both
            match:
              regex:
                - "^Content-Type$"
                - "^X-Custom-.*$"
                - "^X-Dice-Roll$"
              case_sensitive: false
