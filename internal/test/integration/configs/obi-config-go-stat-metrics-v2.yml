file_format: "1.0"
log_level: debug
meter_provider:
  readers:
    - periodic:
        interval: 1000
        exporter:
          otlp_grpc:
            endpoint: http://otelcol:4317
            tls:
              insecure: true
extensions:
  obi:
    version: "2.0"
    capture:
      network:
        stats:
          enabled: true
          # tcp_resets is only selectable from Config v2
          features: [tcp_failed_connections, tcp_resets]
          selection:
            cidrs:
              - {cidr: 10.0.0.0/8, name: private}
              - {cidr: 172.16.0.0/12, name: private}
              - {cidr: 192.168.0.0/16, name: private}
              - {cidr: 0.0.0.0/0, name: public}
      engine:
        batching:
          batch_timeout: 10ms
    enrich:
      enrichers:
        kubernetes:
          mode: disabled
      attributes:
        select:
          "*":
            include: ["*"]
