routes:
  unmatched: path
prometheus_export:
  port: 8999
  features:
    - application
    - application_sizes
otel_metrics_export:
  endpoint: http://otelcol:4318
otel_traces_export:
  endpoint: http://otelcol:4318
discovery:
  instrument:
    - namespace: grpc-http2-go
      name: server
      exe_path: "*/testserver"
attributes:
  select:
    "*":
      include: ["*"]