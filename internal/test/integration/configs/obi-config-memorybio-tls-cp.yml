routes:
  patterns:
    - /greeting
  unmatched: path
otel_metrics_export:
  endpoint: http://otelcol:4318
otel_traces_export:
  endpoint: http://jaeger:4318
attributes:
  select:
    "*":
      include: ["*"]
# The sock_msg program moves the send data into bvec pages, where tcp_sendmsg
# reads nothing and the ciphertext is only readable through the sock_msg
# buffer. Correlation has to hold on that path as well.
ebpf:
  context_propagation: all
