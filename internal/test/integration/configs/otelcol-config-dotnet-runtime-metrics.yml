receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  # one point per series per second for weaver: it needs the shapes, and 10ms exports keep its queue full
  interval:
    interval: 1s
exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
  otlp/weaver:
    endpoint: weaver:4317
    tls:
      insecure: true
    compression: none
service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
    metrics/weaver:
      receivers: [otlp]
      processors: [interval]
      exporters: [otlp/weaver]
