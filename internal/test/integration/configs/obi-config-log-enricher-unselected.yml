# Variant of obi-config-log-enricher.yml whose log enricher selection matches none of
# the instrumented processes: no test server listens on port 1.
routes:
  patterns:
    - /basic/:rnd
  unmatched: path
  ignored_patterns:
    - /metrics
attributes:
  kubernetes:
    cluster_name: obi-k8s-test-cluster
    resource_labels:
      deployment.environment: ["deployment.environment"]
  select:
    "*":
      include: ["*"]
ebpf:
  log_enricher:
    services:
      - service:
        - open_ports: "1"
discovery:
  min_process_age: "0s"
log_config: "yaml"
