trace_printer: text
log_level: debug
routes:
  unmatched: path
ebpf:
  context_propagation: headers
  bpf_debug: true
  socket_tracer: true
discovery:
  skip_go_specific_tracers: true
  services:
    - name: keepaliveclient
      exe_path: keepaliveclient
    - name: socktracer-server
      exe_path: socktracer-server
