receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 100
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"
connectors:
  # See otelcol-config-weaver.yml — forward clones data into the side tap
  # so mutating processors can't corrupt the production pipeline.
  forward/weaver:
processors:
  transform/weaver:
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.exemplars, []) where Len(datapoint.exemplars) > 0
  interval/weaver:
    interval: 1s
exporters:
  prometheus:
    endpoint: "otelcol:9464"
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true
  # See note in otelcol-config-weaver.yml — weaver tap is bounded and
  # non-blocking so it never back-pressures the production prometheus
  # exporter.
  otlp/weaver:
    endpoint: weaver:4317
    tls:
      insecure: true
    compression: none
    sending_queue:
      enabled: true
      queue_size: 500
      block_on_overflow: false
    retry_on_failure:
      enabled: false
service:
  pipelines:
    # Production metrics path — what the integration tests poll. Also
    # feeds the forward connector that hands data to the weaver tap.
    metrics:
      receivers: [otlp]
      exporters: [prometheus, forward/weaver]
    # Weaver tap with its own independent queue, fed via forward so the
    # processors below cannot corrupt the production prometheus stream.
    metrics/weaver:
      receivers: [forward/weaver]
      processors: [transform/weaver, interval/weaver]
      exporters: [otlp/weaver]
    # Traces go only to weaver in this config (no jaeger), so the traces
    # pipeline is weaver-only and naturally has nothing to back-pressure.
    traces:
      receivers: [otlp]
      exporters: [otlp/weaver]
