routes:
  patterns:
    - /basic/:rnd
  unmatched: path
metrics:
  features: ["application_span"]
otel_metrics_export:
  endpoint: http://otelcol:4018
otel_traces_export:
  endpoint: http://jaeger:4318
discovery:
  # services section is left in this file for legacy configuration compatibility
  # users should define the "instrument:" section instead

  services:
    - name: ntestserver
      open_ports: 3030
      metrics: { features: ["application", "application_span"] }
    - name: utestserver
      open_ports: 3040
      metrics: { features: ["application", "application_span"] }
    - name: testserver
      open_ports: 8080
    - name: jtestserver
      open_ports: 8085
    - name: rtestserver
      open_ports: 8090
