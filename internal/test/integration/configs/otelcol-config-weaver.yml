receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 100
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"
connectors:
  # `forward` clones data when handing it from the production `metrics`
  # pipeline to the side-tap `metrics/weaver` pipeline, so the mutating
  # processors below cannot affect the prometheus exporter. Without this
  # the otlp receiver fan-out shares in-memory metric objects across
  # pipelines and stateful processors (interval) corrupt data the
  # production pipeline still depends on.
  forward/weaver:
processors:
  # Drop exemplars before they reach weaver — the OBI registry has no
  # exemplar policies, so they're pure overhead (~10% of entities on a
  # heavy multiprocess test).
  transform/weaver:
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.exemplars, []) where Len(datapoint.exemplars) > 0
  # Aggregate metric data points to one-per-series-per-second. OBI exports
  # every 10 ms; without this, weaver re-evaluates Rego on essentially the
  # same series 100×/sec. The shape weaver validates is unchanged but the
  # entity count drops two orders of magnitude.
  interval/weaver:
    interval: 1s
exporters:
  prometheus:
    endpoint: "otelcol:9464"
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
    tls:
      insecure: true
  # Bounded weaver-side queue with no retries / no block-on-overflow so a
  # slow weaver never back-pressures the production pipelines (prometheus /
  # jaeger). Sample loss on the weaver side is acceptable — semconv
  # validation only needs to *see* each unique advisory once, not aggregate
  # every data point.
  otlp/weaver:
    endpoint: weaver:4317
    tls:
      insecure: true
    compression: none
    sending_queue:
      enabled: true
      queue_size: 500
      block_on_overflow: false
    retry_on_failure:
      enabled: false
service:
  pipelines:
    # Production paths — what the integration tests poll. The metrics
    # pipeline also feeds the `forward/weaver` connector that fans into
    # the side tap.
    metrics:
      receivers: [otlp]
      exporters: [prometheus, forward/weaver]
    traces:
      receivers: [otlp]
      exporters: [otlphttp/jaeger]
    # Weaver tap for metrics. Receives a cloned copy of the production
    # data via the forward connector, deduplicates / strips exemplars,
    # then sends the trimmed stream to weaver. Mutations here are
    # isolated from the production pipeline.
    metrics/weaver:
      receivers: [forward/weaver]
      processors: [transform/weaver, interval/weaver]
      exporters: [otlp/weaver]
    # Traces tap is a plain fan-out from `otlp` — no processor mutates
    # the data, so the receiver-level fan-out is safe.
    traces/weaver:
      receivers: [otlp]
      exporters: [otlp/weaver]
