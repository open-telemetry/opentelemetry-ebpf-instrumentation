# OBI configuration for the avoided-services weaver suite. Mirrors
# obi-config-go-otel.yml (the config the existing avoided-services test uses)
# plus internal_metrics.exporter=otel so obi.avoided.services reaches weaver.
# OBI discovers the self-instrumented go_otel rolldice server, observes its OTLP
# export calls, and avoids instrumenting it (ExcludeOTelInstrumentedServices is
# on by default), recording obi.avoided.services.
routes:
  unmatched: path
otel_metrics_export:
  endpoint: http://otelcol:4318
otel_traces_export:
  endpoint: http://otelcol:4318
internal_metrics:
  exporter: otel
  # limit 2 so the rolldice server's 2nd avoided identity (traces) overflows,
  # emitting otel.metric.overflow=true on obi.avoided.services.
  avoided_services:
    limit: 2
attributes:
  select:
    "*":
      include: ["*"]
