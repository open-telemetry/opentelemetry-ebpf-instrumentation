# OBI configuration for the GPU/CUDA weaver suite. CUDA instrumentation is
# forced on (compose sets OTEL_EBPF_INSTRUMENT_CUDA=on) so the gpuevent tracer
# loads without needing nvidia-smi / a real GPU. The targets have no listening
# ports, so they are discovered by executable path rather than open_ports: one
# binary per CUDA API surface, since the globs match the exe suffix.
otel_metrics_export:
  endpoint: http://otelcol:4318
discovery:
  instrument:
    - exe_path: "*gpu-cuda-tester"
      namespace: integration-test
    - exe_path: "*gpu-cuda-driver-tester"
      namespace: integration-test
attributes:
  select:
    "*":
      include: ["*"]
