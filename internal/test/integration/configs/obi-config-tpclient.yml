routes:
  unmatched: path
attributes:
  select:
    "*":
      include: ["*"]
otel_metrics_export:
  endpoint: http://otelcol:4018
otel_traces_export:
  endpoint: http://jaeger:4318
discovery:
  services:
    - name: tpclient-a
      open_ports: 6000
    - name: tpclient-b
      open_ports: 6001
    - name: tpclient-c
      open_ports: 6002
    - name: tpclient-go-a
      open_ports: 8000
    - name: tpclient-go-b
      open_ports: 8001
    - name: tpclient-go-c
      open_ports: 8002
