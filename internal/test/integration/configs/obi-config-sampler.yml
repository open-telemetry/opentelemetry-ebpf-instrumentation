routes:
  patterns:
    - /basic/:rnd
  unmatched: path
otel_metrics_export:
  endpoint: http://otelcol:4018
otel_traces_export:
  endpoint: http://otelcol:4018
ebpf:
  context_propagation: headers
  # the services must join each trace through the propagated traceparent alone
  disable_black_box_cp: true
discovery:
  disabled_route_harvesters: ["nodejs"]
  services:
    - name: another-service
      exe_path: asdflkjasdf
    - namespace: multi-k
      name: service-a
      open_ports: 5000
    - namespace: multi-k
      name: service-c
      open_ports: 5002
      sampler:
        name: traceidratio
        arg: "0.5"
    - namespace: multi-k
      name: service-d
      open_ports: 5003
attributes:
  kubernetes:
    cluster_name: my-kube
  select:
    http_server_request_duration_seconds_count:
      exclude: ["server_address"]
    "*":
      include: ["*"]
