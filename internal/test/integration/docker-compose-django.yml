services:
  testserver:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/djangoserver/Dockerfile
    image: hatest-djangoserver
    ports:
      - "8381:8380"

  obi:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/obi/Dockerfile
    image: hatest-obi
    privileged: true
    pid: "service:testserver"
    volumes:
      - ./configs:/configs
      - ./system/sys/kernel/security:/sys/kernel/security
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-django:/var/run/obi
    environment:
      OTEL_EBPF_CONFIG_PATH: /configs/obi-config.yml
      GOCOVERDIR: /coverage
      OTEL_EBPF_OPEN_PORT: "8380"
      OTEL_EBPF_EXECUTABLE_PATH: ""
      OTEL_EBPF_SERVICE_NAME: django-testserver
      OTEL_EBPF_SERVICE_NAMESPACE: integration-test
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_METRICS_INTERVAL: 1s
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: 1ms
      OTEL_EBPF_BPF_BATCH_TIMEOUT: 10ms
      OTEL_EBPF_LOG_LEVEL: DEBUG
    depends_on:
      testserver:
        condition: service_started
      otelcol:
        condition: service_started

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol-config/otelcol-config-weaver.yml"]
    volumes:
      - ./configs:/etc/otelcol-config
    depends_on:
      jaeger:
        condition: service_started
      weaver:
        condition: service_healthy

  prometheus:
    image: quay.io/prometheus/prometheus:v3.16.0@sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd
    command: ["--config.file=/etc/prometheus/prometheus-config.yml"]
    volumes:
      - ./configs:/etc/prometheus
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "16686:16686"

  weaver:
    extends:
      file: components/weaver/service.yml
      service: weaver
    volumes:
      - ../../../schemas/obi:/obi-registry:ro
