services:
  # Python (FastAPI on 8080); GET /query triggers a gRPC RouteGuide/GetFeature
  # call to grpcsrv:50051. As a non-Go gRPC client, its outgoing HPACK is what
  # socktracer must inject — there is no gotracer here.
  pygrpcclient:
    build:
      context: ./components/pythongrpc
      dockerfile: Dockerfile
    image: hatest-pygrpc-client
    ports:
      - "8080:8080"
    depends_on:
      grpcsrv:
        condition: service_started

  # Python RouteGuide gRPC server on 50051 (name fixed: the client dials grpcsrv).
  grpcsrv:
    build:
      context: ./components/pythongrpc
      dockerfile: Dockerfile_srv
    image: hatest-pygrpc-srv
    ports:
      - "50051:50051"

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    command:
      - --config=/configs/obi-config-pygrpc-socktracer.yml
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security${SECURITY_CONFIG_SUFFIX}:/sys/kernel/security
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/fs/cgroup:/sys/fs/cgroup
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-pygrpc-socktracer:/var/run/obi
    image: hatest-obi
    privileged: true
    pid: "host"
    cgroup: "host"
    environment:
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_TRACE_PRINTER: "text"
      OTEL_EBPF_METRICS_INTERVAL: "${OTEL_EBPF_METRICS_INTERVAL:-1s}"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "${OTEL_EBPF_BPF_BATCH_TIMEOUT:-250ms}"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "${OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT:-200ms}"
      OTEL_EBPF_HOSTNAME: "beyla"
      OTEL_EBPF_BPF_CONTEXT_PROPAGATION: "${OTEL_EBPF_BPF_CONTEXT_PROPAGATION:-all}"
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: "${OTEL_EBPF_DISCOVERY_POLL_INTERVAL:-1s}"
      # socktracer on; black-box (connect-info) correlation OFF so a shared trace
      # across the python client→server hop can only come from injected HPACK.
      OTEL_EBPF_BPF_SOCKET_TRACER: "true"
      OTEL_EBPF_BPF_DISABLE_BLACK_BOX_CP: "true"
      OTEL_EBPF_BPF_DEBUG: "true"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
    depends_on:
      pygrpcclient:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.60@sha256:4fd2d70fa347d6a47e79fcb06b1c177e6079f92cba88b083153d56263082135e
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug
