version: "3.8"

services:
  nginx:
    image: nginx:1.31.3@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    mem_limit: 128m
    container_name: hatest-nginx
    ports:
      - "8080:80"
    volumes:
      - ./components/php/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - php-fpm

  php-fpm:
    image: php:8.5.8-fpm@sha256:0dc450d0a0e81ba501973b8e303f5d45af2ed989e08730f597d8fc07fb289efd
    mem_limit: 512m
    container_name: hatest-php-fpm
    volumes:
      - ./components/php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./components/php/php.ini:/usr/local/etc/php/php.ini
      - ./components/php/index.php:/var/www/html/index.php
    environment:
      PM_STRATEGY: static
      PM_MAX_CHILDREN: 100
      PM_MAX_REQUESTS: 500
      PM_REQUEST_TERMINATE_TIMEOUT: 5s
      PHP_MEM_USED_IN_MB: 1
      PHP_EXECUTION_TIME_IN_SECONDS: 1
      PM_CHILDREN_MEMORY_LIMIT: 50M
      PM_START_SERVERS: 10
      PM_MIN_SPARE_SERVERS: 5
      PM_MAX_SPARE_SERVERS: 20
      PM_PROCESS_IDLE_TIMEOUT: 10s

  php-harvest-nginx:
    image: nginx:1.31.3@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    mem_limit: 128m
    container_name: hatest-php-harvest-nginx
    ports:
      - "8082:80"
      - "8083:81"
      - "8084:82"
    volumes:
      - ./components/php/harvest/nginx.conf:/etc/nginx/nginx.conf
      - ./components/php/harvest/laravel/public:/var/www/laravel/public:ro
      - ./components/php/harvest/symfony/public:/var/www/symfony-harvest/public:ro
      - ./components/php/harvest/slim/public:/var/www/slim/public:ro
    depends_on:
      - php-harvest-laravel
      - php-harvest-symfony
      - php-harvest-slim

  php-harvest-laravel:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/php/harvest/laravel/Dockerfile
    image: hatest-php-harvest-laravel
    mem_limit: 256m
    container_name: hatest-php-harvest-laravel
    environment:
      APP_DEBUG: "true"
      LOG_CHANNEL: stderr

  php-harvest-symfony:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/php/harvest/symfony/Dockerfile
    image: hatest-php-harvest-symfony
    mem_limit: 256m
    container_name: hatest-php-harvest-symfony

  php-harvest-slim:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/php/harvest/slim/Dockerfile
    image: hatest-php-harvest-slim
    mem_limit: 256m
    container_name: hatest-php-harvest-slim

  symfony-nginx:
    image: nginx:1.31.3@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    mem_limit: 128m
    container_name: hatest-symfony-nginx
    ports:
      - "8081:80"
    volumes:
      - ./components/php/symfony/nginx.conf:/etc/nginx/nginx.conf
      - ./components/php/symfony/public:/var/www/symfony/public:ro
    depends_on:
      - symfony-php-fpm

  symfony-php-fpm:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/php/symfony/Dockerfile
    image: hatest-php-symfony
    mem_limit: 256m
    container_name: hatest-symfony-php-fpm

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    command:
      - --config=/configs/obi-config-php.yml
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security:/sys/kernel/security
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-php:/var/run/obi
    image: hatest-javaobi
    privileged: true # in some environments (not GH Pull Requests) you can set it to false and then cap_add: [ SYS_ADMIN ]
    network_mode: "host"
    pid: "host"
    environment:
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_TRACE_PRINTER: "text"
      OTEL_EBPF_EXECUTABLE_PATH: "(nginx|php-fpm)"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EBPF_SERVICE_NAMESPACE: "integration-test"
      OTEL_EBPF_METRICS_INTERVAL: "1s"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_PROMETHEUS_EXTRA_SPAN_RESOURCE_ATTRIBUTES: "service.version"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
      OTEL_EBPF_BPF_DEBUG: "TRUE"
      OTEL_EBPF_HOSTNAME: "obi"
    depends_on:
      nginx:
        condition: service_started
      php-harvest-nginx:
        condition: service_started
      symfony-nginx:
        condition: service_started

  # OpenTelemetry Collector
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    container_name: otel-col
    deploy:
      resources:
        limits:
          memory: 125M
    restart: unless-stopped
    command: ["--config=/etc/otelcol-config/otelcol-config-4017-weaver.yml"]
    volumes:
      - ./configs/:/etc/otelcol-config
    ports:
      - "4017" # OTLP over gRPC receiver
      - "4018:4018" # OTLP over HTTP receiver
      - "9464" # Prometheus exporter
      - "8888" # metrics endpoint
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
      weaver:
        condition: service_healthy


  weaver:
    extends:
      file: components/weaver/service.yml
      service: weaver
    volumes:
      - ../../../schemas/obi:/obi-registry:ro
  prometheus:
    image: quay.io/prometheus/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus-config-no-scrape.yml
      - --web.enable-lifecycle
      - --web.route-prefix=/
      - --log.level=debug
    volumes:
      - ./configs/:/etc/prometheus
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    ports:
      - "16686:16686" # Query frontend
      - "4317:4317" # OTEL GRPC traces collector
      - "4318:4318" # OTEL HTTP traces collector
    command:
      - "--set=service.telemetry.logs.level=debug"
