version: "3.8"

# vmagent is the driver because its statConn wraps net.Conn without holding it as the
# first field, and it scrapes several targets at once over pooled keep-alive
# connections: the workload where a client request ends up reported by both the Go
# uprobes and the generic kprobe pipeline.

x-target: &target
  image: python:3.15.0-slim@sha256:ea4f1f290e071bf7d28199cfb3e09f5dbad31b50e9c32fd58f2f2d7be915f3ae
  command: ["python", "-m", "http.server", "8000"]

services:
  target-a: *target
  target-b: *target
  target-c: *target
  target-d: *target
  target-e: *target
  target-f: *target

  vmagent:
    image: victoriametrics/vmagent:v1.156.0@sha256:d3229ab469c54ae5266e86246932266bad29b06668b5371acbd6d3de1b3035e7
    command:
      - -promscrape.config=/etc/vmagent/scrape.yml
      - -remoteWrite.url=http://target-a:8000/
      - -remoteWrite.tmpDataPath=/tmp/vmagent
      - -httpListenAddr=:8429
    volumes:
      - ./configs/vmagent-scrape.yml:/etc/vmagent/scrape.yml:ro
    depends_on:
      target-a:
        condition: service_started
      jaeger:
        condition: service_started

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    command:
      - --config=/configs/obi-config-wrapped-conn.yml
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security:/sys/kernel/security
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - ../../../testoutput:/coverage
    image: hatest-obi
    privileged: true
    pid: "host"
    environment:
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_TRACE_PRINTER: "text"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
      OTEL_EBPF_HOSTNAME: "obi"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
    depends_on:
      vmagent:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    command:
      - "--set=service.telemetry.logs.level=debug"
