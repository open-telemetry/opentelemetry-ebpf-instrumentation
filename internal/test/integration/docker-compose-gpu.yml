services:
  # Self-contained CUDA target: a stub libcudart.so + a caller that invokes the
  # CUDA Runtime API in a loop. No GPU or NVIDIA driver required.
  testserver:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/gpu-cuda-tester/Dockerfile
    image: hatest-testserver-gpu-cuda-tester
    depends_on:
      otelcol:
        condition: service_started

  # Target that explicitly binds to device 1 and queries its properties, so OBI
  # can verify that per-call metrics carry the resolved device identity.
  setdevice-testserver:
    image: hatest-testserver-gpu-cuda-tester
    command: ["/app/gpu-cuda-setdevice-tester"]
    depends_on:
      otelcol:
        condition: service_started

  # Second target from the same image: links the stub libcuda.so.1 only and
  # calls the CUDA Driver API in a loop, so OBI's cu* uprobes are exercised by a
  # process that maps no libcudart.
  driver-testserver:
    image: hatest-testserver-gpu-cuda-tester
    command: ["/app/gpu-cuda-driver-tester"]
    depends_on:
      otelcol:
        condition: service_started

  # Third target from the same image: binds a nonzero Driver API context through
  # cuCtxCreate/cuCtxPushCurrent before launching. OBI does not instrument those
  # context calls, so this target proves device identity labels are omitted even
  # when the application has a nonzero context bound.
  driver-ctx-testserver:
    image: hatest-testserver-gpu-cuda-tester
    command: ["/app/gpu-cuda-driver-ctx-tester"]
    depends_on:
      otelcol:
        condition: service_started

  ptsz-testserver:
    image: hatest-testserver-gpu-cuda-tester
    command: ["/app/gpu-cuda-ptsz-tester"]
    depends_on:
      otelcol:
        condition: service_started

  ptsz-driver-testserver:
    image: hatest-testserver-gpu-cuda-tester
    command: ["/app/gpu-cuda-ptsz-driver-tester"]
    depends_on:
      otelcol:
        condition: service_started

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security:/sys/kernel/security
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-gpu:/var/run/obi
      - /sys/kernel/tracing:/sys/kernel/tracing:rw
    image: hatest-obi
    privileged: true
    pid: "host"
    environment:
      OTEL_EBPF_CONFIG_PATH: /configs/obi-config-gpu.yml
      GOCOVERDIR: "/coverage"
      # Force CUDA instrumentation on so the gpuevent tracer loads without a GPU
      # (nvidia-smi auto-detect is bypassed).
      OTEL_EBPF_INSTRUMENT_CUDA: "on"
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_SERVICE_NAMESPACE: "integration-test"
      OTEL_EBPF_METRICS_INTERVAL: "1s"
      OTEL_EBPF_BPF_METRIC_SCRAPE_INTERVAL: "1s"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
      OTEL_EBPF_BPF_DEBUG: "TRUE"
      OTEL_EBPF_HOSTNAME: "obi"
      OTEL_EBPF_PROCESSES_INTERVAL: "100ms"
      OTEL_EBPF_METRICS_FEATURES: "application"
    depends_on:
      testserver:
        condition: service_started
      setdevice-testserver:
        condition: service_started
      driver-testserver:
        condition: service_started
      driver-ctx-testserver:
        condition: service_started
      ptsz-testserver:
        condition: service_started
      ptsz-driver-testserver:
        condition: service_started

  prometheus:
    image: quay.io/prometheus/prometheus:v3.16.0@sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus-config-gpu.yml
      - --web.enable-lifecycle
      - --web.route-prefix=/
    volumes:
      - ./configs/:/etc/prometheus
    ports:
      - "9090:9090"

  # OpenTelemetry Collector: single OTLP receiver fans out to the Prometheus
  # exporter (scraped by the test) and to weaver (semconv live-check).
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    container_name: otel-col
    deploy:
      resources:
        limits:
          memory: 125M
    restart: unless-stopped
    command: ["--config=/etc/otelcol-config/otelcol-config-weaver-no-jaeger.yml"]
    volumes:
      - ./configs/:/etc/otelcol-config
    ports:
      - "4317" # OTLP over gRPC receiver
      - "4318:4318" # OTLP over HTTP receiver
      - "9464" # Prometheus exporter
      - "8888" # metrics endpoint
    depends_on:
      prometheus:
        condition: service_started
      weaver:
        condition: service_healthy

  weaver:
    extends:
      file: components/weaver/service.yml
      service: weaver
    volumes:
      - ../../../schemas/obi:/obi-registry:ro
