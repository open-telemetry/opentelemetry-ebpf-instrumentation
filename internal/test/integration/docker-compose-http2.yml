version: "3.8"

services:
  testclient:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/gohttp2/client/Dockerfile
    image: hatest-testclient
    environment:
      TARGET_URL: "https://testserver:7373"
      TEST_HTTP2_PROTOCOLS: ${TEST_HTTP2_PROTOCOLS}
    ports:
      - "7575:7575"
    depends_on:
      testserver:
        condition: service_started

  testclient-xnet-legacy:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/gohttp2/client_xnet_legacy/Dockerfile
    image: hatest-testclient-xnet-legacy
    environment:
      TARGET_URL: "https://testserver:7373"
    ports:
      - "7576:7575"
    depends_on:
      testserver:
        condition: service_started

  testclient-stdlib-legacy:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/gohttp2/client_stdlib_legacy/Dockerfile
    image: hatest-testclient-stdlib-legacy
    environment:
      TARGET_URL: "https://testserver:7373"
    ports:
      - "7577:7575"
    depends_on:
      testserver:
        condition: service_started

  testserver:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/gohttp2/server/Dockerfile
    image: hatest-server
    ports:
      - "7373:7373"
      - "7374:7374"
    environment:
      TEST_HTTP2_PROTOCOLS: ${TEST_HTTP2_PROTOCOLS}
    depends_on:
      otelcol:
        condition: service_started

  # One P: the server decodes every HEADERS frame of a burst before any handler goroutine runs
  testserver-burst:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/gohttp2/server/Dockerfile
    image: hatest-server
    ports:
      - "7383:7373"
    environment:
      GOMAXPROCS: "1"
      TEST_HTTP2_PROTOCOLS: ${TEST_HTTP2_PROTOCOLS}
    depends_on:
      otelcol:
        condition: service_started

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    command:
      - --config=/configs/obi-config-http2.yml
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security${SECURITY_CONFIG_SUFFIX}:/sys/kernel/security
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-http2:/var/run/obi
    image: hatest-obi
    privileged: true # in some environments (not GH Pull Requests) you can set it to false and then cap_add: [ SYS_ADMIN ]
    pid: "host"
    environment:
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_SKIP_GO_SPECIFIC_TRACERS: "${OTEL_EBPF_SKIP_GO_SPECIFIC_TRACERS:-false}"
      OTEL_EBPF_TRACE_PRINTER: "text"
      OTEL_EBPF_METRICS_INTERVAL: "1s"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
      OTEL_EBPF_BPF_DEBUG: "TRUE"
      OTEL_EBPF_HOSTNAME: "obi"
    depends_on:
      testclient:
        condition: service_started

      testclient-xnet-legacy:
        condition: service_started

      testclient-stdlib-legacy:
        condition: service_started

      testserver-burst:
        condition: service_started

  # OpenTelemetry Collector — fans OBI's OTLP push out to jaeger (production
  # path used by the test's trace assertions) and to weaver (semconv tap).
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    container_name: otel-col
    deploy:
      resources:
        limits:
          memory: 125M
    restart: unless-stopped
    command: ["--config=/etc/otelcol-config/otelcol-config-weaver.yml"]
    volumes:
      - ./configs/:/etc/otelcol-config
    ports:
      - "4317" # OTLP over gRPC receiver
      - "4318:4318" # OTLP over HTTP receiver
      - "9464" # Prometheus exporter
      - "8888" # metrics endpoint
    depends_on:
      jaeger:
        condition: service_started
      prometheus:
        condition: service_started
      weaver:
        condition: service_healthy

  weaver:
    extends:
      file: components/weaver/service.yml
      service: weaver
    volumes:
      - ../../../schemas/obi:/obi-registry:ro

  # Prometheus
  prometheus:
    image: quay.io/prometheus/prometheus:v3.16.0@sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/${PROMETHEUS_CONFIG:-prometheus-config-promscrape.yml}
      - --web.enable-lifecycle
      - --web.route-prefix=/
    volumes:
      - ./configs/:/etc/prometheus
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "16686:16686" # Query frontend
      - "4317" # OTEL GRPC traces collector (internal — otelcol talks to jaeger over the docker network)
      - "4318" # OTEL HTTP traces collector (internal)
    command:
      - "--set=service.telemetry.logs.level=debug"
# curl http://localhost:16686/api/services
# curl http://localhost:16686/api/traces?service=testserver
