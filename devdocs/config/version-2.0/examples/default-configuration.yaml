# Minimal runnable standalone Config v2 example.
# Replace the selector with your application. Traces are written as text for
# local verification; use a production exporter before deployment.
file_format: "1.0"

extensions:
  obi:
    version: "2.0"
    capture:
      policy:
        default_action: exclude
      rules:
        - action: include
          match:
            process:
              exe_path_glob: ["/path/to/your/application"]
    daemon:
      logging:
        debug_trace_output: text
