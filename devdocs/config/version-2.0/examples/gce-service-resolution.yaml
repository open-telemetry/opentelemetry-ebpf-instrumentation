# Replace the application path, project, and zone for your GCE host.
file_format: "1.0"
extensions:
  obi:
    version: "2.0"
    capture:
      policy:
        default_action: exclude
      rules:
        - action: include
          match:
            process:
              exe_path_glob: ["/path/to/your/application"]
    enrich:
      enrichers:
        cloud:
          refresh_interval: 30s
      service_name:
        sources: [gce]
        gce:
          project_id: my-project
          zone: us-central1-a
    daemon:
      logging:
        debug_trace_output: text
