# weaver live-check policy for the OBI semantic-convention registry.
#
# Auto-discovered by `weaver registry live-check` from the registry working
# directory. Only the `live-check` section is used; `registry check` ignores it.
#
# This replaces two filters that previously lived in the Go harness
# (internal/test/weavercheck): the advice-message ignore list and the
# information-to-violation promotion. Weaver 0.25 can express both declaratively.

# Promote advice weaver classifies as `information` to `violation` so live-check
# fails on it. `extends_namespace` catches an attribute emitted under an existing
# semconv namespace but declared in no registry; `undefined_enum_variant` catches
# an enumerated attribute emitted with a value outside its declared members.
[[live-check.finding_level_overrides]]
ids = ["extends_namespace", "undefined_enum_variant"]
level = "violation"

# Accept the known namespace collisions OBI cannot avoid: the collector-contrib
# servicegraph connector emits bare `server`/`client` labels, and netolly emits
# `iface` alongside `iface.direction`, all colliding with upstream `*.address` /
# `*.port` / `iface.direction` attributes. Scoped to those exact attribute
# samples, so a collision on any other attribute still surfaces.
[[live-check.finding_filters]]
exclude = ["illegal_namespace"]
sample_names = [
  "server.address",
  "server.port",
  "client.address",
  "client.port",
  "iface.direction",
]

# Accept passthrough attributes OBI forwards but does not itself set. These are
# valid semconv keys under namespaces OBI uses, so they surface as
# missing_attribute / extends_namespace violations rather than being tolerated
# as the sub-violation advice that unknown-namespace user attributes get — but
# they are not part of OBI's emitted contract, so they are tolerated here
# instead of declared:
#   - deployment.environment.name: set by the workload via
#     OTEL_RESOURCE_ATTRIBUTES and forwarded on the resource. Unlike
#     service.version, OBI never derives it from a Kubernetes label.
# Anything OBI actually sets is declared in the registry, so a new violation
# here still means a real gap unless it is genuine passthrough added to this list.
[[live-check.finding_filters]]
exclude = ["missing_attribute", "extends_namespace"]
sample_names = [
  "deployment.environment.name",
]

# The legacy span metrics stay declared and marked deprecated in spanmetrics/metrics.yaml while
# the deprecated `application_span` and `application_span_sizes` features still emit them.
# Weaver reports any emitted deprecated metric as a violation; accept these four for the
# compatibility window, scoped to their exact names so a deprecated emission of any other
# metric still surfaces. Remove this filter together with the legacy emission paths.
[[live-check.finding_filters]]
exclude = ["deprecated"]
sample_names = [
  "traces_spanmetrics_calls_total",
  "traces_spanmetrics_latency",
  "traces_spanmetrics_size_total",
  "traces_spanmetrics_response_size_total",
]
