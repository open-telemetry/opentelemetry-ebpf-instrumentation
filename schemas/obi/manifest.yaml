schema_url: https://open-telemetry.github.io/opentelemetry-ebpf-instrumentation/schemas/obi/0.12.2
description: |
  Schema registry for the OpenTelemetry eBPF instrumentation (OBI).

  Extends the upstream OpenTelemetry semantic conventions registry with the
  metrics and attributes that OBI emits in addition to (or as overrides of)
  the standard semconv set:

  - The `target.info` meta-metric family (Prometheus / OpenMetrics
    `target_info` heritage, emitted in OTel dot notation over OTLP) and the
    `instance` / `job` scrape-convention attributes
  - Span metrics matching the OTel collector-contrib `spanmetricsconnector`
    output, in both naming schemes: the OTel-canonical
    `traces.span.metrics.*` names (emitted when the `application_span_otel`
    metrics feature is enabled) and the legacy Grafana-style
    `traces_spanmetrics_*` names, which stay declared and marked deprecated
    for as long as the deprecated `application_span` feature still emits them
  - Service-graph metrics matching the OTel collector-contrib
    `servicegraphconnector` output (emitted when the
    `application_service_graph` metrics feature is enabled)
  - OBI-internal markers consumed by downstream processors

  Together with the upstream registry referenced in `dependencies`, this
  registry forms the complete contract of what OBI emits.
stability: development
dependencies:
  # The dependency version MUST stay in sync with the upstream
  # OpenTelemetry semantic conventions version OBI is built against. A
  # CI guard asserts both sides match — bump them together.
  #
  # `registry_path` points to a local pre-fetched copy under `.deps/` so
  # weaver doesn't clone semconv on every container start. Run
  # `make fetch-upstream-semconv` (also invoked by `make prereqs`) to
  # populate it; CI caches the directory so cold runs stay fast. The path
  # is resolved relative to this manifest, so the same value works whether
  # weaver runs against the registry on the host or inside a container
  # bind-mount.
  - schema_url: https://opentelemetry.io/schemas/1.41.0
    registry_path: .deps/upstream-v1.41.0[model]
