file_format: definition/2
attributes:
  - key: openai.api.type
    stability: development
    type:
      members:
        - id: chat_completions
          value: "chat_completions"
          brief: The OpenAI [Chat Completions API](https://developers.openai.com/api/reference/chat-completions/overview).
          stability: development
        - id: responses
          value: "responses"
          brief: The OpenAI [Responses API](https://developers.openai.com/api/reference/responses/overview).
          stability: development
        # --- OBI extensions (not in upstream semconv v1.41) ---
        - id: embeddings
          value: "embeddings"
          brief: The OpenAI [Embeddings API](https://developers.openai.com/api/reference/embeddings/overview).
          stability: development
        - id: text_completions
          value: "text_completions"
          brief: The legacy OpenAI [Completions API](https://developers.openai.com/api/reference/completions/overview).
          stability: development
    brief: The type of OpenAI API being used.

attribute_groups:
  # Overrides `openai.api.type`: extends the upstream enum with `embeddings`
  # and `text_completions`. pkg/ebpf/common/http/openai.go classifies OpenAI
  # calls as chat_completions / responses / embeddings / text_completions from
  # the URL path; upstream v1.41 declares only the first two.
  #
  # See ../../README.md for how the definition above takes precedence over the
  # upstream one, and why it carries the full upstream member list.
  - id: x.obi.openai
    visibility: public
    brief: >
      OBI override of `openai.api.type` extending the upstream enum with the
      embeddings and legacy text-completions APIs, which OBI detects but
      upstream semconv has no members for.
    stability: development
    attributes:
      - ref: openai.api.type
