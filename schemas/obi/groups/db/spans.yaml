file_format: definition/2
spans:
  - type: obi.db.client
    annotations:
      obi:
        upstream: db.client
    kind: client
    name:
      note: >
        Built per database system from the operation and its target, falling
        back to the `db.system.name` value: Redis and Memcached report
        `{db.operation.name}`, or `redis` / `memcached`; MongoDB and Couchbase
        `{db.operation.name} {db.collection.name}`, `{db.operation.name}
        {db.namespace}`, `{db.operation.name}`, `{db.collection.name}`,
        `{db.namespace}` or the system; Aerospike `{db.operation.name}
        {db.namespace}.{db.collection.name}`, dropping a missing part, or
        `aerospike`; Couchbase SQL++ `{db.operation.name} {db.collection.name}`,
        `{db.operation.name} {db.namespace}`, `{db.operation.name}
        {server.address}:{server.port}`, `{db.operation.name}` or
        `couchbase`. One template list cannot order the Aerospike and MongoDB
        forms correctly for both, so the name is described rather than templated.
    stability: development
    requirement_level: recommended
    brief: OBI outbound database client span.
    attributes:
      - ref: db.system.name
        requirement_level: required
      - ref: db.namespace
        requirement_level:
          conditionally_required: if the exchange named a database
      - ref: db.collection.name
        requirement_level:
          conditionally_required: if the exchange named a collection
      - ref: db.operation.name
        requirement_level:
          conditionally_required: if the operation could be parsed from the exchange
      - ref: db.operation.batch.size
        requirement_level:
          recommended: if the operation is a batch
      - ref: db.query.text
        requirement_level: opt_in
      - ref: db.response.status_code
        requirement_level:
          conditionally_required: if the operation failed and the status code is available
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: server.address
        requirement_level: recommended
      - ref: server.port
        requirement_level:
          conditionally_required: if using a port other than the default port for this DBMS and if `server.address` is set
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: network.peer.address
        requirement_level:
          recommended: if the peer address is an IP rather than a name
      - ref: network.peer.port
        requirement_level:
          recommended: if `network.peer.address` is set and the port is known

  # SQL client spans come from their own emitter branch, separate from the
  # other native database protocols `obi.db.client` covers.
  - type: obi.db.sql.client
    annotations:
      obi:
        upstream: [db.sql.client, db.client]
    kind: client
    name:
      templates:
        - "{db.query.summary}"
        - "{db.operation.name} {db.collection.name}"
        - "{db.operation.name} {db.namespace}"
        - "{db.operation.name}"
        - "{db.collection.name}"
        - "{db.namespace}"
        - "{db.system.name}"
    stability: stable
    requirement_level: recommended
    brief: OBI outbound SQL database client span.
    attributes:
      - ref: db.system.name
        requirement_level: required
      - ref: db.namespace
        requirement_level:
          conditionally_required: if the exchange named a database
      - ref: db.collection.name
        requirement_level:
          conditionally_required: if the operation could be parsed and names a table
      - ref: db.operation.name
        requirement_level:
          conditionally_required: if the operation could be parsed from the query
      - ref: db.query.text
        requirement_level: opt_in
      - ref: db.query.summary
        requirement_level:
          recommended: if a summary could be derived from the query
      - ref: db.response.status_code
        requirement_level:
          conditionally_required: if the operation failed and the status code is available
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: server.address
        requirement_level: recommended
      - ref: server.port
        requirement_level:
          conditionally_required: if using a port other than the default port for this DBMS and if `server.address` is set
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: network.peer.address
        requirement_level:
          recommended: if the peer address is an IP rather than a name
      - ref: network.peer.port
        requirement_level:
          recommended: if `network.peer.address` is set and the port is known

  # Elasticsearch is recognised from HTTP client traffic, so these spans carry
  # the HTTP client base set on top of the db.* attributes. The native database
  # protocols covered by obi.db.client never emit http.* / url.*, which is
  # why this is a separate group rather than extra refs on the shared one.
  - type: obi.elasticsearch.client
    annotations:
      obi:
        upstream: [db.elasticsearch.client, db.client]
        upstream_extras:
          http.response.body.size: the response size of the HTTP exchange that carries the Elasticsearch query
    kind: client
    name:
      templates:
        - "{db.operation.name} {db.collection.name}"
        - "{db.operation.name} {db.namespace}"
        - "{db.operation.name} {server.address}:{server.port}"
        - "{db.operation.name}"
        - "{db.collection.name}"
        - "{db.namespace}"
        - "{server.address}:{server.port}"
        - "{db.system.name}"
    stability: development
    requirement_level: recommended
    brief: OBI Elasticsearch client span, detected from HTTP client traffic.
    attributes:
      - ref: http.request.method
        requirement_level: required
      - ref: url.full
        requirement_level: required
      # Appended for this subtype outside the transport gate the other HTTP
      # response attributes sit behind.
      - ref: http.response.body.size
        requirement_level: opt_in
      - ref: db.system.name
        requirement_level: required
      - ref: db.namespace
        requirement_level:
          recommended: if the response identified the cluster
      - ref: db.collection.name
        requirement_level:
          conditionally_required: if the operation targets a named collection
      - ref: db.operation.name
        requirement_level: required
      - ref: db.operation.parameter
        requirement_level:
          conditionally_required: when the url has path parameters OBI maps (index, document id)
      - ref: db.query.text
        requirement_level: opt_in
      - ref: elasticsearch.node.name
        requirement_level:
          recommended: if the response identified the node
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: server.address
        requirement_level:
          conditionally_required: if the peer address was resolved from the connection
      - ref: server.port
        requirement_level:
          conditionally_required: if the port was observed on the connection
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: network.peer.address
        requirement_level:
          recommended: if the peer address is an IP rather than a name
      - ref: network.peer.port
        requirement_level:
          recommended: if `network.peer.address` is set and the port is known
      - ref: network.protocol.version
        requirement_level:
          recommended: if the protocol version was observed on the wire
      - ref: db.response.status_code
        requirement_level:
          conditionally_required: if a response was received

  - type: obi.db.server
    annotations:
      obi:
        upstream: none
        upstream_reason: upstream defines database spans for the client side only
    kind: server
    name:
      note: >
        The same form as the client span of the database system: SQL servers are
        named like `obi.db.sql.client`, and Redis, Memcached and Aerospike
        servers like `obi.db.client`.
    stability: development
    requirement_level: recommended
    brief: OBI inbound database server span.
    attributes:
      - ref: db.system.name
        requirement_level: required
      - ref: db.namespace
        requirement_level:
          conditionally_required: if the exchange named a database
      - ref: db.collection.name
        requirement_level:
          conditionally_required: if the exchange named a collection
      - ref: db.operation.name
        requirement_level:
          conditionally_required: if the operation could be parsed from the exchange
      - ref: db.query.text
        requirement_level: opt_in
      - ref: db.response.status_code
        requirement_level:
          conditionally_required: if the operation failed and the status code is available
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: server.address
        requirement_level:
          conditionally_required: if the host address was resolved from the connection
      - ref: server.port
        requirement_level:
          conditionally_required: if the port was observed on the connection
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: network.peer.address
        requirement_level:
          recommended: if the peer address is an IP rather than a name
      - ref: network.peer.port
        requirement_level:
          recommended: if `network.peer.address` is set and the port is known
      - ref: db.query.summary
        requirement_level:
          recommended: if a summary could be derived from the query
