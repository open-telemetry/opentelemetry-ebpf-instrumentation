groups:
  - id: registry.obi
    type: attribute_group
    display_name: OBI Internal Telemetry
    brief: >
      OBI's own meta-telemetry: the `target.info` / `host.info` family of
      per-target meta-metrics (emitted in OTel dot notation over OTLP, and
      as the Prometheus-style `target_info` / `host_info` underscore
      variants by the Prometheus exporter) that
      identify the instrumenter and the resource it is running against,
      together with the labels they carry and any deviations from upstream
      semconv that are tracked for removal. Distinct from OBI's emissions
      that describe the *instrumented application's* behaviour
      (HTTP / DB / messaging / spanmetrics / service-graph), which live in
      sibling files or in upstream semconv.
    attributes:
      - id: source
        type: string
        stability: development
        brief: >
          Identifier of the vendor / SDK that produced the metric. OBI sets
          this to `obi`. Used by the spanmetrics and service-graph
          emissions to disambiguate from collector-contrib connector
          output.
        examples: [ "obi" ]
      - id: instance
        type: string
        stability: development
        brief: >
          Scrape target instance label, originating from the Prometheus /
          OpenMetrics convention. Carried on `target_info` and on every
          series exported via OBI's Prometheus exporter.
        examples: ["host.local:9090"]
      - id: job
        type: string
        stability: development
        brief: >
          Scrape target job label, originating from the Prometheus /
          OpenMetrics convention. Carried on `target_info` and on every
          series exported via OBI's Prometheus exporter.
        examples: ["my-service"]
      - id: obi.version
        type: string
        stability: development
        brief: >
          OBI build version, e.g. the release tag the instrumenter was
          built from. Carried as a resource attribute on every signal.
        examples: ["v0.42.0"]
      - id: obi.revision
        type: string
        stability: development
        brief: >
          Git SHA of the OBI build. Carried as a resource attribute on
          every signal.
        examples: ["a2a9a6e2"]

  # The instrument and (empty) unit declared here mirror what OBI currently
  # emits over OTLP rather than the OTel-canonical `gauge` / `unit: "1"`
  # Prometheus mapping, so weaver validates against the actual contract.
  # The OTLP name uses OTel dot notation; OBI's Prometheus exporter emits
  # the OpenMetrics-convention `target_info` counterpart, which weaver does
  # not see (only the OTLP tap is validated).
  - id: metric.target.info
    type: metric
    metric_name: target.info
    instrument: updowncounter
    unit: ""
    stability: development
    brief: >
      `target.info` meta-metric, modeled after the Prometheus / OpenMetrics
      `target_info` convention. Emitted with value 1 to carry the resource
      attributes of the originating service.
    attributes:
      - ref: instance
      - ref: job
      - ref: service.instance.id
      - ref: k8s.cluster.name
      - ref: k8s.container.name
      - ref: k8s.cronjob.name
      - ref: k8s.daemonset.name
      - ref: k8s.deployment.name
      - ref: k8s.job.name
      - ref: k8s.namespace.name
      - ref: k8s.node.name
      - ref: k8s.pod.name
      - ref: k8s.pod.start_time
      - ref: k8s.pod.uid
      - ref: k8s.replicaset.name
      - ref: k8s.statefulset.name

  # The trace-pipeline counterpart of `target.info`. Only emitted when any
  # span-metrics feature is enabled — i.e. one of `application_span`,
  # `application_span_otel`, or `application_span_sizes` (the
  # `application_service_graph` feature does NOT trigger it). OBI's
  # Prometheus exporter emits the underscore `traces_target_info`
  # counterpart.
  - id: metric.traces.target.info
    type: metric
    metric_name: traces.target.info
    instrument: updowncounter
    unit: ""
    stability: development
    brief: >
      OBI counterpart of `target.info` for the traces pipeline. Carries the
      resource attribute set of every traced service so dashboards can
      join trace metrics back to service identity.
    attributes:
      - ref: source

  # OBI-invented per-host meta-metric — there is no upstream /
  # collector-contrib analogue. Carries the upstream `host.id` attribute.
  # OBI's Prometheus exporter emits the underscore `traces_host_info`
  # counterpart.
  - id: metric.traces.host.info
    type: metric
    metric_name: traces.host.info
    instrument: gauge
    unit: ""
    stability: development
    brief: >
      OBI per-host meta-metric carrying the host identifier so dashboards
      can join trace metrics back to host / instance identity.
    attributes:
      - ref: host.id
        requirement_level: opt_in

  # ======================================================================
  # OBI internal ("meta") metrics emitted over OTLP by the
  # InternalMetricsReporter (pkg/export/otel/metrics_internal.go) when
  # internal_metrics.exporter=otel. These describe OBI's own behaviour
  # (exporter throughput, instrumentation accounting, eBPF probe/map stats,
  # build info), NOT the instrumented application. All names use the `obi.`
  # vendor prefix (attr.VendorPrefix).
  #
  # Attribute keys are namespaced to satisfy weaver's "must include a
  # namespace" advice. Where an existing semantic-convention attribute fits,
  # the metric references it directly (`process.executable.name` for the
  # instrumented process, `error.type` for the instrumentation-error class);
  # the OBI build version / revision reuse `obi.version` / `obi.revision`
  # declared above; everything else takes the `obi.` vendor prefix. The
  # matching keys are emitted by the OTLP InternalMetricsReporter. (OBI's
  # Prometheus internal exporter keeps underscore keys — Prometheus labels
  # cannot carry dots — but weaver only validates the OTLP tap.)
  # ======================================================================
  - id: registry.obi.internal_metrics
    type: attribute_group
    display_name: OBI Internal Metrics
    brief: >
      Attributes carried by OBI's own internal (obi.*) OTLP metrics. Keys are
      namespaced; where a semantic-convention attribute already fits
      (`process.executable.name`, `error.type`) the metrics reference it
      directly rather than declaring an OBI-specific alias.
    attributes:
      - id: obi.error
        type: string
        stability: development
        brief: >
          Raw error message from a failed OTLP export.
        examples: ["context deadline exceeded"]
      - id: obi.goarch
        type: string
        stability: development
        brief: Go build target architecture (runtime.GOARCH).
        examples: ["amd64", "arm64"]
      - id: obi.goos
        type: string
        stability: development
        brief: Go build target OS (runtime.GOOS).
        examples: ["linux"]
      - id: obi.goversion
        type: string
        stability: development
        brief: Go toolchain version OBI was built with (runtime.Version()).
        examples: ["go1.25.11"]
      - id: bpf.probe.id
        type: string
        stability: development
        brief: Identifier of the eBPF program (probe) the stats belong to.
        examples: ["42"]
      - id: bpf.probe.type
        type: string
        stability: development
        brief: eBPF program type of the probe.
        examples: ["kprobe", "tracepoint"]
      - id: bpf.probe.name
        type: string
        stability: development
        brief: Name of the eBPF probe.
        examples: ["kprobe_tcp_sendmsg"]
      - id: bpf.map.id
        type: string
        stability: development
        brief: Identifier of the eBPF map the stats belong to.
        examples: ["17"]
      - id: bpf.map.type
        type: string
        stability: development
        brief: eBPF map type.
        examples: ["hash", "lru_hash", "perf_event_array"]
      - id: bpf.map.name
        type: string
        stability: development
        brief: Name of the eBPF map.
        examples: ["events", "ongoing_http"]
      - id: telemetry.type
        type: string
        stability: development
        brief: >
          Which OBI pipeline avoided instrumenting a service that already has
          OpenTelemetry instrumentation. Value is "metrics" or "traces".
        examples: ["metrics", "traces"]
      - id: otel.metric.overflow
        type: boolean
        stability: development
        brief: >
          Set by the OpenTelemetry SDK cardinality limiter when the
          avoided-services attribute set overflows its configured limit.

  # --- OTLP exporter throughput / errors ---------------------------------
  - id: metric.obi.otel.metric.exports
    type: metric
    metric_name: obi.otel.metric.exports
    instrument: counter
    unit: ""
    stability: development
    brief: Length of the metric batches submitted to the remote OTEL collector.

  - id: metric.obi.otel.metric.export.errors
    type: metric
    metric_name: obi.otel.metric.export.errors
    instrument: counter
    unit: ""
    stability: development
    brief: Error count on each failed OTEL metric export.
    attributes:
      - ref: obi.error

  - id: metric.obi.otel.trace.exports
    type: metric
    metric_name: obi.otel.trace.exports
    instrument: counter
    unit: ""
    stability: development
    brief: Length of the trace batches submitted to the remote OTEL collector.

  - id: metric.obi.otel.trace.export.errors
    type: metric
    metric_name: obi.otel.trace.export.errors
    instrument: counter
    unit: ""
    stability: development
    brief: Error count on each failed OTEL trace export.
    attributes:
      - ref: obi.error

  # --- Instrumentation accounting ----------------------------------------
  - id: metric.obi.instrumented.processes
    type: metric
    metric_name: obi.instrumented.processes
    instrument: updowncounter
    unit: ""
    stability: development
    brief: Total number of instrumented processes, by process name.
    attributes:
      - ref: process.executable.name

  - id: metric.obi.instrumentation.errors
    type: metric
    metric_name: obi.instrumentation.errors
    instrument: counter
    unit: ""
    stability: development
    brief: >
      Total number of instrumentation errors, by process name and error type.
    attributes:
      - ref: process.executable.name
      - ref: error.type

  - id: metric.obi.avoided.services
    type: metric
    metric_name: obi.avoided.services
    instrument: gauge
    unit: ""
    stability: development
    brief: >
      Services OBI avoided instrumenting because they already carry
      OpenTelemetry instrumentation. Only emitted when the avoided-services
      internal metric is enabled.
    attributes:
      - ref: service.name
      - ref: service.namespace
      - ref: telemetry.type
      - ref: otel.metric.overflow

  # --- Build info --------------------------------------------------------
  - id: metric.obi.internal.build.info
    type: metric
    metric_name: obi.internal.build.info
    instrument: gauge
    unit: ""
    stability: development
    brief: >
      Constant '1' gauge labelled with build metadata (version, revision,
      goversion, goos, goarch), in the style of Prometheus `*_build_info`.
    attributes:
      - ref: obi.goarch
      - ref: obi.goos
      - ref: obi.goversion
      - ref: obi.version
      - ref: obi.revision

  # --- eBPF tracer / probe / map stats -----------------------------------
  - id: metric.obi.ebpf.tracer.flushes
    type: metric
    metric_name: obi.ebpf.tracer.flushes
    instrument: histogram
    unit: "1"
    stability: development
    brief: >
      Length of the groups of traces flushed from the eBPF tracer to the next
      pipeline stage.

  - id: metric.obi.bpf.probe.executions
    type: metric
    metric_name: obi.bpf.probe.executions
    instrument: counter
    unit: "{call}"
    stability: development
    brief: Total number of eBPF probe executions.
    attributes:
      - ref: bpf.probe.id
      - ref: bpf.probe.type
      - ref: bpf.probe.name

  - id: metric.obi.bpf.probe.latency_seconds_total
    type: metric
    metric_name: obi.bpf.probe.latency_seconds_total
    instrument: counter
    unit: "s"
    stability: development
    brief: Total latency of the eBPF probe in seconds.
    attributes:
      - ref: bpf.probe.id
      - ref: bpf.probe.type
      - ref: bpf.probe.name

  - id: metric.obi.bpf.map.entries_total
    type: metric
    metric_name: obi.bpf.map.entries_total
    instrument: gauge
    unit: ""
    stability: development
    brief: Number of entries in the eBPF map.
    attributes:
      - ref: bpf.map.id
      - ref: bpf.map.type
      - ref: bpf.map.name

  - id: metric.obi.bpf.map.max_entries_total
    type: metric
    metric_name: obi.bpf.map.max_entries_total
    instrument: gauge
    unit: ""
    stability: development
    brief: Maximum number of entries the eBPF map can hold.
    attributes:
      - ref: bpf.map.id
      - ref: bpf.map.type
      - ref: bpf.map.name

  # --- Network packet accounting (netolly) -------------------------------
  - id: metric.obi.bpf.network.packets.total
    type: metric
    metric_name: obi.bpf.network.packets.total
    instrument: counter
    unit: "{packet}"
    stability: development
    brief: How many network packets have been internally accounted.

  - id: metric.obi.bpf.network.ignored.packets.total
    type: metric
    metric_name: obi.bpf.network.ignored.packets.total
    instrument: counter
    unit: "{packet}"
    stability: development
    brief: >
      How many network packets have been internally ignored due to collisions
      in the internal eBPF cache.

  # --- Kubernetes informer ------------------------------------------------
  - id: metric.obi.kube.cache.forward.lag
    type: metric
    metric_name: obi.kube.cache.forward.lag
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      How long, in seconds, it takes from a Kubernetes event happening until
      it is forwarded to the subscribers.

