# OBI's .NET runtime metrics use the upstream instruments and units.
# Service and container metadata are carried on the meter resource.
file_format: definition/2
metrics:
  - name: dotnet.process.cpu.count
    brief: Number of processors available to the .NET process.
    instrument: updowncounter
    unit: "{cpu}"
    stability: stable
    requirement_level: recommended
  - name: dotnet.process.cpu.time
    brief: CPU time consumed by the .NET process.
    instrument: counter
    unit: "s"
    stability: stable
    requirement_level: recommended
    attributes:
      - ref: cpu.mode
        requirement_level: required
        examples: ["user", "system"]
  - name: dotnet.gc.heap.total_allocated
    brief: Total bytes allocated on the .NET managed heap since the collector baseline.
    instrument: counter
    unit: "By"
    stability: stable
    requirement_level: recommended
  - name: dotnet.gc.pause.time
    brief: Total .NET GC pause time since the collector baseline.
    instrument: counter
    unit: "s"
    stability: stable
    requirement_level: recommended
  - name: dotnet.jit.compiled_il.size
    brief: Total bytes of intermediate language compiled by the .NET JIT compiler.
    instrument: counter
    unit: "By"
    stability: stable
    requirement_level: recommended
  - name: dotnet.jit.compiled_methods
    brief: Total methods compiled by the .NET JIT compiler.
    instrument: counter
    unit: "{method}"
    stability: stable
    requirement_level: recommended
  - name: dotnet.jit.compilation.time
    brief: Total .NET JIT compilation time since the collector baseline.
    instrument: counter
    unit: "s"
    stability: stable
    requirement_level: recommended
  - name: dotnet.thread_pool.work_item.count
    brief: Total completed .NET thread-pool work items since the collector baseline.
    instrument: counter
    unit: "{work_item}"
    stability: stable
    requirement_level: recommended
  - name: dotnet.monitor.lock_contentions
    brief: Total .NET monitor lock contentions since the collector baseline.
    instrument: counter
    unit: "{contention}"
    stability: stable
    requirement_level: recommended
  - name: dotnet.process.memory.working_set
    brief: Physical memory mapped to the .NET process.
    instrument: updowncounter
    unit: "By"
    stability: stable
    requirement_level: recommended
  - name: dotnet.gc.last_collection.memory.committed_size
    brief: Committed .NET GC memory observed during the latest collection.
    instrument: updowncounter
    unit: "By"
    stability: stable
    requirement_level: recommended
  - name: dotnet.thread_pool.thread.count
    brief: Number of .NET thread-pool threads that currently exist.
    instrument: updowncounter
    unit: "{thread}"
    stability: stable
    requirement_level: recommended
  - name: dotnet.thread_pool.queue.length
    brief: Number of queued .NET thread-pool work items.
    instrument: updowncounter
    unit: "{work_item}"
    stability: stable
    requirement_level: recommended
  - name: dotnet.timer.count
    brief: Number of active .NET timers.
    instrument: updowncounter
    unit: "{timer}"
    stability: stable
    requirement_level: recommended
  - name: dotnet.assembly.count
    brief: Number of loaded .NET assemblies.
    instrument: updowncounter
    unit: "{assembly}"
    stability: stable
    requirement_level: recommended
