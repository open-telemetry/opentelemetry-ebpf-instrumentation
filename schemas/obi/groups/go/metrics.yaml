# OBI's narrowed copies of the upstream Go runtime metrics
# (semconv model/go). OBI's RuntimeMetricsReporter attaches service/container
# metadata to the meter resource, so these groups list only the runtime
# data-point attributes. Each keeps its upstream name, so the schemacheck
# drift test pins its unit/instrument/stability to upstream.
file_format: definition/2
metrics:
  - name: go.config.gogc
    brief: OBI-emitted go.config.gogc
    instrument: updowncounter
    unit: "%"
    stability: development
    requirement_level: recommended
  - name: go.cpu.time
    brief: OBI-emitted go.cpu.time
    instrument: counter
    unit: "s"
    stability: development
    requirement_level: recommended
    attributes:
      - ref: go.cpu.state
        requirement_level: required
      - ref: go.cpu.detailed_state
        requirement_level:
          recommended: if the runtime reported a detailed state
  - name: go.goroutine.count
    brief: OBI-emitted go.goroutine.count
    instrument: updowncounter
    unit: "{goroutine}"
    stability: development
    requirement_level: recommended
  - name: go.memory.allocated
    brief: OBI-emitted go.memory.allocated
    instrument: counter
    unit: "By"
    stability: development
    requirement_level: recommended
  - name: go.memory.allocations
    brief: OBI-emitted go.memory.allocations
    instrument: counter
    unit: "{allocation}"
    stability: development
    requirement_level: recommended
  - name: go.memory.gc.cycles
    brief: OBI-emitted go.memory.gc.cycles
    instrument: counter
    unit: "{gc_cycle}"
    stability: development
    requirement_level: recommended
  - name: go.memory.gc.goal
    brief: OBI-emitted go.memory.gc.goal
    instrument: updowncounter
    unit: "By"
    stability: development
    requirement_level: recommended
  - name: go.memory.gc.pause.duration
    brief: OBI-emitted go.memory.gc.pause.duration
    instrument: histogram
    unit: "s"
    stability: development
    requirement_level: recommended
  - name: go.memory.limit
    brief: OBI-emitted go.memory.limit
    instrument: updowncounter
    unit: "By"
    stability: development
    requirement_level: recommended
  - name: go.memory.used
    brief: OBI-emitted go.memory.used
    instrument: updowncounter
    unit: "By"
    stability: development
    requirement_level: recommended
    attributes:
      - ref: go.memory.type
        requirement_level: recommended
  - name: go.processor.limit
    brief: OBI-emitted go.processor.limit
    instrument: updowncounter
    unit: "{thread}"
    stability: development
    requirement_level: recommended
  - name: go.schedule.duration
    brief: OBI-emitted go.schedule.duration
    instrument: histogram
    unit: "s"
    stability: development
    requirement_level: recommended
