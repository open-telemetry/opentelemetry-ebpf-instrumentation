# OBI's AWS SDK span contract. OBI surfaces AWS S3 and SQS calls detected on
# the wire as client spans carrying the upstream aws.* / cloud.* attributes.
# All attributes are upstream semconv, so no OBI-specific attributes are
# declared here. The HTTP request/response attributes are absent:
# `httpClientTransportScope` returns `httpTransportNone` for both subtypes.
#
# S3 and SQS are separate groups because they are separate emitter branches
# with disjoint attribute sets: an S3 call reports the object it addressed, an
# SQS call the message it moved, and neither reports the other's. Declared as
# one group, no attribute beyond the shared AWS request metadata could be
# `required`, and a consumer could not tell which attributes occur together.
groups:
  - id: span.obi.aws.s3.client
    type: span
    span_kind: client
    stability: development
    brief: OBI AWS S3 client span.
    attributes:
      - ref: rpc.system.name
      - ref: rpc.method
      - ref: cloud.region
      - ref: aws.request_id
      - ref: aws.extended_request_id
      - ref: aws.s3.bucket
      - ref: aws.s3.key
      - ref: server.address
      - ref: server.port
      - ref: service.peer.name
      - ref: network.peer.address
      - ref: network.peer.port
      - ref: network.protocol.version
      - ref: error.type
      - ref: span.metrics.skip

  - id: span.obi.aws.sqs.client
    type: span
    span_kind: client
    stability: development
    brief: OBI AWS SQS client span.
    attributes:
      - ref: messaging.system
      - ref: messaging.operation.name
      - ref: messaging.destination.name
      - ref: messaging.message.id
      - ref: aws.sqs.queue.url
      - ref: cloud.region
      - ref: aws.request_id
      - ref: aws.extended_request_id
      - ref: server.address
      - ref: server.port
      - ref: messaging.operation.type
      - ref: service.peer.name
      - ref: network.peer.address
      - ref: network.peer.port
      - ref: network.protocol.version
      - ref: error.type
      - ref: span.metrics.skip
