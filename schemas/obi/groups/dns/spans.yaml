file_format: definition/2
spans:
  - type: obi.dns
    kind: internal
    name:
      note: >
        The DNS operation followed by the question,
        `{operation} {dns.question.name}`, the operation alone when no question
        was read, or `DNS`. The operation is not emitted as an attribute, so the
        name cannot be expressed as a template.
    stability: development
    requirement_level: recommended
    brief: OBI DNS resolution span.
    attributes:
      - ref: dns.question.name
        requirement_level:
          conditionally_required: if the lookup named a question
      - ref: dns.answers
        requirement_level:
          recommended: if the response carried answers
      - ref: client.address
        requirement_level: recommended
      - ref: server.address
        requirement_level:
          conditionally_required: if the peer address was resolved from the connection
      - ref: server.port
        requirement_level:
          conditionally_required: if the port was observed on the connection
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
