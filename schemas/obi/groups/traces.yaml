groups:
  - id: registry.obi.traces
    type: attribute_group
    display_name: OBI Application Span Attributes
    brief: >
      Attributes OBI emits on application spans that are not part of upstream
      OpenTelemetry semantic conventions — captured HTTP request/response
      bodies and ONC/Sun RPC auth flavor. Attributes already defined by
      upstream semconv (`http.*`, …) are not redeclared here.
    attributes:
      - id: http.request.body.content
        type: string
        stability: development
        brief: >
          Captured HTTP request body content. Only populated when OBI's body
          capture is enabled and subject to OBI's body-extraction rules
          (size limits, content-type filtering, obfuscation).
        note: >
          Tracks the upstream semantic-conventions proposal
          https://github.com/open-telemetry/semantic-conventions/pull/3521
          ("add http.{request,response}.body.content"). Declared in the OBI
          registry until that proposal is merged and released, at which point
          this attribute moves to upstream semconv.
        examples: ['{"user":"alice"}']
      - id: http.response.body.content
        type: string
        stability: development
        brief: >
          Captured HTTP response body content. Only populated when OBI's body
          capture is enabled and subject to OBI's body-extraction rules
          (size limits, content-type filtering, obfuscation).
        note: >
          Tracks the upstream semantic-conventions proposal
          https://github.com/open-telemetry/semantic-conventions/pull/3521
          ("add http.{request,response}.body.content"). Declared in the OBI
          registry until that proposal is merged and released, at which point
          this attribute moves to upstream semconv.
        examples: ['{"status":"ok"}']
      - id: onc_rpc.auth.flavor
        type: string
        stability: development
        brief: ONC/Sun RPC authentication flavor observed on the call.
        note: >
          OBI extension attribute, emitted on Sun RPC spans until upstream
          semconv adds an official ONC RPC auth flavor attribute, at which
          point this key will be migrated to the semconv name.
        examples: ["AUTH_NONE", "AUTH_SYS"]
      - id: gen_ai.metadata
        type: string
        stability: development
        brief: >
          Provider-specific request/response metadata captured on GenAI
          spans, JSON-encoded.
        note: >
          only emitted when selected via `attributes.select`
          (`gen_ai.metadata`), alongside the upstream
          `gen_ai.input.messages` / `gen_ai.output.messages` capture
          attributes.
        examples: ['{"conversation_id":"conv_abc123"}']
      - id: obi.http.response.observation
        type:
          members:
            - id: not_captured
              value: not_captured
              stability: development
              brief: >
                The peer answered and instrumentation stopped watching before
                capturing the response. The end timestamp is when watching
                stopped, so the duration is withheld.
            - id: not_received
              value: not_received
              stability: development
              brief: >
                Nothing came back and the local process closed the socket. The
                close ended the request, so the duration is a measurement.
            - id: not_parsed
              value: not_parsed
              stability: development
              brief: >
                The response arrived and no probe could parse it. The end
                timestamp came from the response's own bytes, so the duration
                is a measurement.
        stability: development
        brief: >
          How much of the HTTP response OBI observed. Emitted only when no
          status was parsed, and absent when `http.response.status_code`
          carries one.
        note: >
          OBI cannot read a status it did not parse, so it publishes this
          instead of inventing one. None of these values is reported as an
          error: `not_captured` and `not_parsed` describe a response that did
          arrive, and on `not_received` a peer that failed and a client that
          gave up are indistinguishable once the socket is closed, which
          semconv's carve-out for intentional cancellation asks not to be
          called an error. Spans carrying this attribute leave the span status
          unset and set no `error.type`.
        examples: [not_received]
