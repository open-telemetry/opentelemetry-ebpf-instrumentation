file_format: definition/2
attributes:
  - key: source
    type: string
    stability: development
    brief: >
      Identifier of the vendor / SDK that produced the metric. OBI sets
      this to `obi`. Used by the spanmetrics and service-graph
      emissions to disambiguate from collector-contrib connector
      output.
    examples: ["obi"]

  - key: instance
    type: string
    stability: development
    brief: >
      Instance identifier of the reporting service, carried on target.info
      and on every Prometheus span-metrics series.
    examples: ["host.local:9090"]

  - key: job
    type: string
    stability: development
    brief: >
      Job identifier of the reporting service, carried on target.info and
      on every Prometheus span-metrics series.
    examples: ["my-service"]

  - key: obi.version
    type: string
    stability: development
    brief: >
      OBI build version, e.g. the release tag the instrumenter was
      built from. Carried as a resource attribute on every signal.
    examples: ["v0.42.0"]

  - key: obi.revision
    type: string
    stability: development
    brief: >
      Git SHA of the OBI build. Carried as a resource attribute on
      every signal.
    examples: ["a2a9a6e2"]

  - key: obi.goarch
    type: string
    stability: development
    brief: Go build target architecture (runtime.GOARCH).
    examples: ["amd64", "arm64"]

  - key: obi.goos
    type: string
    stability: development
    brief: Go build target OS (runtime.GOOS).
    examples: ["linux"]

  - key: obi.goversion
    type: string
    stability: development
    brief: Go toolchain version OBI was built with (runtime.Version()).
    examples: ["go1.25.11"]

  - key: bpf.probe.id
    type: string
    stability: development
    brief: Identifier of the eBPF program (probe) the stats belong to.
    examples: ["42"]

  - key: bpf.probe.type
    type: string
    stability: development
    brief: eBPF program type of the probe.
    examples: ["kprobe", "tracepoint"]

  - key: bpf.probe.name
    type: string
    stability: development
    brief: Name of the eBPF probe.
    examples: ["kprobe_tcp_sendmsg"]

  - key: bpf.map.id
    type: string
    stability: development
    brief: Identifier of the eBPF map the stats belong to.
    examples: ["17"]

  - key: bpf.map.type
    type: string
    stability: development
    brief: eBPF map type.
    examples: ["hash", "lru_hash", "perf_event_array"]

  - key: bpf.map.name
    type: string
    stability: development
    brief: Name of the eBPF map.
    examples: ["events", "ongoing_http"]

  - key: subscriber
    type: string
    stability: development
    brief: >
      Name of the pipeline stage consuming the internal queue, as given to
      msg.SubscriberName when the stage subscribed. Subscribers that do not
      provide a name fall back to the name of the queue they subscribed to.
    examples: ["discover.CriteriaMatcher", "traceAttacher"]

  - key: telemetry.type
    type: string
    stability: development
    brief: >
      Which OBI pipeline avoided instrumenting a service that already has
      OpenTelemetry instrumentation. Value is "metrics" or "traces".
    examples: ["metrics", "traces"]

  - key: otel.metric.overflow
    type: boolean
    stability: development
    brief: >
      Set by the OpenTelemetry SDK cardinality limiter when the
      avoided-services attribute set overflows its configured limit.

attribute_groups:
  - id: registry.obi
    visibility: public
    brief: >
      OBI's own meta-telemetry: the `target.info` / `host.info` family of
      per-target meta-metrics (emitted in OTel dot notation over OTLP, and
      as the Prometheus-style `target_info` / `host_info` underscore
      variants by the Prometheus exporter) that
      identify the instrumenter and the resource it is running against,
      together with the labels they carry and any deviations from upstream
      semconv that are tracked for removal. Distinct from OBI's emissions
      that describe the *instrumented application's* behaviour
      (HTTP / DB / messaging / spanmetrics / service-graph), which live in
      sibling files or in upstream semconv.
    stability: development
    attributes:
      - ref: source
      - ref: instance
      - ref: job
      - ref: obi.version
      - ref: obi.revision

  # ======================================================================
  # OBI internal ("meta") metrics emitted over OTLP by the
  # InternalMetricsReporter (pkg/export/otel/metrics_internal.go) when
  # internal_metrics.exporter=otel. These describe OBI's own behaviour
  # (exporter throughput, instrumentation accounting, eBPF probe/map stats,
  # build info), NOT the instrumented application. All names use the `obi.`
  # vendor prefix (attr.VendorPrefix).
  #
  # Where an existing semantic-convention attribute fits, the metric references
  # it directly (`process.executable.name` for the instrumented process,
  # `error.type` for the instrumentation-error class). The keys declared here
  # mirror what the OTLP InternalMetricsReporter emits, including the ones
  # weaver flags as needing a namespace (`instance`, `job`, `source`): the
  # registry describes the emitted contract rather than the
  # contract OBI would emit if the keys were renamed. (OBI's Prometheus
  # internal exporter keeps underscore keys — Prometheus labels cannot carry
  # dots — but weaver only validates the OTLP tap.)
  # ======================================================================
  - id: registry.obi.internal_metrics
    visibility: public
    brief: >
      Attributes carried by OBI's own internal (obi.*) OTLP metrics. Keys are
      namespaced; where a semantic-convention attribute already fits
      (`process.executable.name`, `error.type`) the metrics reference it
      directly rather than declaring an OBI-specific alias.
    stability: development
    attributes:
      - ref: obi.goarch
      - ref: obi.goos
      - ref: obi.goversion
      - ref: bpf.probe.id
      - ref: bpf.probe.type
      - ref: bpf.probe.name
      - ref: bpf.map.id
      - ref: bpf.map.type
      - ref: bpf.map.name
      - ref: subscriber
      - ref: telemetry.type
      - ref: otel.metric.overflow
