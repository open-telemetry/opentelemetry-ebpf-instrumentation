file_format: definition/2
metrics:
  - name: messaging.client.operation.duration
    annotations:
      obi:
        upstream_omits:
          messaging.destination.template: only the application knows the template a destination name was built from
          messaging.consumer.group.name: OBI knows a consumer group only for Kafka fetches, which it records as messaging.process.duration
    brief: OBI-emitted messaging.client.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    requirement_level: recommended
    attributes:
      # Reachable only through the AWS SQS and SNS clients, which are HTTP
      # client spans where parsedErrorType applies. A broker span reaches
      # SpanErrorType through neither SpanStatusCode nor parsedErrorType, so it
      # never carries one.
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error, which OBI can determine only for the AWS SQS and SNS clients
      - ref: messaging.destination.name
        requirement_level:
          conditionally_required: if the exchange named a destination
      # Only an MQTT SUBSCRIBE carries a subscription, and it is a process
      # operation recorded on messaging.process.duration.
      - ref: messaging.destination.subscription.name
        requirement_level:
          conditionally_required: if the operation named a subscription, which no client operation OBI records does yet
      - ref: messaging.operation.name
        requirement_level: required
      - ref: messaging.operation.type
        requirement_level:
          conditionally_required: if the operation maps to a semantic-convention operation type
      - ref: messaging.system
        requirement_level: required
      - ref: server.address
        requirement_level:
          conditionally_required: if the server address could be resolved

  - name: messaging.process.duration
    annotations:
      obi:
        upstream_omits:
          messaging.destination.template: only the application knows the template a destination name was built from
    brief: OBI-emitted messaging.process.duration
    instrument: histogram
    unit: "s"
    stability: development
    requirement_level: recommended
    attributes:
      # Declared but not yet populated: SpanStatusCode has no case for the
      # broker event types and no parsedErrorType branch applies to them, so
      # SpanErrorType is always empty on a consume span. The label is part of
      # the metric's shape and the attribute keeps its name here, so a
      # consumer reads the same contract once OBI can classify these failures.
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error, which OBI cannot yet determine for a consume operation
      - ref: messaging.consumer.group.name
        requirement_level:
          conditionally_required: if OBI attributed the Kafka fetch to a single consumer group of the process, or the MQTT topic filter is a shared subscription
      - ref: messaging.destination.name
        requirement_level:
          conditionally_required: if the exchange named a destination
      - ref: messaging.destination.subscription.name
        requirement_level:
          conditionally_required: if the operation is an MQTT SUBSCRIBE, whose topic filter names the subscription
      - ref: messaging.operation.name
        requirement_level: required
      - ref: messaging.system
        requirement_level: required
      - ref: server.address
        requirement_level:
          conditionally_required: if the server address could be resolved
