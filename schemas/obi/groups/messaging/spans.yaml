      - ref: messaging.client.id
        requirement_level: recommended

  - id: span.obi.messaging.mqtt.consumer
    type: span
    span_kind: consumer
    stability: development
    extends: span.obi.messaging.common
    brief: OBI MQTT span for a process operation.
