file_format: definition/2
attribute_groups:
  # The exporter has one branch per broker and they emit different attribute
  # sets, so each broker gets its own groups rather than one union no span can
  # satisfy. The kind follows the messaging operation, not the side OBI observed
  # the exchange from: send and publish are producer, process is consumer, and
  # receive and settle are client, because OBI observes the exchange with the
  # broker rather than what the application afterwards does with the message.
  #
  # The attributes OBI emits on every messaging span, whatever the broker, are
  # shared through this group.
  - id: attributes.obi.messaging.common
    visibility: internal
    attributes:
      - ref: messaging.system
        requirement_level: required
      - ref: messaging.operation.name
        requirement_level: required
      - ref: messaging.operation.type
        requirement_level:
          conditionally_required: upstream declares it conditional; OBI always emits it, since group membership requires the operation to have been parsed
      - ref: server.address
        requirement_level:
          conditionally_required: if the peer address was resolved from the connection
      - ref: server.port
        requirement_level:
          conditionally_required: if the port was observed on the connection
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: network.peer.address
        requirement_level:
          recommended: if the peer address is an IP rather than a name
      - ref: network.peer.port
        requirement_level:
          recommended: if `network.peer.address` is set and the port is known

spans:
  - type: obi.messaging.kafka.producer
    annotations:
      obi:
        upstream: [messaging.kafka, messaging.attributes]
        upstream_omits:
          messaging.destination.template: only the application knows the template a destination name was built from
          messaging.destination.subscription.name: a subscription applies only to receiving messages
          messaging.destination.temporary: the traffic does not show whether the destination is temporary
          messaging.destination.anonymous: the traffic does not show whether the destination is anonymous
          error.type: OBI does not report broker errors
          messaging.kafka.message.tombstone: OBI does not report tombstones
          messaging.batch.message_count: OBI does not report Kafka batch sizes
    kind: producer
    name:
      templates:
        - "{messaging.operation.name} {messaging.destination.name}"
        - "{messaging.operation.name}"
    stability: development
    requirement_level: recommended
    brief: OBI Kafka span for a send or a publish operation.
    attributes:
      - ref_group: attributes.obi.messaging.common
      - ref: messaging.destination.name
        requirement_level: required
      - ref: messaging.client.id
        requirement_level: recommended
      - ref: messaging.destination.partition.id
        requirement_level:
          conditionally_required: if the record carried partition metadata

  - type: obi.messaging.kafka.consumer
    annotations:
      obi:
        upstream: [messaging.kafka, messaging.attributes]
        upstream_omits:
          messaging.destination.template: only the application knows the template a destination name was built from
          messaging.destination.temporary: the traffic does not show whether the destination is temporary
          messaging.destination.anonymous: the traffic does not show whether the destination is anonymous
          error.type: OBI does not report broker errors
          messaging.kafka.message.tombstone: OBI does not report tombstones
          messaging.destination.subscription.name: Kafka and AMQP 1.0 have no subscriptions
          messaging.batch.message_count: OBI does not report Kafka batch sizes
    kind: consumer
    name:
      templates:
        - "{messaging.operation.name} {messaging.destination.name}"
        - "{messaging.operation.name}"
    stability: development
    requirement_level: recommended
    brief: OBI Kafka span for a process operation.
    attributes:
      - ref_group: attributes.obi.messaging.common
      - ref: messaging.destination.name
        requirement_level: required
      - ref: messaging.client.id
        requirement_level: recommended
      - ref: messaging.destination.partition.id
        requirement_level:
          conditionally_required: if the record carried partition metadata
      - ref: messaging.kafka.offset
        requirement_level:
          recommended: if the record carried partition metadata
      - ref: messaging.consumer.group.name
        requirement_level:
          conditionally_required: if OBI attributed the fetch to a single consumer group of the process

  - type: obi.messaging.mqtt.producer
    annotations:
      obi:
        upstream: messaging.attributes
        upstream_omits:
          messaging.destination.template: only the application knows the template a destination name was built from
          messaging.consumer.group.name: a consumer group applies only to receiving messages
          messaging.destination.subscription.name: a subscription applies only to receiving messages
          messaging.destination.temporary: the traffic does not show whether the destination is temporary
          messaging.destination.anonymous: the traffic does not show whether the destination is anonymous
          error.type: OBI does not report broker errors
          messaging.batch.message_count: each span describes a single message
    kind: producer
    name:
      templates:
        - "{messaging.operation.name} {messaging.destination.name}"
        - "{messaging.operation.name}"
    stability: development
    requirement_level: recommended
    brief: OBI MQTT span for a send or a publish operation.
    attributes:
      - ref_group: attributes.obi.messaging.common
      - ref: messaging.destination.name
        requirement_level: required
      - ref: messaging.client.id
        requirement_level: recommended

  - type: obi.messaging.mqtt.consumer
    annotations:
      obi:
        upstream: messaging.attributes
        upstream_omits:
          messaging.destination.name: a SUBSCRIBE names a topic filter, reported as the subscription name, not a destination
          messaging.destination.template: only the application knows the template a destination name was built from
          messaging.destination.temporary: the traffic does not show whether the destination is temporary
          messaging.destination.anonymous: the traffic does not show whether the destination is anonymous
          error.type: OBI does not report broker errors
          messaging.batch.message_count: each span describes a single message
    kind: consumer
    name:
      templates:
        - "{messaging.operation.name}"
    stability: development
    requirement_level: recommended
    brief: OBI MQTT span for a process operation.
    attributes:
      # A SUBSCRIBE names a topic filter, which identifies a subscription rather
      # than a destination, so the span carries no messaging.destination.name:
      # the subscription name is the first topic filter of the packet, and the
      # consumer group is the share name of a `$share/{ShareName}/{filter}` one.
      - ref_group: attributes.obi.messaging.common
      - ref: messaging.destination.subscription.name
        requirement_level: required
      - ref: messaging.consumer.group.name
        requirement_level:
          conditionally_required: if the topic filter is a shared subscription
      - ref: messaging.client.id
        requirement_level: recommended

  - type: obi.messaging.nats.producer
    annotations:
      obi:
        upstream: messaging.attributes
        upstream_omits:
          messaging.destination.template: only the application knows the template a destination name was built from
          messaging.consumer.group.name: a consumer group applies only to receiving messages
          messaging.destination.subscription.name: a subscription applies only to receiving messages
          messaging.destination.temporary: the traffic does not show whether the destination is temporary
          messaging.destination.anonymous: the traffic does not show whether the destination is anonymous
          error.type: OBI does not report broker errors
          messaging.batch.message_count: each span describes a single message
    kind: producer
    name:
      templates:
        - "{messaging.operation.name} {messaging.destination.name}"
        - "{messaging.operation.name}"
    stability: development
    requirement_level: recommended
    brief: OBI NATS span for a send or a publish operation.
    attributes:
      - ref_group: attributes.obi.messaging.common
      - ref: messaging.destination.name
        requirement_level: required
      - ref: messaging.client.id
        requirement_level: recommended
      - ref: messaging.message.envelope.size
        requirement_level: recommended

  - type: obi.messaging.nats.consumer
    annotations:
      obi:
        upstream: messaging.attributes
        upstream_omits:
          messaging.destination.template: only the application knows the template a destination name was built from
          messaging.destination.temporary: the traffic does not show whether the destination is temporary
          messaging.destination.anonymous: the traffic does not show whether the destination is anonymous
          error.type: OBI does not report broker errors
          messaging.batch.message_count: each span describes a single message
          messaging.consumer.group.name: OBI does not report NATS queue groups
          messaging.destination.subscription.name: NATS identifies a subscription only by a per-connection id, which is not a name
    kind: consumer
    name:
      templates:
        - "{messaging.operation.name} {messaging.destination.name}"
        - "{messaging.operation.name}"
    stability: development
    requirement_level: recommended
    brief: OBI NATS span for a process operation.
    attributes:
      - ref_group: attributes.obi.messaging.common
      - ref: messaging.destination.name
        requirement_level: required
      - ref: messaging.client.id
        requirement_level: recommended
      - ref: messaging.message.envelope.size
        requirement_level: recommended

  - type: obi.messaging.amqp.producer
    annotations:
      obi:
        upstream: messaging.attributes
        upstream_omits:
          messaging.destination.template: only the application knows the template a destination name was built from
          messaging.consumer.group.name: a consumer group applies only to receiving messages
          messaging.destination.subscription.name: a subscription applies only to receiving messages
          messaging.destination.temporary: the traffic does not show whether the destination is temporary
          messaging.destination.anonymous: the traffic does not show whether the destination is anonymous
          error.type: OBI does not report broker errors
          messaging.batch.message_count: each span describes a single message
          messaging.destination.name: OBI does not report AMQP 1.0 destinations
    kind: producer
    name:
      note: >
        The operation followed by the exchange,
        `{messaging.operation.name} {exchange}`, or the operation alone when no
        exchange was read. The exchange is not emitted as an attribute on AMQP
        spans, so the name cannot be expressed as a template.
    stability: development
    requirement_level: recommended
    brief: OBI AMQP span for a send or a publish operation.
    attributes:
      - ref_group: attributes.obi.messaging.common

  - type: obi.messaging.amqp.consumer
    annotations:
      obi:
        upstream: messaging.attributes
        upstream_omits:
          messaging.destination.template: only the application knows the template a destination name was built from
          messaging.destination.temporary: the traffic does not show whether the destination is temporary
          messaging.destination.anonymous: the traffic does not show whether the destination is anonymous
          error.type: OBI does not report broker errors
          messaging.batch.message_count: each span describes a single message
          messaging.destination.subscription.name: Kafka and AMQP 1.0 have no subscriptions
          messaging.consumer.group.name: AMQP 1.0 has no consumer groups
          messaging.destination.name: OBI does not report AMQP 1.0 destinations
    kind: consumer
    name:
      note: >
        The operation followed by the exchange,
        `{messaging.operation.name} {exchange}`, or the operation alone when no
        exchange was read. The exchange is not emitted as an attribute on AMQP
        spans, so the name cannot be expressed as a template.
    stability: development
    requirement_level: recommended
    brief: OBI AMQP span for a process operation.
    attributes:
      - ref_group: attributes.obi.messaging.common
