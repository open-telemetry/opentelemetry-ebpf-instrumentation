    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: src.address
        requirement_level: recommended
      - ref: dst.address
        requirement_level: recommended
      - ref: src.port
        requirement_level: opt_in
      - ref: dst.port
        requirement_level: opt_in
