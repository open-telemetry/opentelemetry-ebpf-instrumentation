file_format: definition/2
metrics:
  # Counter has no explicit OTLP unit set; mirror that here so live-check
  # doesn't complain "Unit should be '1', but found ''".
  - name: traces_service_graph_request_total
    instrument: counter
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      Total number of edges in the service graph, grouped by client / server.
    attributes:
      - ref: client
        requirement_level: required
      - ref: server
        requirement_level: required
      - ref: connection_type
        requirement_level:
          conditionally_required: if the connection was not a direct HTTP or gRPC request
      - ref: client_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: server_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: source
        requirement_level: required
      - ref: client_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: client_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled

  # Counter has no explicit OTLP unit set; mirror that here so live-check
  # doesn't complain "Unit should be '1', but found ''".
  - name: traces_service_graph_request_failed_total
    instrument: counter
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      Total number of failed edges in the service graph, grouped by
      client / server.
    attributes:
      - ref: client
        requirement_level: required
      - ref: server
        requirement_level: required
      - ref: connection_type
        requirement_level:
          conditionally_required: if the connection was not a direct HTTP or gRPC request
      - ref: client_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: server_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: source
        requirement_level: required
      - ref: client_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: client_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled

  - name: traces_service_graph_request_server
    instrument: histogram
    unit: "s"
    stability: development
    requirement_level: recommended
    brief: >
      Server-side request duration distribution per service-graph edge.
    attributes:
      - ref: client
        requirement_level: required
      - ref: server
        requirement_level: required
      - ref: connection_type
        requirement_level:
          conditionally_required: if the connection was not a direct HTTP or gRPC request
      - ref: client_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: server_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: source
        requirement_level: required
      - ref: client_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: client_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled

  - name: traces_service_graph_request_client
    instrument: histogram
    unit: "s"
    stability: development
    requirement_level: recommended
    brief: >
      Client-side request duration distribution per service-graph edge.
    attributes:
      - ref: client
        requirement_level: required
      - ref: server
        requirement_level: required
      - ref: connection_type
        requirement_level:
          conditionally_required: if the connection was not a direct HTTP or gRPC request
      - ref: client_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: server_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: source
        requirement_level: required
      - ref: client_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: client_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
