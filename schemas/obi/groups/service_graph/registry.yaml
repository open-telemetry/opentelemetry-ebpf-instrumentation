file_format: definition/2
attributes:
  - key: server
    type: string
    stability: development
    brief: Name of the service receiving the request.
    examples: ["users-api"]
  - key: client
    type: string
    stability: development
    brief: Name of the service initiating the request.
    examples: ["frontend"]
  - key: connection_type
    type:
      members:
        - id: messaging_system
          value: messaging_system
          stability: development
        - id: database
          value: database
          stability: development
        - id: virtual_node
          value: virtual_node
          stability: development
    stability: development
    brief: >
      The connection type between the two services (mirroring the
      servicegraphconnector values). The attribute is omitted for a
      direct HTTP/gRPC request.
  - key: server_service_namespace
    type: string
    stability: development
    brief: >
      The service namespace of the server side. Equivalent to the
      `service.namespace`-prefixed dimension defined by
      `servicegraphconnector` when `service.namespace` is added to the
      connector's `dimensions` list.
    examples: ["integration-test"]
  - key: client_service_namespace
    type: string
    stability: development
    brief: >
      The service namespace of the client side. Equivalent to the
      `service.namespace`-prefixed dimension defined by
      `servicegraphconnector` when `service.namespace` is added to the
      connector's `dimensions` list.
    examples: ["integration-test"]
  # Underscored Kubernetes peer labels OBI attaches to service-graph
  # metrics when Kubernetes decoration is active, mirroring the older
  # network-metrics naming. Distinct from the dotted
  # `k8s.namespace.name` / `k8s.cluster.name` semconv attributes, which
  # describe a single workload rather than the two peers of an edge.
  - key: client_k8s_namespace_name
    type: string
    stability: development
    brief: Kubernetes namespace of the client (request-initiating) peer.
    examples: ["integration-test"]
  - key: server_k8s_namespace_name
    type: string
    stability: development
    brief: Kubernetes namespace of the server (request-receiving) peer.
    examples: ["integration-test"]
  - key: client_k8s_cluster_name
    type: string
    stability: development
    brief: Kubernetes cluster name of the client (request-initiating) peer.
    examples: ["my-cluster"]
  - key: server_k8s_cluster_name
    type: string
    stability: development
    brief: Kubernetes cluster name of the server (request-receiving) peer.
    examples: ["my-cluster"]

attribute_groups:
  - id: registry.obi.service_graph
    visibility: public
    brief: >
      Attributes used by OBI's service-graph emission. The metric names and
      label set match the output of the OTel collector-contrib
      `servicegraphconnector` so the same dashboards consume both
      OBI-emitted and connector-emitted data. Emitted when OBI's
      `application_service_graph` metrics feature is enabled.

      The OBI-specific `source` attribute is declared in `obi_internal/registry.yaml`.

      See:
      https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/connector/servicegraphconnector
    stability: development
    attributes:
      - ref: server
      - ref: client
      - ref: connection_type
      - ref: server_service_namespace
      - ref: client_service_namespace
      - ref: client_k8s_namespace_name
      - ref: server_k8s_namespace_name
      - ref: client_k8s_cluster_name
      - ref: server_k8s_cluster_name
