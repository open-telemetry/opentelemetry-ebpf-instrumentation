groups:
  - id: metric.obi.mcp.client.operation.duration
    type: metric
    metric_name: mcp.client.operation.duration
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted mcp.client.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: gen_ai.prompt.name
        requirement_level:
          conditionally_required: if the operation names a prompt
      - ref: gen_ai.tool.name
        requirement_level:
          conditionally_required: if the operation names a tool
      - ref: mcp.method.name
        requirement_level: required
      - ref: mcp.protocol.version
        requirement_level:
          recommended: if the peer reported a protocol version
      - ref: mcp.resource.uri
        requirement_level: opt_in
      - ref: rpc.response.status_code
        requirement_level:
          conditionally_required: if the response carried a JSON-RPC error code
      - ref: server.address
        requirement_level: recommended
      - ref: server.port
        requirement_level: recommended

  - id: metric.obi.mcp.server.operation.duration
    type: metric
    metric_name: mcp.server.operation.duration
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted mcp.server.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: gen_ai.prompt.name
        requirement_level:
          conditionally_required: if the operation names a prompt
      - ref: gen_ai.tool.name
        requirement_level:
          conditionally_required: if the operation names a tool
      - ref: mcp.method.name
        requirement_level: required
      - ref: mcp.protocol.version
        requirement_level:
          recommended: if the peer reported a protocol version
      - ref: mcp.resource.uri
        requirement_level: opt_in
      - ref: rpc.response.status_code
        requirement_level:
          conditionally_required: if the response carried a JSON-RPC error code

  - id: metric.obi.mcp.client.session.duration
    type: metric
    metric_name: mcp.client.session.duration
    annotations:
      obi:
        upstream_override: true
    brief: The duration of the MCP session as observed on the MCP client.
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref: error.type
        requirement_level:
          conditionally_required: If and only if the session ends with an error.
      - ref: mcp.protocol.version
        requirement_level:
          recommended: if the peer reported a protocol version
      - ref: server.address
        requirement_level: recommended
      - ref: server.port
        requirement_level: recommended

  - id: metric.obi.mcp.server.session.duration
    type: metric
    metric_name: mcp.server.session.duration
    annotations:
      obi:
        upstream_override: true
    brief: The duration of the MCP session as observed on the MCP server.
    instrument: histogram
    unit: "s"
    stability: development
    attributes:
      - ref: error.type
        requirement_level:
          conditionally_required: If and only if the session ends with an error.
      - ref: mcp.protocol.version
        requirement_level:
          recommended: if the peer reported a protocol version
