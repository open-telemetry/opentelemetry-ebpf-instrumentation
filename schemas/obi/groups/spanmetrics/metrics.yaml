groups:
  # Counter has no explicit OTLP unit set; mirror that here so live-check
  # doesn't complain "Unit should be '1', but found ''".
  - id: metric.obi.traces.span.metrics.calls
    type: metric
    metric_name: traces.span.metrics.calls
    instrument: counter
    unit: ""
    stability: development
    brief: >
      Total number of spans observed, grouped by span name / kind / status.
    attributes:
      - ref: span.name
      - ref: span.kind
      - ref: status.code
      - ref: source
      - ref: service.name
      - ref: service.instance.id
      - ref: service.namespace
      - ref: telemetry.sdk.language
      - ref: host.id

  - id: metric.obi.traces.span.metrics.duration
    type: metric
    metric_name: traces.span.metrics.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Duration distribution for observed spans, grouped by span name / kind
      / status.
    attributes:
      - ref: span.name
      - ref: span.kind
      - ref: status.code
      - ref: source
      - ref: service.name
      - ref: service.instance.id
      - ref: service.namespace
      - ref: telemetry.sdk.language
      - ref: host.id

  # Legacy Grafana-style names for the same two metrics, matching the older
  # spanmetrics processor output. Emitted by the deprecated `application_span`
  # metrics feature; the `traces.span.metrics.*` names above are the
  # replacement (`OTEL_EBPF_OTEL_METRICS_FEATURES=application_span_otel`).
  - id: metric.obi.traces_spanmetrics_calls_total
    type: metric
    metric_name: traces_spanmetrics_calls_total
    instrument: counter
    unit: ""
    stability: development
    deprecated:
      reason: renamed
      renamed_to: traces.span.metrics.calls
    brief: >
      Total number of spans observed, grouped by span name / kind / status
      (legacy naming).
    attributes:
      - ref: span.name
      - ref: span.kind
      - ref: status.code
      - ref: source
      - ref: service.name
      - ref: service.instance.id
      - ref: service.namespace
      - ref: telemetry.sdk.language
      - ref: host.id

  - id: metric.obi.traces_spanmetrics_latency
    type: metric
    metric_name: traces_spanmetrics_latency
    instrument: histogram
    unit: ""
    stability: development
    deprecated:
      reason: renamed
      renamed_to: traces.span.metrics.duration
    brief: >
      Duration distribution for observed spans, grouped by span name / kind
      / status (legacy naming).
    attributes:
      - ref: span.name
      - ref: span.kind
      - ref: status.code
      - ref: source
      - ref: service.name
      - ref: service.instance.id
      - ref: service.namespace
      - ref: telemetry.sdk.language
      - ref: host.id

  - id: metric.obi.traces_spanmetrics_size_total
    type: metric
    metric_name: traces_spanmetrics_size_total
    instrument: counter
    unit: ""
    stability: development
    deprecated:
      reason: obsoleted
      note: >
        The `application_span_sizes` metrics feature that emits this counter is
        deprecated with no replacement.
    brief: >
      Total request size observed for spans, grouped by span name / kind /
      status (legacy naming). Emitted with the `application_span_sizes`
      metrics feature enabled.
    attributes:
      - ref: span.name
      - ref: span.kind
      - ref: status.code
      - ref: source
      - ref: service.name
      - ref: service.instance.id
      - ref: service.namespace
      - ref: telemetry.sdk.language
      - ref: host.id

  - id: metric.obi.traces_spanmetrics_response_size_total
    type: metric
    metric_name: traces_spanmetrics_response_size_total
    instrument: counter
    unit: ""
    stability: development
    deprecated:
      reason: obsoleted
      note: >
        The `application_span_sizes` metrics feature that emits this counter is
        deprecated with no replacement.
    brief: >
      Total response size observed for spans, grouped by span name / kind /
      status (legacy naming). Emitted with the `application_span_sizes`
      metrics feature enabled.
    attributes:
      - ref: span.name
      - ref: span.kind
      - ref: status.code
      - ref: source
      - ref: service.name
      - ref: service.instance.id
      - ref: service.namespace
      - ref: telemetry.sdk.language
      - ref: host.id
