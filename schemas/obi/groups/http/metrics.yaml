groups:
  # --- Metrics ----------------------------------------------------------
  - id: metric.obi.http.client.request.body.size
    type: metric
    metric_name: http.client.request.body.size
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted http.client.request.body.size
    instrument: histogram
    unit: "By"
    stability: development
    attributes:
      - ref: http.request.method
        requirement_level: required
      - ref: http.response.status_code
        requirement_level:
          recommended: if a response was observed
      - ref: http.route
        requirement_level:
          recommended: if route collection is enabled and the route was matched
      - ref: server.address
        requirement_level:
          conditionally_required: if the peer address was resolved from the connection
      - ref: server.port
        requirement_level:
          conditionally_required: if the port was observed on the connection
      - ref: url.path
        requirement_level: opt_in
      - ref: url.scheme
        requirement_level: recommended
