file_format: definition/2
metrics:
  # --- Metrics ----------------------------------------------------------
  - name: http.client.request.body.size
    annotations:
      obi:
        upstream_extras:
          http.route: route dimension retained from the OBI v1 contract
          url.path: optional metric dimension retained from the OBI v1 contract
        upstream_relaxes:
          url.template: kept opt-in to preserve OBI v1 metric dimensions
          server.address: missing when OBI cannot tell which connection the request used
          server.port: missing when OBI cannot tell which connection the request used
        upstream_omits:
          network.protocol.name: required only for a protocol other than HTTP, which OBI never reports on this signal
    brief: OBI-emitted http.client.request.body.size
    instrument: histogram
    unit: "By"
    stability: development
    requirement_level: recommended
    attributes:
      - ref: url.path
        requirement_level: opt_in
      - ref: http.route
        requirement_level:
          conditionally_required: if route collection is enabled and the route was matched
      - ref: error.type
        requirement_level:
          conditionally_required: if the request ended in an error
      - ref: http.request.method
        requirement_level: required
      - ref: http.response.status_code
        requirement_level:
          conditionally_required: if a response was observed
      - ref: server.address
        requirement_level:
          conditionally_required: if the peer address was resolved from the connection
      - ref: server.port
        requirement_level:
          conditionally_required: if the port was observed on the connection
      - ref: url.scheme
        requirement_level: recommended
      - ref: url.template
        requirement_level: opt_in
