file_format: definition/2
attribute_groups:
  # The set every server span on an inbound HTTP request carries, shared by the
  # plain HTTP server span and the server spans of the protocols OBI identifies
  # inside the request. Only the plain HTTP server span adds the HTTP request
  # and response attributes.
  - id: attributes.obi.http.server.common
    visibility: internal
    attributes:
      - ref: client.address
        requirement_level: recommended
      - ref: server.address
        requirement_level: recommended
      - ref: server.port
        requirement_level:
          conditionally_required: if the port was observed on the connection
      - ref: http.request.body.content
        requirement_level: opt_in
      - ref: http.response.body.content
        requirement_level: opt_in
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: network.peer.address
        requirement_level:
          recommended: if the peer address is an IP rather than a name
      - ref: network.peer.port
        requirement_level:
          recommended: if `network.peer.address` is set and the port is known
      - ref: network.protocol.version
        requirement_level:
          recommended: if the protocol version was observed on the wire
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error

spans:
  # --- Spans ------------------------------------------------------------
  # Captured request / response bodies and headers appear on the HTTP span
  # itself, behind their own opt-in selectors.
  - type: obi.http.server
    annotations:
      obi:
        upstream: http.server
        upstream_relaxes:
          url.path: missing for a FastCGI request whose parameters are too large to capture
          url.scheme: missing for a FastCGI request whose parameters are too large to capture
        upstream_omits:
          network.protocol.name: required only for a protocol other than HTTP, which OBI never reports on this signal
    kind: server
    name:
      templates:
        - "{http.request.method} {http.route}"
        - "{http.request.method}"
        - "HTTP {http.route}"
        - "HTTP"
    stability: stable
    requirement_level: recommended
    brief: OBI inbound HTTP server span.
    attributes:
      - ref_group: attributes.obi.http.server.common
      - ref: http.request.method
        requirement_level: required
      - ref: http.response.status_code
        requirement_level:
          conditionally_required: if a response was observed
      # A FastCGI params frame longer than the capture buffer arrives cut off,
      # and both of these are read from it. A key past the cut is unknown
      # rather than absent, so neither is guaranteed on that path.
      - ref: url.path
        requirement_level:
          conditionally_required: if the front end reported a request URI, and the params frame carrying it was captured whole
      - ref: url.scheme
        requirement_level:
          conditionally_required: if the front end reported a scheme, and the params frame carrying it was captured whole
      - ref: url.query
        requirement_level:
          conditionally_required: if the request carried a query string
      - ref: http.route
        requirement_level:
          conditionally_required: if route collection is enabled and the route was matched
      - ref: http.request.body.size
        requirement_level: opt_in
      - ref: http.response.body.size
        requirement_level: opt_in
      - ref: http.request.header
        requirement_level: opt_in
      - ref: http.response.header
        requirement_level: opt_in
      - ref: http.request.method_original
        requirement_level:
          conditionally_required: if the wire method was read and differs from `http.request.method`
      - ref: user_agent.original
        requirement_level:
          recommended: if the request carried a user agent header
      - ref: obi.http.response.observed
        requirement_level: opt_in

  - type: obi.http.client
    annotations:
      obi:
        upstream: http.client
        upstream_relaxes:
          server.address: missing when OBI cannot tell which connection the request used
          server.port: missing when OBI cannot tell which connection the request used
          url.full: missing when neither the scheme nor the host of the request is known
        upstream_omits:
          network.protocol.name: required only for a protocol other than HTTP, which OBI never reports on this signal
    kind: client
    name:
      note: >
        The method, or `HTTP` when it is outside the semantic-convention enum,
        followed by the route when OBI classified the request path into one:
        `{http.request.method} {route}`. Client spans do not emit the route as
        an attribute, so the name cannot be expressed as a template.
    stability: stable
    requirement_level: recommended
    brief: OBI outbound HTTP client span.
    attributes:
      - ref: http.request.method
        requirement_level: required
      - ref: http.response.status_code
        requirement_level:
          conditionally_required: if a response was observed
      - ref: url.full
        requirement_level:
          conditionally_required: if the scheme or the host was captured on the connection
      - ref: url.scheme
        requirement_level:
          conditionally_required: if the scheme was captured on the connection
      - ref: url.template
        requirement_level: opt_in
      - ref: server.address
        requirement_level:
          conditionally_required: if the peer address was resolved from the connection
      - ref: server.port
        requirement_level:
          conditionally_required: if the port was observed on the connection
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: http.request.body.size
        requirement_level: opt_in
      - ref: http.response.body.size
        requirement_level: opt_in
      - ref: http.request.body.content
        requirement_level: opt_in
      - ref: http.response.body.content
        requirement_level: opt_in
      - ref: http.request.header
        requirement_level: opt_in
      - ref: http.response.header
        requirement_level: opt_in
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: network.peer.address
        requirement_level:
          recommended: if the peer address is an IP rather than a name
      - ref: network.peer.port
        requirement_level:
          recommended: if `network.peer.address` is set and the port is known
      - ref: network.protocol.version
        requirement_level:
          recommended: if the protocol version was observed on the wire
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: http.request.method_original
        requirement_level:
          conditionally_required: if the wire method was read and differs from `http.request.method`
      - ref: user_agent.original
        requirement_level: opt_in
      - ref: obi.http.response.observed
        requirement_level: opt_in

  # JSON-RPC over HTTP takes the default-deny transport scope, so the span
  # reports the RPC convention alone and none of the HTTP request or response
  # attributes, headers included, a plain HTTP client span carries.
  - type: obi.jsonrpc.client
    annotations:
      obi:
        upstream: [rpc.jsonrpc.call.client, rpc.call.client]
    kind: client
    name:
      templates:
        - "{rpc.method}"
        - "jsonrpc"
    stability: development
    requirement_level: recommended
    brief: OBI outbound JSON-RPC over HTTP client span.
    attributes:
      - ref: rpc.system.name
        requirement_level: required
      - ref: rpc.method
        requirement_level: required
      - ref: rpc.method_original
        requirement_level:
          conditionally_required: if the qualified method differs from the raw one
      - ref: jsonrpc.protocol.version
        requirement_level:
          conditionally_required: upstream declares it conditional; OBI always emits it, taking the version from the request, or 1.0 for Go net/rpc, whose requests carry none
      - ref: jsonrpc.request.id
        requirement_level:
          conditionally_required: if the request carried a JSON-RPC id
      - ref: rpc.response.status_code
        requirement_level:
          conditionally_required: if the response carried a JSON-RPC error code
      - ref: server.address
        requirement_level:
          conditionally_required: if the peer address was resolved from the connection
      - ref: server.port
        requirement_level:
          conditionally_required: if the port was observed on the connection
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: http.request.body.content
        requirement_level: opt_in
      - ref: http.response.body.content
        requirement_level: opt_in
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: network.peer.address
        requirement_level:
          recommended: if the peer address is an IP rather than a name
      - ref: network.peer.port
        requirement_level:
          recommended: if `network.peer.address` is set and the port is known
      - ref: network.protocol.version
        requirement_level:
          recommended: if the protocol version was observed on the wire
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error

  # The server branch takes a default-deny transport scope too, so the
  # protocols OBI identifies inside an inbound request report their own
  # convention on top of `attributes.obi.http.server.common`, without the HTTP
  # request or response attributes.
  - type: obi.graphql.server
    annotations:
      obi:
        upstream: graphql.server
        upstream_extras:
          error.type: semconv's error-recording guidance sets error.type on any failed operation
    kind: server
    name:
      templates:
        - "{graphql.operation.type}"
        - "GraphQL Operation"
    stability: development
    requirement_level: recommended
    brief: OBI inbound GraphQL over HTTP server span.
    attributes:
      - ref_group: attributes.obi.http.server.common
      - ref: graphql.operation.name
        requirement_level:
          conditionally_required: if the GraphQL document was parsed
      - ref: graphql.operation.type
        requirement_level:
          conditionally_required: if the GraphQL document was parsed
      - ref: graphql.document
        requirement_level: opt_in

  - type: obi.jsonrpc.server
    annotations:
      obi:
        upstream: [rpc.jsonrpc.call.server, rpc.call.server]
        upstream_relaxes:
          server.address: missing when OBI cannot tell which connection the request used
    kind: server
    name:
      templates:
        - "{rpc.method}"
        - "jsonrpc"
    stability: development
    requirement_level: recommended
    brief: OBI inbound JSON-RPC over HTTP server span.
    attributes:
      - ref_group: attributes.obi.http.server.common
      - ref: rpc.system.name
        requirement_level: required
      - ref: rpc.method
        requirement_level: required
      - ref: rpc.method_original
        requirement_level:
          conditionally_required: if the qualified method differs from the raw one
      - ref: jsonrpc.protocol.version
        requirement_level:
          conditionally_required: upstream declares it conditional; OBI always emits it, taking the version from the request, or 1.0 for Go net/rpc, whose requests carry none
      - ref: jsonrpc.request.id
        requirement_level:
          conditionally_required: if the request carried a JSON-RPC id
      - ref: rpc.response.status_code
        requirement_level:
          conditionally_required: if the response carried a JSON-RPC error code
