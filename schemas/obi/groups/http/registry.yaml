# OBI's HTTP telemetry: the body-capture attributes OBI adds on top of upstream
# semconv, its narrowed copies of the upstream HTTP metrics, and its HTTP span
# contract. The metrics keep their upstream names, so the schemacheck drift
# test pins unit/instrument/stability to upstream.
file_format: definition/2
attributes:
  - key: http.request.body.content
    annotations:
      obi:
        upstream_deviation: upstream defines no attribute for captured body content
    type: string
    stability: development
    brief: >
      Captured HTTP request body content. Only populated when OBI's body
      capture is enabled and subject to OBI's body-extraction rules
      (size limits, content-type filtering, obfuscation).
    note: >
      Tracks the upstream semantic-conventions proposal
      https://github.com/open-telemetry/semantic-conventions/pull/3521
      ("add http.{request,response}.body.content"). Declared in the OBI
      registry until that proposal is merged and released, at which point
      this attribute moves to upstream semconv.
    examples: ['{"user":"alice"}']
  - key: http.response.body.content
    annotations:
      obi:
        upstream_deviation: upstream defines no attribute for captured body content
    type: string
    stability: development
    brief: >
      Captured HTTP response body content. Only populated when OBI's body
      capture is enabled and subject to OBI's body-extraction rules
      (size limits, content-type filtering, obfuscation).
    note: >
      Tracks the upstream semantic-conventions proposal
      https://github.com/open-telemetry/semantic-conventions/pull/3521
      ("add http.{request,response}.body.content"). Declared in the OBI
      registry until that proposal is merged and released, at which point
      this attribute moves to upstream semconv.
    examples: ['{"status":"ok"}']
  - key: obi.http.response.observed
    type: boolean
    stability: development
    brief: >
      Present and false on an HTTP span whose response was never seen;
      absent otherwise. `http.response.status_code` is emitted instead
      once a response is observed.
    examples: [false]
  - key: gen_ai.span.kind
    type: string
    stability: development
    brief: >
      Coarse classification of the GenAI span, derived from
      `gen_ai.operation.name` (LLM / EMBEDDING / TOOL / RETRIEVER /
      RERANKER).
    note: >
      OBI fork extension emitted on GenAI spans; not part of the upstream
      semconv `gen_ai.*` attribute set.
    examples: ["LLM", "EMBEDDING"]

attribute_groups:
  - id: registry.obi.http
    visibility: public
    brief: >
      HTTP attributes OBI emits that are not part of upstream semconv
      (captured request/response bodies).
    stability: development
    attributes:
      - ref: http.request.body.content
      - ref: http.response.body.content
      - ref: obi.http.response.observed
      - ref: gen_ai.span.kind
