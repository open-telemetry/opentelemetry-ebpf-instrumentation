# The failed-connect span and the request-phase children have no upstream
# semconv domain of their own, so they live here rather than in a protocol
# domain file. Every other OBI span lives in its protocol's domain directory
# (http/, db/, rpc/, messaging/, gen_ai/, aws/, dns/).
file_format: definition/2
spans:
  - type: obi.failed_connect
    kind: client
    name:
      templates:
        - "CONNECT"
    stability: development
    requirement_level: recommended
    brief: OBI failed outbound connection span.
    attributes:
      - ref: client.address
        requirement_level: recommended
      - ref: server.address
        requirement_level:
          conditionally_required: if the peer address was resolved from the connection
      - ref: server.port
        requirement_level:
          conditionally_required: if the port was observed on the connection
      - ref: span.metrics.skip
        requirement_level: opt_in
      # This group exists only for connections that failed: SpanStatusCode
      # reports an error unconditionally and SpanErrorType falls through to
      # `_OTHER`, so the attribute is always present.
      - ref: error.type
        requirement_level: required

  - type: obi.request.phase
    kind: internal
    name:
      note: >
        `in queue` for the time between the request arriving and its handler
        starting, and `processing` for the time the handler ran. Neither is
        derived from an attribute.
    stability: development
    requirement_level: recommended
    brief: >
      OBI child span splitting a request that waited before it was processed
      into its queued and processing phases.
