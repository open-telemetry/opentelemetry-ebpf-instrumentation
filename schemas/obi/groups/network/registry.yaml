groups:
  - id: registry.obi.network
    type: attribute_group
    display_name: OBI Network Flow Metrics
    brief: >
      Attributes carried on OBI's network-flow metrics. Emitted when the
      `network`, `network_flow_packets`, or `network_inter_zone` metrics feature
      is enabled. The
      attribute set per data point is configurable via `attributes.select`;
      the listing here is the universe of keys OBI may produce, not a
      mandatory minimum.
    attributes:
      - id: obi.ip
        type: string
        stability: development
        brief: IP address of the host running OBI.
        examples: ["10.0.0.5"]
      - id: transport
        type: string
        stability: development
        brief: Transport protocol of the flow (e.g. TCP, UDP).
        examples: ["TCP"]
      # `network.type`, `network.protocol.name`, `client.port`, and
      # `server.port` are declared by upstream OpenTelemetry semantic
      # conventions; we reference them as `ref:` on the metrics below.
      - id: src.address
        type: string
        stability: development
        brief: Source IP address of the flow.
        examples: ["10.0.0.5"]
      - id: dst.address
        type: string
        stability: development
        brief: Destination IP address of the flow.
        examples: ["10.0.0.6"]
      - id: src.port
        type: int
        stability: development
        brief: Source TCP/UDP port.
      - id: dst.port
        type: int
        stability: development
        brief: Destination TCP/UDP port.
      - id: src.name
        type: string
        stability: development
        brief: Resolved name (DNS or workload) for the source endpoint.
        examples: ["frontend"]
      - id: dst.name
        type: string
        stability: development
        brief: Resolved name (DNS or workload) for the destination endpoint.
        examples: ["users-api"]
      - id: iface
        type: string
        stability: development
        brief: Network interface the flow was observed on.
        examples: ["eth0"]
      - id: iface.direction
        type:
          allow_custom_values: true
          members:
            - id: ingress
              value: ingress
              stability: development
            - id: egress
              value: egress
              stability: development
        stability: development
        brief: Direction of the flow relative to the interface.
      - id: direction
        type:
          allow_custom_values: true
          members:
            - id: request
              value: request
              stability: development
            - id: response
              value: response
              stability: development
            - id: unknown
              value: unknown
              stability: development
        stability: development
        brief: Whether the flow is the request or response side, derived from initiator / port heuristics.
      - id: src.zone
        type: string
        stability: development
        brief: Zone label attached to the source side (e.g. cloud availability zone).
        examples: ["us-east-1a"]
      - id: dst.zone
        type: string
        stability: development
        brief: Zone label attached to the destination side.
        examples: ["us-east-1b"]
      - id: src.cidr
        type: string
        stability: development
        brief: CIDR block matched against the source IP.
        examples: ["10.0.0.0/8"]
      - id: dst.cidr
        type: string
        stability: development
        brief: CIDR block matched against the destination IP.
        examples: ["10.0.0.0/8"]

      # GeoIP decoration of the flow endpoints, attached by the geoip pipeline
      # stage when GeoIP is enabled. Stored as strings (netolly Metadata is
      # string-valued). OBI/netolly convention, no upstream equivalent.
      - id: src.asn
        type: string
        stability: development
        brief: Autonomous System Number of the source endpoint, from GeoIP lookup.
        examples: ["AS15169"]
      - id: dst.asn
        type: string
        stability: development
        brief: Autonomous System Number of the destination endpoint, from GeoIP lookup.
        examples: ["AS15169"]
      - id: src.country
        type: string
        stability: development
        brief: ISO country code of the source endpoint, from GeoIP lookup.
        examples: ["US"]
      - id: dst.country
        type: string
        stability: development
        brief: ISO country code of the destination endpoint, from GeoIP lookup.
        examples: ["US"]

      # Kubernetes decoration of the source / destination flow endpoints,
      # attached by netolly (pkg/internal/netolly/transform/k8s) when
      # Kubernetes metadata is available and the corresponding keys are
      # selected. These `k8s.src.*` / `k8s.dst.*` keys are an OBI/netolly
      # convention: unlike the upstream single-workload `k8s.*` semconv
      # attributes, a flow has two endpoints to describe.
      - id: k8s.src.owner.name
        type: string
        stability: development
        brief: Name of the top-level Kubernetes owner of the source workload.
        examples: ["frontend"]
      - id: k8s.src.owner.type
        type: string
        stability: development
        brief: Kind of the top-level Kubernetes owner of the source workload.
        examples: ["Deployment"]
      - id: k8s.src.namespace
        type: string
        stability: development
        brief: Kubernetes namespace of the source workload.
        examples: ["integration-test"]
      - id: k8s.src.name
        type: string
        stability: development
        brief: Name of the source Kubernetes object (e.g. Pod name).
        examples: ["frontend-7d9c-abcde"]
      - id: k8s.src.type
        type: string
        stability: development
        brief: Type of the source Kubernetes object.
        examples: ["Pod"]
      - id: k8s.src.node.ip
        type: string
        stability: development
        brief: IP address of the node hosting the source workload.
        examples: ["10.0.1.5"]
      - id: k8s.src.node.name
        type: string
        stability: development
        brief: Name of the node hosting the source workload.
        examples: ["node-1"]
      - id: k8s.dst.owner.name
        type: string
        stability: development
        brief: Name of the top-level Kubernetes owner of the destination workload.
        examples: ["users-api"]
      - id: k8s.dst.owner.type
        type: string
        stability: development
        brief: Kind of the top-level Kubernetes owner of the destination workload.
        examples: ["Deployment"]
      - id: k8s.dst.namespace
        type: string
        stability: development
        brief: Kubernetes namespace of the destination workload.
        examples: ["integration-test"]
      - id: k8s.dst.name
        type: string
        stability: development
        brief: Name of the destination Kubernetes object (e.g. Pod name).
        examples: ["users-api-65b8-fghij"]
      - id: k8s.dst.type
        type: string
        stability: development
        brief: Type of the destination Kubernetes object.
        examples: ["Pod"]
      - id: k8s.dst.node.ip
        type: string
        stability: development
        brief: IP address of the node hosting the destination workload.
        examples: ["10.0.1.6"]
      - id: k8s.dst.node.name
        type: string
        stability: development
        brief: Name of the node hosting the destination workload.
        examples: ["node-2"]

  # Overrides `network.type`: extends the upstream `ipv4`/`ipv6` enum with
  # `arp`, which OBI reports for ARP frames — OBI observes raw L2 frames, a
  # case the upstream network-layer enum has no member for. Other non-IP
  # EtherTypes fall back to `unknown` (pkg/internal/netolly/flow/transport,
  # NetworkType.String); that bug-marker value is deliberately NOT declared
  # here, so weaver keeps flagging it if it ever appears.
  #
  # See ../../README.md for the override mechanics (x.obi.* group id, full
  # upstream member list, lint allowlist).
  - id: x.obi.network
    type: attribute_group
    display_name: OBI Network Attribute Overrides
    brief: >
      OBI override of `network.type` extending the upstream enum with `arp`
      for the ARP frames OBI observes at L2.
    attributes:
      - id: network.type
        stability: stable
        type:
          members:
            - id: ipv4
              value: 'ipv4'
              brief: "IPv4"
              stability: stable
            - id: ipv6
              value: 'ipv6'
              brief: "IPv6"
              stability: stable
            # --- OBI extension (not in upstream semconv v1.41) ---
            - id: arp
              value: 'arp'
              brief: "ARP (Address Resolution Protocol) frame observed at L2."
              stability: development
        brief: '[OSI network layer](https://wikipedia.org/wiki/Network_layer) or non-OSI equivalent.'
        note: The value SHOULD be normalized to lowercase.
        examples: ['ipv4', 'ipv6']
