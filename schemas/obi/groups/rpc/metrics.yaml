file_format: definition/2
metrics:
  - name: rpc.client.call.duration
    brief: OBI-emitted rpc.client.call.duration
    instrument: histogram
    unit: "s"
    stability: release_candidate
    requirement_level: recommended
    attributes:
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: rpc.method
        requirement_level:
          conditionally_required: if the call was captured
      - ref: rpc.response.status_code
        requirement_level:
          conditionally_required: if the status is inside the gRPC enum, or an ONC RPC REPLY was captured
      - ref: rpc.system.name
        requirement_level: required
      - ref: server.address
        requirement_level:
          conditionally_required: if the server address could be resolved
      - ref: server.port
        requirement_level:
          conditionally_required: if the port was observed on the connection

  - name: rpc.server.call.duration
    brief: OBI-emitted rpc.server.call.duration
    instrument: histogram
    unit: "s"
    stability: release_candidate
    requirement_level: recommended
    attributes:
      - ref: client.address
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: rpc.method
        requirement_level:
          conditionally_required: if the call was captured
      - ref: rpc.response.status_code
        requirement_level:
          conditionally_required: if the status is inside the gRPC enum, or an ONC RPC REPLY was captured
      - ref: rpc.system.name
        requirement_level: required
      - ref: server.address
        requirement_level: recommended
      - ref: server.port
        requirement_level: recommended
