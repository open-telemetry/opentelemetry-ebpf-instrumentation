file_format: definition/2
attributes:
  - key: cuda.memcpy.kind
    type:
      members:
        - id: host_to_host
          value: MemcpyHostToHost
          stability: development
        - id: host_to_device
          value: MemcpyHostToDevice
          stability: development
        - id: device_to_host
          value: MemcpyDeviceToHost
          stability: development
        - id: device_to_device
          value: MemcpyDeviceToDevice
          stability: development
        - id: default
          value: MemcpyDefault
          stability: development
    stability: development
    brief: >
      Direction of a CUDA memory copy, mirroring the `cudaMemcpyKind` enum
      of the CUDA Runtime API.
  - key: cuda.device.index
    type: int
    stability: development
    brief: >
      Index of the CUDA device the call ran on, as the process sees it. The
      attribute is only present after the calling thread has selected or
      queried a device through `cudaSetDevice` or `cudaGetDevice`; it is
      omitted when no device binding was observed. `CUDA_VISIBLE_DEVICES`
      remaps the index, which is why it may repeat across processes;
      `cuda.device.uuid` identifies the physical GPU.
  - key: cuda.device.uuid
    type: string
    stability: development
    brief: >
      UUID of the CUDA device the call ran on, as reported by the CUDA
      introspection APIs. It is the bare UUID, which is the uuid column of
      `nvidia-smi` with its `GPU-` prefix removed. Omitted when the process
      never asked CUDA about the device.
    examples: ["bed26f36-a0eb-994e-a0a6-a8437e7ca751"]
  - key: cuda.device.model
    type: string
    stability: development
    brief: >
      Model name of the CUDA device the call ran on, as reported by the
      CUDA introspection APIs. Omitted when the process never asked CUDA
      about the device.
    examples: ["NVIDIA H20-3e"]
  - key: gpu.clock.type
    type:
      members:
        - {id: processor, value: processor, stability: development, brief: "The clock of the processors of the GPU."}
        - {id: memory, value: memory, stability: development, brief: "The clock of the memory of the GPU."}
    stability: development
    brief: Which clock of the GPU a frequency belongs to.
  - key: gpu.clock.throttle.reason
    type:
      members:
        - {id: sw_power_cap, value: sw_power_cap, stability: development, brief: "The driver is keeping the GPU under its power limit."}
        - {id: hw_slowdown, value: hw_slowdown, stability: development, brief: "The hardware slowed the GPU down to protect it."}
        - {id: sync_boost, value: sync_boost, stability: development, brief: "The GPU is matching the clocks of the other GPUs of its group."}
        - {id: sw_thermal_slowdown, value: sw_thermal_slowdown, stability: development, brief: "The driver is keeping the GPU under its temperature limit."}
        - {id: hw_thermal_slowdown, value: hw_thermal_slowdown, stability: development, brief: "The hardware slowed the GPU down because it is too hot."}
        - {id: hw_power_brake_slowdown, value: hw_power_brake_slowdown, stability: development, brief: "The hardware slowed the GPU down because the power supply asked for it."}
    stability: development
    brief: A reason for which the NVIDIA driver can limit the clocks of a GPU.
  - key: gpu.xid.code
    type: string
    stability: development
    brief: Code of an Xid error, the error report of the NVIDIA GPU driver.
    examples: ["48", "79"]

attribute_groups:
  # CUDA GPU telemetry OBI emits from its gpuevent uprobes (enabled via
  # `instrument_cuda`). The metric names, units and instruments mirror the
  # emitters in `pkg/export/otel/metrics.go` / `pkg/export/prom/prom.go`; the
  # `cuda.memcpy.kind` attribute mirrors `CudaMemcpyName` in
  # `pkg/appolly/app/request/metric_attributes.go`.
  - id: registry.obi.gpu
    visibility: public
    brief: >
      Attributes carried on OBI's CUDA GPU metrics.
    stability: development
    attributes:
      - ref: cuda.memcpy.kind
      - ref: cuda.device.index
      - ref: cuda.device.uuid
      - ref: cuda.device.model

  # NVIDIA GPU device telemetry OBI reads through NVML (enabled via
  # `capture.instrumentation.gpu.device_metrics`). The emitters are in
  # `pkg/export/otel/metrics_gpu.go` and `pkg/export/prom/prom_gpu.go`.
  - id: registry.obi.gpu.device
    visibility: public
    brief: >
      Attributes carried on OBI's GPU device metrics.
    stability: development
    attributes:
      - ref: gpu.clock.type
      - ref: gpu.clock.throttle.reason
      - ref: gpu.xid.code
