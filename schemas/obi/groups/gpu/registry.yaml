groups:
  # CUDA GPU telemetry OBI emits from its gpuevent uprobes (enabled via
  # `instrument_cuda`). The metric names, units and instruments mirror the
  # emitters in `pkg/export/otel/metrics.go` / `pkg/export/prom/prom.go`; the
  # `cuda.memcpy.kind` attribute mirrors `CudaMemcpyName` in
  # `pkg/appolly/app/request/metric_attributes.go`.
  - id: registry.obi.gpu
    type: attribute_group
    display_name: OBI CUDA GPU
    brief: >
      Attributes carried on OBI's CUDA GPU metrics.
    attributes:
      - id: cuda.memcpy.kind
        type:
          allow_custom_values: true
          members:
            - id: host_to_host
              value: MemcpyHostToHost
              stability: development
            - id: host_to_device
              value: MemcpyHostToDevice
              stability: development
            - id: device_to_host
              value: MemcpyDeviceToHost
              stability: development
            - id: device_to_device
              value: MemcpyDeviceToDevice
              stability: development
            - id: default
              value: MemcpyDefault
              stability: development
        stability: development
        brief: >
          Direction of a CUDA memory copy, mirroring the `cudaMemcpyKind` enum
          of the CUDA Runtime API.
      - id: cuda.device.index
        type: int
        stability: development
        brief: >
          Index of the CUDA device the call ran on, as the process sees it. It
          defaults to 0, CUDA's default device, so it is always known.
          `CUDA_VISIBLE_DEVICES` remaps the index, which is why it may repeat
          across processes; `cuda.device.uuid` identifies the physical GPU.
      - id: cuda.device.uuid
        type: string
        stability: development
        brief: >
          UUID of the CUDA device the call ran on, as reported by the CUDA
          introspection APIs. It is the bare UUID, which is the uuid column of
          `nvidia-smi` with its `GPU-` prefix removed. Omitted when the process
          never asked CUDA about the device.
        examples: ["bed26f36-a0eb-994e-a0a6-a8437e7ca751"]
      - id: cuda.device.model
        type: string
        stability: development
        brief: >
          Model name of the CUDA device the call ran on, as reported by the
          CUDA introspection APIs. Omitted when the process never asked CUDA
          about the device.
        examples: ["NVIDIA H20-3e"]
