file_format: definition/2
metrics:
  - name: gpu.cuda.kernel.launch.calls
    annotations: &no_cuda_metric
      obi:
        upstream: none
        upstream_reason: upstream defines no CUDA metrics
    instrument: counter
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      Count of CUDA kernel launches observed (cudaLaunchKernel).
    attributes:
      - ref: cuda.device.index
        requirement_level: recommended
      - ref: cuda.device.uuid
        requirement_level: recommended
      - ref: cuda.device.model
        requirement_level: recommended

  - name: gpu.cuda.graph.launch.calls
    annotations: *no_cuda_metric
    instrument: counter
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      Count of CUDA graph launches observed (cudaGraphLaunch).
    attributes:
      - ref: cuda.device.index
        requirement_level: recommended
      - ref: cuda.device.uuid
        requirement_level: recommended
      - ref: cuda.device.model
        requirement_level: recommended

  - name: gpu.cuda.memory.allocations
    annotations: *no_cuda_metric
    instrument: counter
    unit: "By"
    stability: development
    requirement_level: recommended
    brief: >
      Bytes requested through CUDA device memory allocations (cudaMalloc).
    attributes:
      - ref: cuda.device.index
        requirement_level: recommended
      - ref: cuda.device.uuid
        requirement_level: recommended
      - ref: cuda.device.model
        requirement_level: recommended

  - name: gpu.cuda.kernel.grid.size
    annotations: *no_cuda_metric
    instrument: histogram
    unit: "1"
    stability: development
    requirement_level: recommended
    brief: >
      Distribution of CUDA kernel launch grid sizes (grid.x * grid.y * grid.z).
    attributes:
      - ref: cuda.device.index
        requirement_level: recommended
      - ref: cuda.device.uuid
        requirement_level: recommended
      - ref: cuda.device.model
        requirement_level: recommended

  - name: gpu.cuda.kernel.block.size
