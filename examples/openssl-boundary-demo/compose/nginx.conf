daemon off;
master_process off;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events {}
http {
    log_format context 'received "$request" traceparent=$http_traceparent';
    access_log /dev/stdout context;
    server {
        listen 8443 ssl;
        ssl_certificate /tls/cert.pem;
        ssl_certificate_key /tls/key.pem;
        location / {
            default_type text/plain;
            return 200 "nginx received traceparent=$http_traceparent\n";
        }
    }
}
