daemon off;
master_process off;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 1024; }
stream {
    server { listen 9443; proxy_pass backend:8443; }
}
http {
    log_format matrix escape=json '{"role":"nginx","path":"$uri","id":"$http_x_matrix_id","traceparent":"$http_traceparent","connection":"$connection","protocol":"$server_protocol","upstream":"$upstream_addr","upstream_status":"$upstream_status","cache":"$upstream_cache_status","status":$status,"client_verify":"$ssl_client_verify"}';
    access_log /dev/stdout matrix;
    upstream pool { server backend:8443; keepalive 16; }
    upstream balance { server backend:8443; server backend2:8443; }
    upstream retry { server backend:9443 max_fails=0; server backend:8443 backup; }
    proxy_cache_path /tmp/matrix-cache keys_zone=matrix:1m;
    server {
        listen 8443 ssl;
        listen 8443 quic reuseport;
        http2 on;
        ssl_certificate /artifacts/cert.pem;
        ssl_certificate_key /artifacts/key.pem;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /artifacts/cert.pem;
        proxy_ssl_server_name on;
        proxy_ssl_name obi-proxy-matrix;
        proxy_http_version 1.1;
        add_header X-Matrix-Cache $upstream_cache_status always;
        location /plain/ { proxy_pass http://backend:8080; }
        location /tls/ { proxy_pass https://backend:8443; }
        location /mtls/ {
            proxy_ssl_certificate /artifacts/cert.pem;
            proxy_ssl_certificate_key /artifacts/key.pem;
            proxy_pass https://backend:9444;
        }
        location /strip/ {
            proxy_set_header traceparent "";
            proxy_pass https://backend:8443;
        }
        location /replace/ {
            proxy_set_header traceparent "00-11111111111111111111111111111111-2222222222222222-01";
            proxy_pass https://backend:8443;
        }
        location /pool/ {
            proxy_set_header Connection "";
            proxy_pass https://pool;
        }
        location /balance/ { proxy_pass https://balance; }
        location /retry/ {
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 2;
            proxy_pass https://retry;
        }
        location /chain/ { proxy_pass https://apache:8443; }
        location /cache/ {
            proxy_cache matrix;
            proxy_cache_valid 200 1m;
            proxy_ignore_headers Set-Cookie;
            proxy_pass https://backend:8443;
        }
    }
    server {
        listen 8444 ssl;
        ssl_certificate /artifacts/cert.pem;
        ssl_certificate_key /artifacts/key.pem;
        ssl_client_certificate /artifacts/cert.pem;
        ssl_verify_client on;
        location / {
            proxy_http_version 1.1;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /artifacts/cert.pem;
            proxy_ssl_server_name on;
            proxy_ssl_name obi-proxy-matrix;
            proxy_pass https://backend:8443;
        }
    }

}
