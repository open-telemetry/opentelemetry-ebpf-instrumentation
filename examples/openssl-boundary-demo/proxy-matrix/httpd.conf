ServerRoot /usr/local/apache2
Listen 8080
Listen 8081
Listen 8443
ServerName obi-proxy-matrix
PidFile /tmp/httpd.pid
ErrorLog /proc/self/fd/2
LogLevel warn
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule http2_module modules/mod_http2.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_http2_module modules/mod_proxy_http2.so
LoadModule proxy_connect_module modules/mod_proxy_connect.so
User daemon
Group daemon
StartServers 1
ServerLimit 1
ThreadsPerChild 16
MaxRequestWorkers 16
LogFormat "{\"role\":\"apache\",\"path\":\"%U\",\"id\":\"%{X-Matrix-ID}i\",\"traceparent\":\"%{traceparent}i\",\"protocol\":\"%H\",\"status\":%>s}" matrix
CustomLog /proc/self/fd/1 matrix
ProxyRequests On
AllowCONNECT 8443
<Proxy "*">
    Require all denied
</Proxy>
<ProxyMatch "^(http://backend:8080/|(https|h2)://backend:8443/|backend:8443$)">
    Require all granted
</ProxyMatch>
<VirtualHost *:8080>
    ProxyRequests On
</VirtualHost>
<VirtualHost *:8081>
    ProxyRequests On
    <ProxyMatch "^backend:8443$">
        AuthType Basic
        AuthName "matrix"
        AuthBasicProvider file
        AuthUserFile /example/proxy.htpasswd
        Require valid-user
    </ProxyMatch>
</VirtualHost>
<VirtualHost *:8443>
    SSLEngine On
    SSLCertificateFile /artifacts/cert.pem
    SSLCertificateKeyFile /artifacts/key.pem
    Protocols h2 http/1.1
    SSLProxyEngine On
    SSLProxyVerify require
    SSLProxyCACertificateFile /artifacts/cert.pem
    ProxyPass /plain/ http://backend:8080/plain/
    ProxyPass /h2/ h2://backend:8443/h2/
    ProxyPass / https://backend:8443/
</VirtualHost>
