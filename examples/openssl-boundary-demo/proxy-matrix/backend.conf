daemon off;
master_process off;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events {}
http {
    log_format matrix escape=json '{"role":"backend","path":"$uri","id":"$http_x_matrix_id","traceparent":"$http_traceparent","connection":"$connection","requests":$connection_requests,"protocol":"$server_protocol","status":$status,"backend":"$hostname","client_verify":"$ssl_client_verify"}';
    access_log /dev/stdout matrix;
    server {
        listen 8080;
        listen 8443 ssl;
        http2 on;
        ssl_certificate /artifacts/cert.pem;
        ssl_certificate_key /artifacts/key.pem;
        location / {
            default_type application/json;
            return 200 '{"path":"$uri","id":"$http_x_matrix_id","traceparent":"$http_traceparent","connection":"$connection","requests":$connection_requests,"protocol":"$server_protocol","backend":"$hostname","client_verify":"$ssl_client_verify"}\n';
        }
    }
    server {
        listen 9443 ssl;
        ssl_certificate /artifacts/cert.pem;
        ssl_certificate_key /artifacts/key.pem;
        location / { return 503; }
    }
    server {
        listen 9444 ssl;
        ssl_certificate /artifacts/cert.pem;
        ssl_certificate_key /artifacts/key.pem;
        ssl_client_certificate /artifacts/cert.pem;
        ssl_verify_client on;
        location / {
            default_type application/json;
            return 200 '{"path":"$uri","id":"$http_x_matrix_id","traceparent":"$http_traceparent","connection":"$connection","requests":$connection_requests,"protocol":"$server_protocol","backend":"$hostname","client_verify":"$ssl_client_verify"}\n';
        }
    }
}
