services:
  edge-apache:
    image: httpd:2.4.69-alpine@sha256:070da7661f0be8a05430b2c125c0cde9e53176b4048c813024021969a0e3893c
    container_name: edge-apache
    network_mode: host
    volumes:
      - ./docker/edge/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./shared:/usr/local/apache2/conf/shared:ro
      - ./htdocs:/usr/local/apache2/htdocs:ro
    depends_on:
      - recommendations-v1
      - recommendations-v2

  recommendations-v1:
    image: httpd:2.4.69-alpine@sha256:070da7661f0be8a05430b2c125c0cde9e53176b4048c813024021969a0e3893c
    container_name: recommendations-v1-apache
    network_mode: host
    volumes:
      - ./docker/recommendations-v1/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./shared:/usr/local/apache2/conf/shared:ro
      - ./htdocs:/usr/local/apache2/htdocs:ro

  recommendations-v2:
    image: httpd:2.4.69-alpine@sha256:070da7661f0be8a05430b2c125c0cde9e53176b4048c813024021969a0e3893c
    container_name: recommendations-v2-apache
    network_mode: host
    volumes:
      - ./docker/recommendations-v2/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./shared:/usr/local/apache2/conf/shared:ro
      - ./htdocs:/usr/local/apache2/htdocs:ro
    depends_on:
      - recommendations-v1

  traffic-generator:
    build:
      context: .
      dockerfile: traffic-runner/Dockerfile
    container_name: apache-traffic-generator
    network_mode: host
    command:
      - --base-url
      - http://127.0.0.1:8080
      - --progress-seconds
      - "15"
    depends_on:
      - edge-apache

  obi:
    image: ${OBI_IMAGE:-otel/ebpf-instrument:v1.0.0@sha256:a68d70e934260f72540f157ccf4fb4adfa38f11de060d7d905696dad6a3fca02}
    container_name: obi-apache-example
    command:
      - --config=/config/obi-config.yaml
    network_mode: host
    pid: host
    privileged: true
    volumes:
      - ./docker/obi-config.yaml:/config/obi-config.yaml:ro
    depends_on:
      - edge-apache
      - recommendations-v1
      - recommendations-v2
      - traffic-generator
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:0.39.0@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    container_name: lgtm-apache-example
    network_mode: host
