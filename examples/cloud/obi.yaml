file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: "${CLOUD_SERVICE_NAME}"
    - name: service.namespace
      value: cloud
meter_provider:
  readers:
    - pull:
        exporter:
          prometheus/development:
            port: 9400
extensions:
  obi:
    version: "2.0"
    capture:
      policy:
        default_action: exclude
      rules:
        - action: include
          match:
            process:
              exe_path_glob: ["/opt/demo/*"]
    daemon:
      logging:
        debug_trace_output: text
