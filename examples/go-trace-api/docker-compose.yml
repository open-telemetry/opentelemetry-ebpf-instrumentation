services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      OTEL_SERVICE_NAME: go-trace-api-example
    ports:
      - "8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports:
      - "16686:16686"
      - "4317:4317"

  obi:
    image: ${OBI_IMAGE:-otel/ebpf-instrument:v1.0.0@sha256:a68d70e934260f72540f157ccf4fb4adfa38f11de060d7d905696dad6a3fca02}
    privileged: true
    pid: host
    environment:
      OTEL_EBPF_EXECUTABLE_PATH: go-trace-api
      OTEL_EBPF_OPEN_PORT: "8080"
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_LOG_LEVEL: ${OBI_LOG_LEVEL:-INFO}
      OTEL_EBPF_TRACE_PRINTER: ${OBI_TRACE_PRINTER:-disabled}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
    volumes:
      - /sys/kernel/security:/sys/kernel/security:ro
    depends_on:
      - app
      - jaeger
