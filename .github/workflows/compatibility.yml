name: Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Candidate revision to check out
        required: false
        type: string
      base_ref:
        description: Trusted target revision selecting the release line
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.head_ref || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: Fetch release metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Fetch GitHub API responses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import urllib.request

          repository = "open-telemetry/opentelemetry-ebpf-instrumentation"
          responses = {}

          def fetch(path):
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = json.load(response)
              responses[path] = data
              return data

          page = 1
          while True:
              releases = fetch(f"/repos/{repository}/releases?per_page=100&page={page}")
              # Preserve page lengths without publishing private draft metadata.
              responses[f"/repos/{repository}/releases?per_page=100&page={page}"] = [
                  {"draft": True} if release["draft"] else {
                      **{key: release[key] for key in ("tag_name", "draft", "prerelease", "immutable")},
                      "assets": [{"name": asset["name"]} for asset in release["assets"]],
                  }
                  for release in releases
              ]
              for release in releases:
                  tag = release["tag_name"]
                  if release["draft"] or release["prerelease"]:
                      continue
                  if not re.fullmatch(r"v[1-9][0-9]*\.[0-9]+\.[0-9]+", tag):
                      continue
                  path = f"/repos/{repository}/git/ref/tags/{tag}"
                  for _ in range(8):
                      obj = fetch(path)["object"]
                      if not re.fullmatch(r"[0-9a-f]{40}", obj["sha"]):
                          raise ValueError(f"Invalid object ID for {tag}")
                      if obj["type"] == "commit":
                          break
                      if obj["type"] != "tag":
                          raise ValueError(f"Unexpected object type for {tag}")
                      path = f"/repos/{repository}/git/tags/{obj['sha']}"
                  else:
                      raise ValueError(f"Cannot resolve {tag} to a commit")
              if len(releases) < 100:
                  break
              page += 1

          with open("release-metadata.json", "w") as output:
              json.dump(responses, output)
          PYTHON

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-release-metadata-${{ github.run_id }}
          path: release-metadata.json
          if-no-files-found: error
          retention-days: 1

  generate-bpf:
    name: Generate candidate and target BPF
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      base_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Compare against the base revision used in the tested merge commit.
      - name: Resolve target revision
        id: target
        env:
          BASE_REF: ${{ inputs.base_ref || (github.event_name == 'pull_request' && format('{0}^1', github.sha)) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: |
          set -Eeuo pipefail
          sha=$(git rev-parse --verify --end-of-options "${BASE_REF}^{commit}")
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/generate-bpf

      - name: Check out target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf
        with:
          artifact-name: bpf-base-${{ github.run_id }}

  go-api:
    name: Go API (${{ matrix.arch }}, advisory)
    needs: [generate-bpf, release-metadata]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.generate-bpf.outputs.base_sha }}
          path: testoutput/compatibility-base
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            internal/tools/go.sum

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-generated-${{ github.run_id }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-base-${{ github.run_id }}
          path: testoutput/compatibility-base

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatibility-release-metadata-${{ github.run_id }}
          path: testoutput/compatibility-metadata

      - name: Restore release assets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testoutput/compatibility-cache
          key: compatibility-assets-v1-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: compatibility-assets-v1-${{ matrix.arch }}-

      - name: Compare public Go API
        id: compare
        continue-on-error: true
        env:
          COMPAT_RELEASE_METADATA: ${{ github.workspace }}/testoutput/compatibility-metadata/release-metadata.json
          COMPAT_BASE_REF: ${{ needs.generate-bpf.outputs.base_sha }}
          COMPAT_BASE_DIR: ${{ github.workspace }}/testoutput/compatibility-base
          COMPAT_HEAD_REF: ${{ inputs.ref || github.sha }}
          COMPAT_ARCH: ${{ matrix.arch }}
        run: make check-compat

      - name: Summarize advisory result
        id: summary
        if: always()
        env:
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          report=testoutput/compatibility.json
          report_valid=false
          {
            printf '## Go API compatibility: linux/%s (advisory)\n\n' "$ARCH"
            printf 'Only the public root-module Go API is checked. Enforcement is not enabled.\n\n'
            if [[ ! -s "$report" ]]; then
              printf '**INCOMPLETE:** no report was produced; check prerequisite jobs and logs.\n'
            elif ! jq -e '.format_version == 2 and (.findings | type == "array") and (.existing_findings | type == "array") and (.unclassified_changes | type == "array") and (.existing_unclassified_changes | type == "array") and (.baselines | type == "array") and (.required_release | IN("patch", "minor", "major", "incomplete"))' "$report" >/dev/null; then
              printf '**INCOMPLETE:** the report is malformed; check the comparison logs.\n'
            elif jq -e '.error != null' "$report" >/dev/null; then
              printf '**INCOMPLETE:** the comparison could not be completed.\n\n'
              jq -r '.error' "$report"
            else
              report_valid=true
              jq -r '
                "Minimum Go API release class: **\(.required_release)**\n",
                (if (.findings | length) == 0
                 then "No incompatible public Go API changes introduced by this PR."
                 else "**Incompatible API changes introduced: \(.findings | length)**. See the report for affected declarations."
                 end)
              ' "$report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$COMPARE_OUTCOME" != success ]]; then
            printf '::warning::Go API compatibility is advisory; the comparison is incomplete or this PR introduces an incompatibility. See the report and logs.\n'
          fi
          if [[ "$report_valid" == true ]] && jq -e '.error == null and (.baselines | length > 0)' "$report" >/dev/null; then
            printf 'verified=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-go-api-${{ matrix.arch }}-${{ github.run_id }}
          path: testoutput/compatibility.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save release assets on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.summary.outputs.verified == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testoutput/compatibility-cache
          key: compatibility-assets-v1-${{ matrix.arch }}-${{ github.run_id }}
