name: Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Candidate revision to check out
        required: false
        type: string
      target_ref:
        description: Trusted target revision selecting the release line
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.head_ref || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: Fetch release metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Pin authenticated code independently of the PR checkout; update when changing the fetcher.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ce935251c5dd940b56a89c65973a4a0faa4990d8
          path: compatibility-tools
          sparse-checkout: scripts/compatibility-release-metadata.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Fetch GitHub API responses
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I compatibility-tools/scripts/compatibility-release-metadata.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-release-metadata-${{ github.run_id }}
          path: release-metadata.json
          if-no-files-found: error
          retention-days: 1

  generate-bpf:
    name: Generate candidate and target BPF
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Compare against the base revision used in the tested merge commit.
      - name: Resolve target revision
        id: target
        env:
          TARGET_REF: ${{ inputs.target_ref || (github.event_name == 'pull_request' && format('{0}^1', github.sha)) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: bash scripts/compatibility-target.sh

      - uses: $/.github/actions/generate-bpf

      - name: Check out target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf
        with:
          artifact-name: bpf-base-${{ github.run_id }}

  go-api:
    name: Go API (${{ matrix.arch }}, advisory)
    needs: [generate-bpf, release-metadata]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            internal/tools/go.sum

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-generated-${{ github.run_id }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-base-${{ github.run_id }}
          path: ${{ runner.temp }}/compatibility-target-bpf

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatibility-release-metadata-${{ github.run_id }}
          path: testoutput/compatibility-metadata

      - name: Restore release assets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testoutput/compatibility-cache
          key: compatibility-assets-v1-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: compatibility-assets-v1-${{ matrix.arch }}-

      - name: Compare public Go API
        id: compare
        continue-on-error: true
        env:
          COMPAT_RELEASE_METADATA: ${{ github.workspace }}/testoutput/compatibility-metadata/release-metadata.json
          COMPAT_TARGET: ${{ needs.generate-bpf.outputs.target_sha }}
          COMPAT_TARGET_BPF: ${{ runner.temp }}/compatibility-target-bpf
          COMPAT_ARCH: ${{ matrix.arch }}
        run: make check-compat

      - name: Summarize advisory result
        id: summary
        if: always()
        env:
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/compatibility-summary.sh

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-go-api-${{ matrix.arch }}-${{ github.run_id }}
          path: testoutput/compatibility.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save release assets on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.summary.outputs.verified == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testoutput/compatibility-cache
          key: compatibility-assets-v1-${{ matrix.arch }}-${{ github.run_id }}
