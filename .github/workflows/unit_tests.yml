name: Unit tests

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main, release-*]
    paths:
      - ".github/workflows/unit_tests.yml"
      - ".github/actions/generate-bpf/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "bpf/**"
      - "cmd/**"
      - "configs/**"
      - "internal/**"
      - "pkg/**"
      - "scripts/**"
      - "mise.toml"
      - "mise.lock"
      - ".mise/tasks/**"
      - ".mise/scripts/**"
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string

concurrency:
  group: pr-unit-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-bpf:
    name: Generate BPF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf

  matrix:
    name: Build test matrix
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: go
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up mise tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0 # zizmor: ignore[cache-poisoning] GitHub scopes PR caches to their ref

      - name: Test flaky-run supervisor
        run: mise run test-rerun-flaky

      - name: Build test matrix
        id: build-matrix
        env:
          PARTITIONS: 3
        run: |
          echo -n "matrix=" >> "$GITHUB_OUTPUT"
          mise run unit-test-matrix-json >> "$GITHUB_OUTPUT"

  test:
    name: "Unit tests #${{ matrix.shard.id }} (${{ matrix.platform.arch }})"
    needs: [matrix, generate-bpf]
    permissions:
      checks: write
      pull-requests: write
    runs-on: ${{ matrix.platform.runner }}
    env:
      MISE_ENABLE_TOOLS: go
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
        shard: ${{ fromJson(needs.matrix.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up mise tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0 # zizmor: ignore[cache-poisoning] GitHub scopes PR caches to their ref

      - name: Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go build cache is content-addressable and self-verifying
        with:
          path: ~/.cache/go-build
          key: go-build-pr-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: |
            go-build-pr-race-${{ runner.os }}-${{ runner.arch }}-

      - name: Download generated BPF files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Upstream semconv registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] pinned upstream semconv tarball, keyed on the version in schemas/obi/manifest.yaml
        with:
          path: schemas/obi/.deps
          key: semconv-deps-${{ hashFiles('schemas/obi/manifest.yaml') }}

      - name: Build test tools
        run: mise run prereqs

      - name: Run unit tests
        env:
          MATRIX_ID: ${{ matrix.shard.id }}
          MATRIX_PACKAGES: ${{ matrix.shard.packages }}
        run: |
          SHARD_ID="${MATRIX_ID}" UNIT_TEST_PACKAGES="${MATRIX_PACKAGES}" mise run run-unit-test-shard
          mise run cov-exclude-generated

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-reports-${{ matrix.shard.id }}-${{ matrix.platform.arch }}-${{ github.run_number }}
          path: testoutput/unit-test-shard-*.log
          retention-days: 5

      - name: Report coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./testoutput/cover.txt
          flags: unittests
          name: unit-coverage-${{ matrix.shard.id }}-${{ matrix.platform.arch }}-${{ github.run_number }}
