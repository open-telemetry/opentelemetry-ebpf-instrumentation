name: Pull request integration tests

on:
  push:
    branches: ["main", "release-*"]
  pull_request:
    branches: ["main", "release-*"]

permissions:
  contents: read

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: false

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.3

      - run: mkdir -p /home/runner/reports

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        # zizmor cache-poisoning fix: Only cache reports for non-pull requests or pull requests from the same repository
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          path: /home/runner/reports
          key: read-go-test-reports-${{ github.run_number }}
          restore-keys: go-test-reports-

      - name: build matrix
        id: build-matrix
        run: |
          (
            echo -n "matrix="
            go list -tags integration ./test/integration/... | gotestsum tool ci-matrix --debug \
              --partitions 5 \
              --timing-files '/home/runner/reports/*.log'
          ) >> $GITHUB_OUTPUT

  test:
    permissions:
      # Required for codecov
      checks: write
      pull-requests: write
      # Required for uploading artifacts
      actions: write
    name: "test ${{ matrix.description }}"
    needs: test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.test-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: false

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.3

      - name: Generate files
        run: make prereqs docker-generate

      - name: Run integration tests
        timeout-minutes: 60
        env:
          # zizmor template-injection fixes: pass data as env vars
          MATRIX_ID: ${{ matrix.id }}
          MATRIX_JSON: ${{ toJson(matrix) }}
          MATRIX_PACKAGES: ${{ matrix.packages }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo Partition
          echo "${MATRIX_JSON}"

          mkdir -p /home/runner/reports
          ~/go/bin/gotestsum -ftestname \
              --jsonfile=/home/runner/reports/test-run-"${RUN_NUMBER}"-"${MATRIX_ID}".log \
              -- -race -tags=integration ${MATRIX_PACKAGES}

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-test-reports-${{ github.run_number }}-${{ matrix.id }}
          path: /home/runner/reports/*.log
          retention-days: 5

      - name: Upload integration test logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: go-test-logs-${{ github.run_number }}-${{ matrix.id }}
          path: |
            testoutput/*.log
            testoutput/kind
