name: Renovate post-process
on:
  push:
    branches:
      - "renovate/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Generate cleanup patch
    if: github.repository == 'open-telemetry/opentelemetry-ebpf-instrumentation'
    runs-on: ubuntu-latest
    outputs:
      patch-exists: ${{ steps.create-patch.outputs.exists }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        name: Detect dependency manifest changes
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          else
            changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
          fi

          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '(^|/)go\.(mod|sum)$'; then
            echo "run_go=true" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '(^|/)(pom\.xml|build\.gradle(\.kts)?|settings\.gradle(\.kts)?|gradle\.properties)$'; then
            echo "run_java=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.detect.outputs.run_go == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Update Go dependency artifacts
        if: steps.detect.outputs.run_go == 'true'
        run: make go-mod-tidy go-notices-update

      - name: Update Java dependency notices
        if: steps.detect.outputs.run_java == 'true'
        run: make java-notices-update

      - id: create-patch
        name: Create patch file
        run: |
          git add -N --ignore-removal -- NOTICES ':(glob)**/go.mod' ':(glob)**/go.sum'
          git diff -- NOTICES ':(glob)**/go.mod' ':(glob)**/go.sum' > patch
          if [ -s patch ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch file
        if: steps.create-patch.outputs.exists == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: renovate-post-process-patch
          path: patch

  apply:
    name: Apply cleanup patch
    if: github.repository == 'open-telemetry/opentelemetry-ebpf-instrumentation'
    needs: generate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download patch
        if: needs.generate.outputs.patch-exists == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: renovate-post-process-patch
          path: ${{ runner.temp }}

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        if: needs.generate.outputs.patch-exists == 'true'
        id: generate-token
        with:
          app-id: ${{ vars.OTELBOT_APP_ID }}
          private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.generate.outputs.patch-exists == 'true'
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Apply patch and push
        if: needs.generate.outputs.patch-exists == 'true'
        run: |
          git config user.name otelbot
          git config user.email 197425009+otelbot@users.noreply.github.com

          git apply "${{ runner.temp }}/patch"
          git add --all -- NOTICES ':(glob)**/go.mod' ':(glob)**/go.sum'
          git commit -m "Run Renovate post-process"
          git push
