name: PR checks

on:
  push:
    branches: [main, release-*]
  pull_request:
    # Temporary for the migration branch; remove `mise` before merging to main.
    branches: [main, zeitlinger/mise, release-*]
    paths:
      - ".github/workflows/pull_request.yml"
      - ".github/actions/generate-bpf/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "bpf/**"
      - "cmd/**"
      - "collector/**"
      - "configs/**"
      - "devdocs/config/version-2.0/**"
      - "internal/**"
      - "pkg/**"
      - "schemas/**"
      - "scripts/**"
      - "Makefile"
      - "Dockerfile"
      - "**/*Dockerfile*"
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string

concurrency:
  group: pr-checks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-bpf:
    name: Generate BPF
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf
        with:
          cache-downloads: "${{ inputs.ref == '' || inputs.ref == null }}"
          cache-go-build: "${{ inputs.ref == '' || inputs.ref == null }}"

  checks:
    name: Generated files and repo hygiene
    needs: generate-bpf
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up mise tools
        uses: $/.github/actions/setup-mise
        env:
          MISE_ENABLE_TOOLS: go
        with:
          cache-downloads: "${{ inputs.ref == '' || inputs.ref == null }}"

      - name: Go module cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ runner.arch }}-

      - name: Go build cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go build cache is content-addressable and self-verifying
        with:
          path: ~/.cache/go-build
          key: go-build-pr-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: |
            go-build-pr-race-${{ runner.os }}-${{ runner.arch }}-

      - name: Download generated BPF files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Upstream semconv registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] pinned upstream semconv tarball, keyed on the version in schemas/obi/manifest.yaml
        with:
          path: schemas/obi/.deps
          key: semconv-deps-${{ hashFiles('schemas/obi/manifest.yaml') }}

      - name: Build test tools
        run: make prereqs

      - name: Run checks
        run: make go-mod-tidy license-header-check notices-update check-go-mod check-ebpf-ver-synced check-config-schema check-config-v2-artifacts check-clean-work-tree

  clang-format:
    name: Clang format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check clang-format
        run: |
          files=$( \
            git diff --name-status origin/main...HEAD \
            | awk '$1 != "D" && $2 !~ /^(NOTICES|bpf\/bpfcore)\// && /\.(c|cpp|h)$/ { print ($3 != "" ? $3 : $2) }' \
          )
          if [ -z "$files" ]; then
            echo "No C/C++ files modified."
            exit 0
          fi
          make docker-clang-format CLANG_FORMAT_FILES="$(echo $files)"
          if ! git diff --exit-code $files; then
            echo "Error: Some files are not formatted correctly. Run make docker-clang-format CLANG_FORMAT_FILES=\"$(echo $files)\"."
            exit 1
          fi

  clang-tidy:
    name: Clang tidy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Run clang-tidy
        run: make docker-clang-tidy

  collector-cross-compile:
    name: "Collector cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})"
    needs: generate-bpf
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported platforms (full OBI eBPF support)
          - { goos: linux,   goarch: amd64  }
          - { goos: linux,   goarch: arm64  }
          # Unsupported platforms (factory stubs — must compile, return errUnsupportedPlatform at runtime)
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x   }
          - { goos: linux,   goarch: "386"   }
          - { goos: windows, goarch: amd64  }
          - { goos: windows, goarch: arm64  }
          - { goos: darwin,  goarch: amd64  }
          - { goos: darwin,  goarch: arm64  }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up mise tools
        uses: $/.github/actions/setup-mise
        env:
          MISE_ENABLE_TOOLS: go
        with:
          cache-downloads: "${{ inputs.ref == '' || inputs.ref == null }}"

      - name: Go module cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ runner.arch }}-

      - name: Go build cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go build cache is content-addressable and self-verifying
        with:
          path: ~/.cache/go-build
          key: go-build-cross-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: |
            go-build-cross-${{ matrix.goos }}-${{ matrix.goarch }}-

      - name: Download generated BPF files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Build collector package
        working-directory: collector
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  otel-collector-example:
    name: OTel Collector example (ocb build)
    needs: generate-bpf
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up mise tools
        uses: $/.github/actions/setup-mise
        env:
          MISE_ENABLE_TOOLS: go
        with:
          cache-downloads: "${{ inputs.ref == '' || inputs.ref == null }}"

      - name: Go module cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ runner.arch }}-

      - name: Go build cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go build cache is content-addressable and self-verifying
        with:
          path: ~/.cache/go-build
          key: go-build-otelcol-example-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: |
            go-build-otelcol-example-${{ runner.os }}-${{ runner.arch }}-

      - name: Download generated BPF files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Create builder install directory
        run: mkdir -p "${{ runner.temp }}/ocb-bin"

      - name: Resolve ocb version from builder config
        id: ocb
        shell: bash
        run: |
          # Pin ocb to the Collector release line used by the example (see #2264).
          version=$(awk '$1 == "go.opentelemetry.io/collector/exporter/otlpexporter" { print $2; exit }' examples/otel-collector/builder-config.yaml)
          if [ -z "$version" ]; then
            echo "could not determine collector version from builder config" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install ocb
        env:
          GOBIN: ${{ runner.temp }}/ocb-bin
          OCB_VERSION: ${{ steps.ocb.outputs.version }}
        run: go install go.opentelemetry.io/collector/cmd/builder@"${OCB_VERSION}"

      - name: Build collector distribution
        working-directory: examples/otel-collector
        env:
          GOBIN: ${{ runner.temp }}/ocb-bin
        run: "$GOBIN/builder --config ./builder-config.yaml"

      - name: Validate Config v2 collector configuration
        working-directory: examples/otel-collector
        run: ./otelcol-dev/otelcol-dev validate --config ./config.yaml

      - name: Smoke test Config v2 collector receiver
        working-directory: examples/otel-collector
        run: sudo ./smoke-test.sh
