name: Node.js Span Bridge CI

on:
  push:
    branches: ["main", "release-*"]
  pull_request:
    branches: ["main", "release-*"]
    paths:
      - "pkg/internal/nodejs/**"
      - ".github/workflows/nodejs.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string

concurrency:
  group: nodejs-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test span bridge (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 20, 22]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0 # zizmor: ignore[cache-poisoning] npm ci verifies dependency integrity via package-lock.json
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: pkg/internal/nodejs/spanbridge_test/package-lock.json

      - name: Run Node.js span-bridge tests
        run: make test-nodejs
