name: Java Agent CI

on:
  push:
    branches: ["main", "release-*"]
  pull_request:
    branches: ["main", "release-*"]
    paths:
      - "pkg/internal/java/**"
      - "mise.toml"
      - "mise.lock"
      - ".mise/tasks/**"
      - ".github/workflows/java-agent.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string

concurrency:
  group: java-agent-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: pkg/internal/java

jobs:
  build:
    name: Build and test (Java ${{ matrix.test-java }})
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: gradle

    strategy:
      matrix:
        test-java: [8, 11, 17, 21]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Mise downloads cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] mise verifies every download against mise.lock checksums
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Set up mise tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false

      - name: Set up JDK for running Gradle
        id: gradle-jdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: pkg/internal/java/.java-version

      - name: Set up JDK ${{ matrix.test-java }} for testing
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.test-java }}


      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Check code formatting (Spotless)
        env:
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ steps.gradle-jdk.outputs.path }}
        run: gradle spotlessCheck --no-daemon --stacktrace

      - name: Build agent
        env:
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ steps.gradle-jdk.outputs.path }}
        run: gradle build -x test --no-daemon --stacktrace

      - name: Verify native libraries
        run: |
          set -Eeuo pipefail

          agent_jar="build/obi-java-agent.jar"
          entries_file="${RUNNER_TEMP}/obi-java-agent-entries.txt"
          unzip -Z1 "${agent_jar}" > "${entries_file}"

          for native_library in \
            native/linux-amd64/libobijni.so \
            native/linux-aarch64/libobijni.so; do
            if ! grep -Fqx "${native_library}" "${entries_file}"; then
              printf 'Missing %s from %s\n' "${native_library}" "${agent_jar}" >&2
              exit 1
            fi
          done

      - name: Run tests on JDK ${{ matrix.test-java }}
        env:
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ steps.gradle-jdk.outputs.path }}
        run: |
          cat > /tmp/obi-test-jvm.init.gradle <<'EOF'
          allprojects {
            tasks.withType(Test).configureEach {
              executable = System.getenv("JAVA_HOME") + "/bin/java"
            }
          }
          EOF

          gradle test -I /tmp/obi-test-jvm.init.gradle --no-daemon --stacktrace

      - name: Upload build artifacts
        if: matrix.test-java == 21
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obi-java-agent
          path: pkg/internal/java/build/obi-java-agent.jar
          retention-days: 7
