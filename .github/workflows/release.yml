name: Release

on:
  push:
    tags:
      # N.B. These workflows also trigger on this tag pattern:
      # - publish_dockerhub_main.yml
      # - publish_dockerhub_k8s_cache_main.yml
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.2.3)"
        required: true
        type: string

# https://docs.zizmor.sh/audits/#excessive-permissions
permissions: {}

jobs:
  # Verify CI checks passed on the tagged commit and tag is valid.
  verify:
    name: Verify CI Status
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag format
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKFLOW_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$WORKFLOW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag must match format v*.*.* (e.g., v1.2.3), got: $WORKFLOW_TAG"
            exit 1
          fi
          echo "Tag format validated: $WORKFLOW_TAG"

      - name: Check required workflows passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          WORKFLOW_TAG: ${{ inputs.tag }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          # Get the commit SHA for the tag/ref
          if [ "$WORKFLOW_EVENT" = "workflow_dispatch" ]; then
            COMMIT_SHA=$(git rev-parse "$WORKFLOW_TAG")
          else
            COMMIT_SHA="$GITHUB_SHA"
          fi

          echo "Verifying CI status for commit: $COMMIT_SHA"
          ./.github/scripts/verify-ci-status.sh "$GITHUB_REPOSITORY" "$COMMIT_SHA"

  release:
    name: Draft Release
    needs: verify # Create draft release only after verification.
    runs-on: ubuntu-latest
    permissions:
      contents: write # https://github.com/softprops/action-gh-release#permissions
    steps:
      - name: Create GitHub draft release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          repository: open-telemetry/opentelemetry-ebpf-instrumentation
          generate_release_notes: true
          draft: true
