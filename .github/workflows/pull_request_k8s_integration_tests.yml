name: Integration tests K8S

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main, release-*]
    paths:
      - ".github/workflows/pull_request_k8s_integration_tests.yml"
      - ".github/actions/free-disk/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "bpf/**"
      - "cmd/**"
      - "configs/**"
      - "internal/**"
      - "pkg/**"
      - "scripts/**"
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string
    secrets:
      DOCKER_TOKEN_EBPF_INSTRUMENTATION:
        description: "Docker Hub token for pulling images (optional)"
        required: false

concurrency:
  group: pr-integration-k8s-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-bpf:
    name: Generate BPF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf
        with:
          cache-downloads: ${{ inputs.ref == '' || inputs.ref == null }}
          cache-go-build: ${{ inputs.ref == '' || inputs.ref == null }}
          cache-key-prefix: go-build-k8s-integration-race

  test-matrix:
    name: "Build matrix"
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: go
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Mise downloads cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] mise verifies every download against mise.lock checksums
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Set up mise tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false

      - name: Build test matrix
        id: build-matrix
        run: |
          echo -n "matrix=" >> $GITHUB_OUTPUT
          mise run test:integration:k8s:matrix >> $GITHUB_OUTPUT

  build-images:
    name: Build shared test images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [generate-bpf]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Download generated BPF files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Build and save shared test images
        run: |
          docker build -t obi:dev -f internal/test/integration/components/obi/Dockerfile .
          docker build -t testserver:dev -f internal/test/integration/components/testserver/Dockerfile .
          docker build -t httppinger:dev -f internal/test/integration/components/httppinger/Dockerfile .
          docker save obi:dev testserver:dev httppinger:dev -o /tmp/k8s-test-images.tar

      - name: Upload shared test images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8s-test-images-amd64-${{ github.run_id }}
          path: /tmp/k8s-test-images.tar
          retention-days: 1
          overwrite: true

  test:
    name: ${{ matrix.basename }}
    needs: [test-matrix, generate-bpf, build-images]
    permissions:
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: go
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/free-disk

      - name: Check for Docker Hub token
        id: check-docker-token
        run: |
          if [ -n "${DOCKER_TOKEN}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN_EBPF_INSTRUMENTATION }}

      - name: Log in to Docker Hub
        if: steps.check-docker-token.outputs.has_token == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN_EBPF_INSTRUMENTATION }}

      - name: Mise downloads cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] mise verifies every download against mise.lock checksums
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Set up mise tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false

      - name: Go module cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ runner.arch }}-

      - name: Go build cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go build cache is content-addressable and self-verifying
        with:
          path: ~/.cache/go-build
          key: go-build-k8s-integration-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: |
            go-build-k8s-integration-race-${{ runner.os }}-${{ runner.arch }}-

      - name: Download generated BPF files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Upstream semconv registry cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] pinned upstream semconv tarball, keyed on the version in schemas/obi/manifest.yaml
        with:
          path: schemas/obi/.deps
          key: semconv-deps-${{ hashFiles('schemas/obi/manifest.yaml') }}

      - name: Build test tools
        run: mise run prereqs

      - name: Download shared test images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: k8s-test-images-amd64-${{ github.run_id }}
          path: /tmp/k8s-test-images

      - name: Load shared test images
        run: |
          docker load -i /tmp/k8s-test-images/k8s-test-images.tar
          rm -f /tmp/k8s-test-images/k8s-test-images.tar

      - name: Check disk usage before tests
        run: df -h

      - name: Run integration tests
        env:
          MATRIX_ID: ${{ matrix.id }}
          MATRIX_JSON: ${{ toJson(matrix) }}
          MATRIX_TEST_PATTERN: ${{ matrix.test_pattern }}
          RUN_NUMBER: ${{ github.run_number }}
          PREBUILT_IMAGES: "obi:dev,testserver:dev,httppinger:dev"
        run: |
          echo Partition
          echo "${MATRIX_JSON}"

          if [ -z "${MATRIX_TEST_PATTERN}" ]; then
            echo "Error: Test pattern is empty for shard $MATRIX_ID"
            exit 1
          fi

          mkdir -p /home/runner/reports

          go tool -modfile=./internal/tools/go.mod gotestsum \
              --rerun-fails=2 --rerun-fails-max-failures=2 --rerun-fails-abort-on-data-race \
              --packages="${MATRIX_TEST_PATTERN}" -ftestname \
              --jsonfile=/home/runner/reports/test-run-"${RUN_NUMBER}"-"${MATRIX_ID}".log \
              -- -race -count=1 -timeout 40m \
              ${MATRIX_TEST_PATTERN}

      - name: Process coverage data
        run: mise run itest-coverage-data

      - name: Report coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./testoutput/itest-covdata.txt
          flags: k8s-integration-test
          name: integration-k8s-coverage-${{ matrix.basename }}-${{ github.run_number }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-k8s-reports-${{ matrix.basename }}-${{ github.run_number }}
          path: /home/runner/reports/*.log
          retention-days: 5

      - name: Upload test logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-k8s-logs-${{ matrix.basename }}-${{ github.run_number }}
          path: |
            testoutput/*.log
            testoutput/kind

      - name: Check final disk usage
        if: always()
        run: df -h
