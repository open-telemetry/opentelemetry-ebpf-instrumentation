name: Renovate post-process patch
on:
  push:
    branches:
      - "renovate/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Generate cleanup patch
    if: github.repository == 'open-telemetry/opentelemetry-ebpf-instrumentation' && github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        name: Detect dependency manifest changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          fi

          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '(^|/)go\.(mod|sum)$'; then
            echo "run_go=true" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '(^|/)(pom\.xml|build\.gradle(\.kts)?|settings\.gradle(\.kts)?|gradle\.properties)$'; then
            echo "run_java=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.detect.outputs.run_go == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Update Go dependency artifacts
        if: steps.detect.outputs.run_go == 'true'
        run: make go-mod-tidy go-notices-update

      - name: Update Java dependency notices
        if: steps.detect.outputs.run_java == 'true'
        run: make java-notices-update

      - id: create-patch
        name: Create patch file
        run: |
          git add -N --ignore-removal -- NOTICES ':(glob)**/go.mod' ':(glob)**/go.sum'
          git diff -- NOTICES ':(glob)**/go.mod' ':(glob)**/go.sum' > patch
          if [ -s patch ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch file
        if: steps.create-patch.outputs.exists == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: renovate-post-process-patch
          path: patch
          retention-days: 1
