name: "Weekly Test Analysis Report"

on:
  schedule:
    # Mondays at 07:00 UTC — one hour after the daily run at 06:00, so the
    # current Monday's daily snapshot is available before the rollup starts.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: "Only include runs created on or after this date (YYYY-MM-DD); defaults to 7 days ago"
        required: false
        type: string

# actions:read is needed to list daily workflow runs and download their
# snapshot artifacts via the gh CLI.
permissions:
  actions: read
  contents: read

jobs:
  rollup:
    name: "Roll up weekly CI test results"
    uses: $/.github/workflows/test_analysis_report.yml
    with:
      mode: weekly
      since: ${{ inputs.since || '' }}

  update-test-weights:
    name: "Update integration test shard weights"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    if: github.repository == 'open-telemetry/opentelemetry-ebpf-instrumentation'
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] the push step needs the checkout credentials

      - name: Regenerate shard weights from recent main runs
        id: weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(./scripts/update-test-weights.sh)"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Check for weight changes
        id: diff
        run: |
          if git diff --quiet -- scripts/integration-test-weights.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.diff.outputs.changed == 'true'
        id: generate-token
        with:
          client-id: ${{ vars.OTELBOT_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          WEIGHTS_SUMMARY: ${{ steps.weights.outputs.summary }}
        run: |
          message="Update integration test shard weights"
          body="Regenerated scripts/integration-test-weights.generated.json from the gotestsum reports of recent successful Integration tests runs on main: $WEIGHTS_SUMMARY"
          branch="otelbot/integration-test-weights"

          git config user.name otelbot
          git config user.email 197425009+otelbot@users.noreply.github.com

          git checkout -B "$branch"
          git commit -m "$message" -- scripts/integration-test-weights.generated.json
          git push --force origin "$branch"

          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          if [ -z "$pr" ]; then
            gh pr create --title "$message" --body "$body" --base main --head "$branch"
          else
            gh pr edit "$pr" --body "$body"
          fi
