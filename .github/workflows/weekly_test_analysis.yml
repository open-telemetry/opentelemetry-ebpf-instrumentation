name: "Weekly Test Analysis Report"

on:
  schedule:
    # Mondays at 07:00 UTC — one hour after the daily run at 06:00, so the
    # current Monday's daily snapshot is available before the rollup starts.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: "Only include runs created on or after this date (YYYY-MM-DD); defaults to 7 days ago"
        required: false
        type: string

# actions:read is needed to list daily workflow runs and download their
# snapshot artifacts via the gh CLI.
permissions:
  actions: read
  contents: read

jobs:
  rollup:
    name: "Roll up weekly CI test results"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci-analysis/
            go.mod
            go.sum
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Compute snapshot date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generate weekly test analysis report
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since || '' }}
          SNAPSHOT_OUT: ${{ github.workspace }}/weekly-snapshot/snapshot.json
        run: bash scripts/ci-analysis/weekly.sh >> "$GITHUB_STEP_SUMMARY"

      # Retention of 32 days covers a future monthly rollup with safety
      # margin (4 weeklies + ~4 days), mirroring the 8-day retention on
      # daily snapshots vs. the 7-day weekly window.
      - name: Upload weekly snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-weekly-snapshot-${{ steps.date.outputs.today }}-${{ github.run_id }}
          path: weekly-snapshot/snapshot.json
          retention-days: 32
          if-no-files-found: error

  update-test-weights:
    name: "Update integration test shard weights"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'open-telemetry/opentelemetry-ebpf-instrumentation'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate shard weights from recent main runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-test-weights.sh

      - name: Check for weight changes
        id: diff
        run: |
          if git diff --quiet -- scripts/integration-test-weights.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.diff.outputs.changed == 'true'
        id: generate-token
        with:
          client-id: ${{ vars.OTELBOT_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          message="Update integration test shard weights"
          body="Regenerated scripts/integration-test-weights.generated.json from the gotestsum reports of the last 10 successful Integration tests runs on main."
          branch="otelbot/integration-test-weights"

          git config user.name otelbot
          git config user.email 197425009+otelbot@users.noreply.github.com
          gh auth setup-git

          git checkout -B "$branch"
          git commit -m "$message" -- scripts/integration-test-weights.generated.json
          git push --force origin "$branch"

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "$message" --body "$body" --base main --head "$branch"
          fi
