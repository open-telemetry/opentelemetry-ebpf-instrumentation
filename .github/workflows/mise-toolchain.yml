name: Mise toolchain consistency

on:
  pull_request:
    branches: [main, mise, release-*]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pinned tool versions
        run: python3 scripts/check_mise_versions.py
      - name: Test mismatch detection
        run: python3 -m unittest discover -s scripts -p 'test_check_mise_versions.py'
      - name: Set up mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
      - name: Verify installed tools
        run: |
          mise exec -- go version
          mise exec -- golangci-lint --version
