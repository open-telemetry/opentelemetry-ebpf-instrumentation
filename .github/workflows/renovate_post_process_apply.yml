name: Renovate post-process apply
on:
  workflow_run:
    workflows:
      - Renovate post-process patch
    branches:
      - "renovate/**"
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  probe:
    name: Probe cleanup patch artifact
    if: >
      github.repository == 'open-telemetry/opentelemetry-ebpf-instrumentation' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/') &&
      github.event.workflow_run.actor.login == 'renovate[bot]'
    outputs:
      patch_exists: ${{ steps.probe.outputs.exists }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check patch artifact
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "renovate-post-process-patch") | .id' | head -n1)"
          if [ -n "$artifact_id" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  apply:
    name: Apply cleanup patch
    needs: probe
    if: needs.probe.outputs.patch_exists == 'true'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download patch artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "renovate-post-process-patch") | .id' | head -n1)"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > artifact.zip
          unzip -q artifact.zip -d artifact

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: generate-token
        with:
          app-id: ${{ vars.OTELBOT_APP_ID }}
          private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Verify branch tip
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          test "$current_sha" = "$EXPECTED_SHA"

      - name: Apply patch and push
        env:
          GH_APP_TOKEN: ${{ steps.generate-token.outputs.token }}
          PATCH_PATH: artifact/patch
          TARGET_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          git config user.name otelbot
          git config user.email 197425009+otelbot@users.noreply.github.com

          git apply "$PATCH_PATH"
          git add --all -- NOTICES ':(glob)**/go.mod' ':(glob)**/go.sum'
          git commit -m "Run Renovate post-process"
          auth_header="$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:$TARGET_REF"
