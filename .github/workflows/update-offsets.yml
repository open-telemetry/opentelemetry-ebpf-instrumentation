name: Update offsets
on:
  schedule:
    - cron: '1 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  UpdateOffsets:
    permissions:
      contents: write  # Required for creating PRs
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: go
    if: github.repository == 'open-telemetry/opentelemetry-ebpf-instrumentation'
    steps:
    - name: "Checkout repo"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
    - name: Mise downloads cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/mise/downloads-cas
        key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

    - name: Set up mise tools
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        cache: false
    - name: "Update offsets"
      run: |
        mise run update-offsets
        mise run update-python-offsets
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: generate-token
      with:
        client-id: ${{ vars.OTELBOT_CLIENT_ID }}
        private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
    - name: "Create/update PR"
      env:
        # not using secrets.GITHUB_TOKEN since pull requests from that token do not run workflows
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      run: |
        message="Update generated Go offsets"
        body="The generated Go field offsets and runtime ABI facts have been updated."
        branch="otelbot/offset-content-auto-update"

        git config user.name otelbot
        git config user.email 197425009+otelbot@users.noreply.github.com
  
        git checkout -b $branch
        git commit -a -m "$message"
        git push --set-upstream origin $branch
        gh pr create --title "$message" \
                     --body "$body" \
                     --base main
