name: Update offsets
on:
  schedule:
    - cron: '1 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  UpdateOffsets:
    permissions:
      contents: write  # Required for creating PRs
    runs-on: ubuntu-26.04
    if: github.repository == 'open-telemetry/opentelemetry-ebpf-instrumentation'
    steps:
    - name: "Checkout repo"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
    - name: "Update Go"
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        cache: 'false'
        go-version: '>=1.25'
        check-latest: true
    - name: "Update offsets"
      run: make update-offsets update-python-offsets
    - name: "Check for offset changes"
      id: diff
      run: |
        if git diff --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      if: steps.diff.outputs.changed == 'true'
      id: generate-token
      with:
        client-id: ${{ vars.OTELBOT_CLIENT_ID }}
        private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
        permission-pull-requests: write
    - name: "Create/update PR"
      if: steps.diff.outputs.changed == 'true'
      env:
        # not using secrets.GITHUB_TOKEN since pull requests from that token do not run workflows
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      run: |
        message="Update generated Go offsets"
        body="The generated Go field offsets and runtime ABI facts have been updated."
        branch="otelbot/offset-content-auto-update"

        git config user.name otelbot
        git config user.email 197425009+otelbot@users.noreply.github.com

        git checkout -B "$branch"
        git commit -a -m "$message"
        git push --force origin "$branch"

        if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
          gh pr create --title "$message" --body "$body" --base main --head "$branch"
        fi
