name: Lint

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main, release-*]
    paths:
      - ".github/workflows/lint.yml"
      - "Dockerfile"
      - "**/*Dockerfile*"
      - "mise.toml"
      - "mise.lock"
      - ".mise/tasks/**"
      - ".mise/scripts/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "bpf/**"
      - "cmd/**"
      - "devdocs/dependency-integrity-policy.md"
      - "devdocs/README.md"
      - "scripts/lint-dependency-policy.sh"
      - "configs/**"
      - "internal/**"
      - "pkg/**"
      - "schemas/**"
      - "scripts/**"
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string
      skip_mise_cache:
        description: "Skip restoring the Mise download and Go caches"
        required: false
        type: boolean
        default: false

concurrency:
  group: pr-lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # macOS runners lack Docker, so generate the eBPF bindings once on Linux.
  # once on Linux, share artifact with all lint jobs.
  generate-bpf:
    name: Generate BPF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf
        with:
          cache-downloads: ${{ !inputs.skip_mise_cache && (inputs.ref == '' || inputs.ref == null) }}
          cache-go-build: ${{ !inputs.skip_mise_cache && (inputs.ref == '' || inputs.ref == null) }}

  lint-linux:
    name: Lint on linux (${{ matrix.platform.arch }})
    needs: generate-bpf
    runs-on: ${{ matrix.platform.runner }}
    env:
      MISE_ENABLE_TOOLS: go,golangci-lint,github:open-telemetry/weaver
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Mise downloads cache
        if: ${{ !inputs.skip_mise_cache && (inputs.ref == '' || inputs.ref == null) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] mise verifies every download against mise.lock checksums
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Set up mise tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false

      - name: Go module cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ runner.arch }}-

      - name: Go build cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go build cache is content-addressable and self-verifying
        with:
          path: ~/.cache/go-build
          key: go-build-pr-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: |
            go-build-pr-race-${{ runner.os }}-${{ runner.arch }}-

      - name: Download generated BPF files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Validate Mise tasks
        if: matrix.platform.arch == 'amd64'
        run: mise tasks validate

      - name: Lint
        run: mise run lint

      # Schema lint is arch-neutral (weaver YAML/JSON). Keep it on amd64 only.
      - name: Lint OBI semantic-convention registry
        if: matrix.platform.arch == 'amd64'
        run: mise run lint:schema

      - name: Test OBI semantic-convention registry provenance
        if: matrix.platform.arch == 'amd64'
        run: mise run test-schema

      - name: Check published OBI telemetry schema files
        if: matrix.platform.arch == 'amd64'
        run: mise run check:schema-files

      - name: Check generated OBI telemetry reference docs
        if: matrix.platform.arch == 'amd64'
        run: mise run check:schema-docs

  lint-darwin:
    name: Lint on macOS
    needs: generate-bpf
    runs-on: macos-latest
    env:
      MISE_ENABLE_TOOLS: go,golangci-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Mise downloads cache
        if: ${{ !inputs.skip_mise_cache && (inputs.ref == '' || inputs.ref == null) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] mise verifies every download against mise.lock checksums
        with:
          # mise's default cache dir on macOS
          path: ~/Library/Caches/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Set up mise tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false

      - name: Go module cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ runner.arch }}-

      - name: Go build cache
        if: ${{ inputs.ref == '' || inputs.ref == null }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go build cache is content-addressable and self-verifying
        with:
          # Go's default GOCACHE on macOS
          path: ~/Library/Caches/go-build
          key: go-build-pr-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: |
            go-build-pr-race-${{ runner.os }}-${{ runner.arch }}-

      - name: Download generated BPF files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Lint
        run: mise run lint
