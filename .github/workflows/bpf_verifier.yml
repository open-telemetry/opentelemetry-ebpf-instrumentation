name: BPF verifier
run-name: >-
  BPF verifier${{ inputs.pr_number && format(' · PR #{0}', inputs.pr_number) || '' }}${{ inputs.ref && format(' @ {0}', inputs.ref) || '' }}

# Not run on every PR: comment /verifier-tests to dispatch it (see
# slash_command_verifier_tests.yml). Still runs on push to main/release-*,
# and on PRs that touch this workflow or the VM harness it launches.
on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main, release-*]
    paths:
      - ".github/workflows/bpf_verifier.yml"
      - ".github/actions/setup-lvh-kernel/**"
      - "internal/test/vm/**"
      - "scripts/kernel-matrix-json.sh"
      - "Makefile"
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string
      pr_number:
        description: "PR number this dispatch is associated with (informational; surfaced in run-name)"
        required: false
        type: string

concurrency:
  group: bpf-verifier-${{ inputs.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-bpf:
    name: Generate BPF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf

  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kernels: ${{ steps.k.outputs.kernels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: k
        run: |
          amd64=$(bash scripts/kernel-matrix-json.sh --kind=verifier --arch=amd64)
          arm64=$(bash scripts/kernel-matrix-json.sh --kind=verifier --arch=arm64)
          echo -n "kernels=" >> "$GITHUB_OUTPUT"
          jq -c -n --argjson amd64 "$amd64" --argjson arm64 "$arm64" \
            '{include: (
                ($amd64.include | map(. + {runner: "ubuntu-latest"})) +
                ($arm64.include | map(. + {runner: "ubuntu-24.04-arm"}))
              )}' >> "$GITHUB_OUTPUT"

  # One static verifier.test per GOARCH. CGO_ENABLED=0 so the Alpine
  # launchvm rootfs and AL2023 initramfs can exec it. Cross-compiled on
  # ubuntu-latest so kernel jobs do not each pay go test -c.
  precompile:
    name: Precompile tests
    needs: generate-bpf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Download generated BPF files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Precompile verifier tests
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p artifacts/amd64 artifacts/arm64
          GOOS=linux GOARCH=amd64 go test -c -ldflags="-s -w" -tags=bpf_verifier_tests \
            -o artifacts/amd64/verifier.test ./pkg/internal/ebpf/verifier/
          GOOS=linux GOARCH=arm64 go test -c -ldflags="-s -w" -tags=bpf_verifier_tests \
            -o artifacts/arm64/verifier.test ./pkg/internal/ebpf/verifier/

      - name: Upload verifier.test (amd64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-test-amd64
          path: artifacts/amd64/verifier.test
          retention-days: 1

      - name: Upload verifier.test (arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-test-arm64
          path: artifacts/arm64/verifier.test
          retention-days: 1

  test:
    name: Kernel ${{ matrix.kernel.id }} (${{ matrix.kernel.arch }})
    needs: [matrix, precompile]
    runs-on: ${{ matrix.kernel.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.matrix.outputs.kernels).include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/free-disk
        with:
          docker-prune: 'false'

      - name: Download precompiled verifier tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verifier-test-${{ matrix.kernel.arch }}
          path: compiled-tests

      - name: Install QEMU
        env:
          ARCH: ${{ matrix.kernel.arch }}
        run: |
          sudo apt-get update
          case "$ARCH" in
            arm64) pkg=qemu-system-arm ;;
            *)     pkg=qemu-system-x86 ;;
          esac
          sudo apt-get install -y --no-install-recommends qemu-utils "$pkg"

      - id: kernel
        uses: $/.github/actions/setup-lvh-kernel
        with:
          kernel-id: ${{ matrix.kernel.id }}
          lvh-tag: ${{ matrix.kernel.lvh_tag }}
          arch: ${{ matrix.kernel.arch }}

      - name: Run BPF verifier tests in VM
        env:
          KERNEL: ${{ steps.kernel.outputs.kernel }}
          MODULES_DIR: ${{ steps.kernel.outputs.modules-dir }}
          ARCH: ${{ matrix.kernel.arch }}
        run: |
          chmod +x compiled-tests/verifier.test
          sudo make -C internal/test/vm \
            KERNEL="$KERNEL" \
            MODULES_DIR="$MODULES_DIR" \
            ARCH="$ARCH" \
            QEMU_SMP="$(nproc)" \
            TARGET_TEST=run-bpf-verifier-vm \
            PRECOMPILED_TESTS_DIR="$(pwd)/compiled-tests" \
            && [ -f testoutput/success ]

  al2023:
    name: Kernel al2023-${{ matrix.nvr }}
    needs: precompile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - nvr: "6.1.172-216.329.amzn2023"
            pkg: "kernel"
          - nvr: "6.12.88-119.157.amzn2023"
            pkg: "kernel6.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/free-disk
        with:
          docker-prune: 'false'

      - name: Download precompiled verifier tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verifier-test-amd64
          path: compiled-tests

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86 cpio

      - name: Run BPF verifier on AL2023 kernel
        env:
          VERIFIER_TEST_BIN: ${{ github.workspace }}/compiled-tests/verifier.test
        run: |
          chmod +x "$VERIFIER_TEST_BIN"
          sudo -E bash internal/test/vm/lvh/al2023/run.sh "${{ matrix.nvr }}" "${{ matrix.pkg }}"

  host-arm64:
    name: Host kernel (arm64)
    # Runs verifier suite directly on the runner's own kernel — no VM, no
    # kernel matrix. Cheapest way to keep arm64 in the PR-blocking set.
    needs: precompile
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Download precompiled verifier tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verifier-test-arm64
          path: compiled-tests

      - name: Run BPF verifier tests (host kernel)
        run: |
          chmod +x compiled-tests/verifier.test
          sudo compiled-tests/verifier.test -test.count=1 -test.timeout=55m -test.parallel=8
