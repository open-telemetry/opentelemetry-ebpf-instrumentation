name: BPF verifier
run-name: >-
  BPF verifier${{ inputs.pr_number && format(' · PR #{0}', inputs.pr_number) || '' }}${{ inputs.ref && format(' @ {0}', inputs.ref) || '' }}

# Not run on every PR: comment /verifier-tests to dispatch it (see
# slash_command_verifier_tests.yml). Still runs on push to main/release-*,
# and on PRs that touch this workflow or the VM harness it launches.
on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main, release-*]
    paths:
      - ".github/workflows/bpf_verifier.yml"
      - ".github/actions/setup-lvh-kernel/**"
      - "internal/test/vm/**"
      - "scripts/kernel-matrix-json.sh"
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string
      pr_number:
        description: "PR number this dispatch is associated with (informational; surfaced in run-name)"
        required: false
        type: string

concurrency:
  group: bpf-verifier-${{ inputs.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-bpf:
    name: Generate BPF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf

  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kernels: ${{ steps.k.outputs.kernels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: k
        run: |
          echo -n "kernels=" >> "$GITHUB_OUTPUT"
          bash scripts/kernel-matrix-json.sh --kind=verifier --arch=amd64 >> "$GITHUB_OUTPUT"

  test:
    name: Kernel ${{ matrix.kernel.id }} (${{ matrix.kernel.arch }})
    needs: [matrix, generate-bpf]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.matrix.outputs.kernels).include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/free-disk
        with:
          docker-prune: 'false'

      - name: Download generated BPF files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86

      - id: kernel
        uses: $/.github/actions/setup-lvh-kernel
        with:
          kernel-id: ${{ matrix.kernel.id }}
          lvh-tag: ${{ matrix.kernel.lvh_tag }}
          arch: amd64

      - name: Run BPF verifier tests in VM
        env:
          KERNEL: ${{ steps.kernel.outputs.kernel }}
          MODULES_DIR: ${{ steps.kernel.outputs.modules-dir }}
        run: |
          sudo make -C internal/test/vm \
            KERNEL="$KERNEL" \
            MODULES_DIR="$MODULES_DIR" \
            ARCH=amd64 \
            QEMU_SMP="$(nproc)" \
            TARGET_TEST=run-bpf-verifier-vm \
            && [ -f testoutput/success ]

  al2023:
    name: Kernel al2023-${{ matrix.nvr }}
    needs: generate-bpf
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - nvr: "6.1.172-216.329.amzn2023"
            pkg: "kernel"
          - nvr: "6.12.88-119.157.amzn2023"
            pkg: "kernel6.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/free-disk
        with:
          docker-prune: 'false'

      - name: Download generated BPF files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86 cpio

      - name: Run BPF verifier on AL2023 kernel
        env:
          GOTOOLCHAIN: auto
        run: sudo -E bash internal/test/vm/lvh/al2023/run.sh "${{ matrix.nvr }}" "${{ matrix.pkg }}"

  host-arm64:
    name: Host kernel (${{ matrix.runner }})
    # Native ARM, full constant matrix. kernels.yaml still lists LVH arm64.
    # cncf-ubuntu-2-8-arm is a CNCF-hosted OCI Ampere VM (2 OCPU / 8 GiB).
    needs: generate-bpf
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - cncf-ubuntu-2-8-arm
    steps:
      - name: Host kernel and KVM
        run: |
          echo "HOST_RUNNER=${{ matrix.runner }}"
          echo "HOST_UNAME=$(uname -a)"
          echo "HOST_KERNEL=$(uname -r)"
          echo "HOST_MACHINE=$(uname -m)"
          echo "HOST_NPROC=$(nproc)"
          if [ -e /dev/kvm ]; then
            echo "KVM_DEV=present $(ls -l /dev/kvm)"
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM_RW=yes"
            else
              echo "KVM_RW=no id=$(id)"
            fi
          else
            echo "KVM_DEV=absent"
            echo "KVM_RW=no"
          fi
          echo "KVM_LSMOD=$(lsmod 2>/dev/null | awk '/kvm/ {print $1}' | paste -sd, - || true)"
          echo "KVM_NESTED=$(cat /sys/module/kvm/parameters/nested 2>/dev/null || echo n/a)"
          echo "=== lscpu ==="
          lscpu 2>/dev/null || true
          echo "=== /proc/cpuinfo (kvm-related) ==="
          grep -E '^(Features|flags|CPU architecture|CPU implementer|CPU part|model name)' /proc/cpuinfo | sort -u || true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go build cache is content-addressable and self-verifying
        with:
          path: ~/.cache/go-build
          key: go-build-pr-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: |
            go-build-pr-race-${{ runner.os }}-${{ runner.arch }}-

      - name: Download generated BPF files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Run BPF verifier tests (host kernel)
        run: go test -exec=sudo -count=1 -timeout=55m -parallel=8 -tags=bpf_verifier_tests ./pkg/internal/ebpf/verifier/...
