name: Free disk space
description: |
  Remove preinstalled toolchains, languages and SDKs that no OBI CI job
  uses, plus prune Docker. Recovers ~25-30 GiB on ubuntu-latest runners,
  which keeps the VM/integration workflows from hitting "no space left"
  during qcow2 builds or compose-stack image loads. Does nothing when /
  already has at least min-free-gb available, since the cleanup itself
  costs ~2 minutes per amd64 job.

inputs:
  docker-prune:
    description: 'Run docker system/builder prune. Skip on fresh runners.'
    required: false
    default: 'true'
  min-free-gb:
    description: 'Skip the cleanup when / already has at least this many GiB available.'
    required: false
    default: '50'

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      env:
        DOCKER_PRUNE: ${{ inputs.docker-prune }}
        MIN_FREE_GB: ${{ inputs.min-free-gb }}
      run: |
        set -e
        avail_gb=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
        if [ "$avail_gb" -ge "$MIN_FREE_GB" ]; then
          echo "${avail_gb}G available on / (>= ${MIN_FREE_GB}G), skipping cleanup"
          df -h /
          exit 0
        fi
        sudo rm -rf \
          /usr/lib/jvm \
          /usr/share/dotnet \
          /usr/share/swift \
          /usr/local/.ghcup \
          /usr/local/julia* \
          /usr/local/lib/android \
          /usr/local/share/chromium \
          /opt/microsoft \
          /opt/google \
          /opt/az \
          /usr/local/share/powershell \
          /opt/hostedtoolcache/CodeQL
        if [ "$DOCKER_PRUNE" = "true" ]; then
          docker system prune -af || true
          docker builder prune -af || true
        fi
        df -h
