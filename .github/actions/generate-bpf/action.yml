name: Generate BPF
description: |
  Run the Mise BPF generation task and publish the resulting `_bpfel.go` +
  `_bpfel.o` files as a workflow artifact. Caller must `actions/checkout`
  first so the task can resolve the repository configuration.

inputs:
  artifact-name:
    description: 'Artifact name to upload BPF files under. Default keys on github.run_id.'
    required: false
    default: bpf-generated-${{ github.run_id }}
  cache-key-prefix:
    description: 'Prefix for the Go build cache. Defaults to the umbrella PR prefix.'
    required: false
    default: go-build-pr-race

runs:
  using: composite
  steps:
    - name: Set up mise
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0 # zizmor: ignore[cache-poisoning] GitHub scopes PR caches to their ref
      env:
        MISE_ENABLE_TOOLS: go,python,clang,conda:llvm-tools

    - name: Go build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go build cache is content-addressable and self-verifying
      with:
        path: ~/.cache/go-build
        key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.go', 'go.sum') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Generate BPF files
      shell: bash
      env:
        MISE_ENABLE_TOOLS: go,python,clang,conda:llvm-tools
      run: mise run generate

    - name: Upload generated BPF files
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          **/*_bpfel.go
          **/*_bpfel.o
        retention-days: 1
