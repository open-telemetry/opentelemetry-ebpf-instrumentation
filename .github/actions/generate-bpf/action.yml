name: Generate BPF
description: |
  Run `make docker-generate` and publish the resulting `_bpfel.go` +
  `_bpfel.o` files as a workflow artifact. The files are cached on the
  generation inputs, so generation only runs when one of them changes.
  Caller must `actions/checkout` first so this composite can resolve the
  local Go module + Makefile.

inputs:
  artifact-name:
    description: 'Artifact name to upload BPF files under. Must be unique in the run: release.yml calls several workflows that each upload one.'
    required: true

runs:
  using: composite
  steps:
    # every input of the generation: BPF sources, bpf2go directives with their package names, and the Makefile, which pins the generator image
    - name: Compute generated BPF files cache key
      id: cache-key
      shell: bash
      run: |
        directive='^//go:generate \$BPF2GO'
        inputs="$({
          git ls-files -s -- bpf Makefile .github/actions/generate-bpf
          git grep -l -e "${directive}" -- '*.go' | xargs git grep -H -e "${directive}" -e '^package ' --
        } | sha256sum | cut -d' ' -f1)"
        echo "key=bpf-generated-${inputs}" >> "$GITHUB_OUTPUT"

    - name: Cache generated BPF files
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] key is a content hash of every generation input; the files only feed test jobs
      with:
        path: |
          **/*_bpfel.go
          **/*_bpfel.o
        key: ${{ steps.cache-key.outputs.key }}

    # no cache: generation fills only the module cache and would save it, without a build cache, under the test jobs' keys
    - name: Set up Go
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: false

    - name: Pre-pull generator image
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        IMG=$(grep -E "^GEN_IMG \?= " Makefile | awk '{print $3}')
        for i in 1 2 3 4 5; do
          if docker pull "$IMG"; then
            exit 0
          fi
          echo "pull attempt $i failed, retrying in $((i*5))s"
          sleep $((i*5))
        done
        echo "all pull attempts failed"
        exit 1

    - name: Generate BPF files
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: make docker-generate

    - name: Upload generated BPF files
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          **/*_bpfel.go
          **/*_bpfel.o
        retention-days: 1
