name: Generate BPF
description: |
  Run the Mise BPF generation task and publish the resulting `_bpfel.go` +
  `_bpfel.o` files as a workflow artifact. Caller must `actions/checkout`
  first so the task can resolve the repository configuration.

inputs:
  artifact-name:
    description: 'Artifact name to upload BPF files under. Default keys on github.run_id.'
    required: false
    default: bpf-generated-${{ github.run_id }}
  cache-key-prefix:
    description: 'Prefix for the Go build cache. Defaults to the umbrella PR prefix.'
    required: false
    default: go-build-pr-race
  cache-downloads:
    description: Whether to cache Mise downloads.
    required: false
    default: 'true'
  cache-go-build:
    description: Whether to cache the Go build directory.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Mise downloads cache
      if: ${{ inputs.cache-downloads == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/mise/downloads-cas
        key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

    - name: Set up mise
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        cache: false
      env:
        MISE_ENABLE_TOOLS: go,clang,conda:llvm-tools,go:github.com/cilium/ebpf/cmd/bpf2go

    - name: Go build cache
      if: ${{ inputs.cache-go-build == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go build cache is content-addressable and self-verifying
      with:
        path: ~/.cache/go-build
        key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.go', 'go.sum') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Generate BPF files
      shell: bash
      env:
        MISE_ENABLE_TOOLS: go,clang,conda:llvm-tools,go:github.com/cilium/ebpf/cmd/bpf2go
      run: mise run generate

    - name: Upload generated BPF files
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          **/*_bpfel.go
          **/*_bpfel.o
        retention-days: 1
